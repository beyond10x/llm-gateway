domain: llm-gateway.upstream

# The typed home of the nouns story:hosted-endpoints and story:target-fallback introduce.
# HostedEndpoint is implemented (crates/llm-gateway-cli/src/hosted.rs) and observed through the
# `Relay` and `Exchange` commands of llm-gateway.gateway (HostedEndpoint says how).
# PLANNED: TargetAttempt; no code implements it yet and checks/conformance observes none of it.
# story:target-fallback adds its observation and the scenarios that hold its implementation to
# these declarations.
#
# Today a relayed model is served by whatever single target the embedding's target source hands
# out: a Runpod pod (llm-gateway.deployment.ProviderKind) or a hosted endpoint
# (llm-gateway.deployment.HostedDeclaration; llm-gateway.gateway RelayObservation, steps 7-8).
# The route inventory the owner reads already describes more: an ordered target list per route,
# positions contiguous from zero, a `fallback_enabled` flag, and per target the authentication
# and billing kinds below (crates/llm-gateway/src/inventory.rs:58-138). Nothing acts on a
# position after 0.
#
# BOUNDARY: llm owns the client side of both nouns: protocol clients, credentials and ordered
# fallback (beyond10x/llm spec/domains/routing.yaml at ee2ae428, `llm.routing.FallbackRun`).
# Its rule is the one a gateway fallback needs: a failure falls back to the next declared target
# only while no output of the failed attempt reached the caller; an attempt that showed any
# output is final. A crate here that needs that code takes it by tag (AGENTS.md "Dependencies on
# llm"), and the gateway crate cannot take it at all: llm-routing pulls llm-credentials and
# tokio into a closure crates/llm-gateway/tests/dependency_boundary.rs keeps empty
# (docs/gateway.md "What the crate cannot do, structurally").
types:
  # How a target authenticates upstream (inventory.rs:58-64, wire names `anonymous`, `bearer`,
  # `api-key`). The kind is inspectable; the material is never in the inventory.
  - name: llm-gateway.upstream.AuthKind
    kind: enum
    variants: [Anonymous, Bearer, ApiKey]
  # How a target is billed (inventory.rs:77-82, wire names `metered`, `subscription`,
  # `self-hosted`). A Runpod pod is `SelfHosted`.
  - name: llm-gateway.upstream.BillingKind
    kind: enum
    variants: [Metered, Subscription, SelfHosted]
  # What became of one position of a route for one request. `NotTried`: an earlier position
  # answered, or fallback is disabled for the route.
  - name: llm-gateway.upstream.AttemptResult
    kind: enum
    variants: [Relayed, Failed, NotTried]
  # Why an attempt moved on. The first five are row W7's failures, which also report the target
  # failed to the target source. `RateLimited` is a 429 while a later position remains untried:
  # the target is kept, as W7 keeps it, and the request moves on. A 429 from the last position
  # reaches the client unchanged, as it does today.
  # DECIDED 2026-10-06: a 429 falls back, following llm's routing, which falls back on a
  # rate-limited failure (beyond10x/llm spec/domains/routing.yaml at ee2ae428).
  - name: llm-gateway.upstream.AttemptFailure
    kind: enum
    variants: [Unreachable, ClosedWithoutAnswer, Status502, Status503, Status504, RateLimited]
entities:
  # A model endpoint the gateway reaches over the network that no hosting controller owns: a
  # vendor API or an OpenAI-compatible server somebody else runs. Nothing is provisioned or
  # stopped for it, so it has no llm-gateway.hosting record.
  #
  # DECIDED 2026-10-14 (story:hosted-endpoints), the declaration: a section of its own. The
  # closed deployment document declares each model a hosted endpoint serves as one
  # `[hosted.<alias>]` table (llm-gateway.deployment.HostedDeclaration), beside the Runpod
  # models of `[models.<alias>]`; `endpoint_id` is that alias. A provider kind beside
  # `runpod-vllm` would have kept the Runpod model table, whose `hf_model`, `image`,
  # `gpu_types` and `max_model_len` a hosted model does not have.
  #
  # How a relayed request reaches it (llm-gateway.gateway `Relay`, steps 7-8): the request goes
  # to the wire's path joined to the endpoint's base path (`base_url` below) at the endpoint's
  # authority, `host` set to that authority, on each wire the
  # model declares; the endpoint is handed out at once, never held, and is kept when a request
  # through it fails (`upstream-failed`): there is nothing to replace. An `http` endpoint is
  # reached over plain TCP; an `https` endpoint over the binary's one TLS client with the
  # shipped trust roots, the handshake and the certificate's verification, chain and host name,
  # completing before any request byte is written, so a certificate the gateway does not trust
  # ends the request `upstream-failed` with no request byte and no credential sent
  # (llm-gateway.deployment, the TLS client and its trust roots). Either connection gives up
  # connecting after 10 s, and its reads and writes each time out after 120 s.
  #
  # Observed through llm-gateway.gateway: a `Relay` program's model may name an `endpoint`, and
  # is then served by the binary's own hosted target source (`llm_gateway_cli::HostedTargets`)
  # reaching a fixture pod over plain TCP or TLS; RelayObservation's `connections` and
  # `received_heads` record what each endpoint accepted and received. An `Exchange` program may
  # name a `document`, whose route inventory the binary builds, and `withheld` strings no answer
  # may carry. The startup refusals of a credential file are process facts
  # (llm-gateway.deployment ESS-LIMIT), proved by `hosted_*` in
  # crates/llm-gateway-cli/tests/hosted.rs.
  #
  # DECIDED 2026-10-16 (story:routes-document): each route of an `llm.routes/1` document a
  # deployment names (llm-gateway.deployment.RoutesDeclaration) is served by one HostedEndpoint,
  # derived from the route's endpoint: `endpoint_id` the route name, `wires` the endpoint's
  # protocol alone, `upstream_model` the route's model id, `base_url` the endpoint's (which must
  # name its API path), `auth_kind` the endpoint's, `credential_file` its `file:` secret,
  # `credential_header` its `auth.header`, `headers` one, `anthropic-version` set to llm's
  # `ANTHROPIC_VERSION`, for a `messages` endpoint and none for any other (DECIDED in correction
  # round 1), and `billing_kind` llm's expansion of
  # the endpoint: `SelfHosted` for an `Anonymous` endpoint, `Metered` otherwise. The inventory
  # names its provider `routes` and its endpoint the route's endpoint name. Observed through the
  # `Relay` command's `routes_document` (llm-gateway.gateway) and by `routes_*` in
  # crates/llm-gateway-cli/tests/routes.rs.
  - name: llm-gateway.upstream.HostedEndpoint
    identity: {name: endpoint_id, type: String}
    fields:
      # The wires the endpoint speaks, each at its path. A request on one of them is relayed byte
      # for byte; a request on another wire is translated (story:gateway-translation;
      # llm-gateway.gateway `Relay` step 5) and sent to the endpoint on the first wire listed
      # here, with llm 0.6.0's client for that wire: to `<scheme>://<authority>` and the base
      # path (`/v1` without one) joined to the wire's path, as the join rule below has it; with
      # the credential as `auth_kind` says (`authorization: Bearer <credential>`,
      # `<credential_header>: <credential>`, or none); and with llm's own protocol headers
      # (`anthropic-version: 2023-06-01` on messages, `accept: text/event-stream`). The
      # endpoint's static `headers` are not sent on a translated request: llm's clients take no
      # caller headers, and the headers were declared for the wire they were written for. llm's
      # client trusts the `webpki-roots` Mozilla roots, as the binary's TLS client does.
      # DECIDED 2026-10-14: a list, as a Runpod model's `wires`, rather than one wire: one
      # vendor API commonly serves several (`chat` and `responses`).
      - {name: wires, type: 'List<llm-gateway.gateway.Wire>'}
      # The model name the endpoint expects; the alias unless the declaration names another.
      # The relay rewrites the request's `model` to it (row W2).
      - {name: upstream_model, type: String}
      # Where requests go: `http://` or `https://`, an authority `host[:port]`, and an optional
      # base path (no query, fragment or user information; the path's rule is
      # llm-gateway.deployment `HostedDeclaration`'s). The port
      # defaults to 80 for `http` and 443 for `https`.
      # The join rule. Every wire path starts `/v1/` (`/v1/chat/completions`, `/v1/responses`,
      # `/v1/messages`, and the output clamp's `/v1/messages/count_tokens`). A `base_url` with no
      # path, or only `/`, has no base path, and the request goes to the wire path. A base path
      # `B` replaces the wire path's leading `/v1`: the request goes to `B` followed by the rest
      # of the wire path. `https://openrouter.ai/api/v1` and `chat` reach
      # `/api/v1/chat/completions`; `https://api.openai.com/v1` and `responses` reach
      # `/v1/responses`; `https://gw.example/openai` and `chat` reach `/openai/chat/completions`.
      # `host` is the authority alone, whatever the path.
      # DECIDED 2026-10-16 (story:hosted-base-path): the base path replaces `/v1` rather than
      # being prepended to it, which is how OpenAI-compatible clients read a base URL that ends
      # `/v1`, while a base URL without a path, the only form admitted before, keeps reaching the
      # wire path unchanged. An `http` endpoint whose `auth_kind` is
      # not `Anonymous` must be on a loopback literal (`127.0.0.0/8`, `::1`) or `localhost`:
      # a credential is never sent in cleartext to a remote host, and the document is refused
      # `config:value` otherwise (llm-gateway.deployment `HostedDeclaration`). Never rendered
      # by the route inventory, which carries `endpoint_id` (docs/gateway.md "The route
      # inventory").
      - {name: base_url, type: String}
      - {name: auth_kind, type: llm-gateway.upstream.AuthKind}
      # The file holding the credential, read once at start through the trusted-file reader as
      # `owner_secret_file` is (`endpoint-credential:<rule>`,
      # llm-gateway.deployment.StartupRefusal). Absent exactly when `auth_kind` is `Anonymous`.
      - {name: credential_file, type: 'Optional<String>'}
      # The request header that carries the credential when `auth_kind` is `ApiKey`, whose
      # value is the credential itself, with no `authorization` header. Present exactly when
      # `auth_kind` is `ApiKey`. A `Bearer` endpoint gets `authorization: Bearer <credential>`,
      # and an `Anonymous` one neither. The owner's own credential is never sent to any
      # endpoint.
      # DECIDED 2026-10-06: the header is declared because vendors disagree on its name; no
      # source here fixes one.
      - {name: credential_header, type: 'Optional<String>'}
      # Static, non-secret request headers the endpoint is sent with every request, name to
      # value, written after `host` in name order and before the credential and the framing
      # headers (llm-gateway.gateway `Relay`, step 7); their rules are
      # llm-gateway.deployment `HostedDeclaration`'s `headers`. No client header is forwarded.
      # DECIDED 2026-10-16 (story:hosted-static-headers).
      - {name: headers, type: 'Map<String, String>'}
      - {name: billing_kind, type: llm-gateway.upstream.BillingKind}
    # DECIDED 2026-10-06: any endpoint that speaks one of the three wires is in scope, with no
    # vendor-specific code: an endpoint is described by its wires, its base URL and how it
    # authenticates. DECIDED 2026-10-16 (story:gateway-translation): a client may call such an
    # endpoint on any wire; one it does not speak is translated through llm's neutral turn,
    # within llm 0.6.0's supported subset (docs/gateway.md "Translation"), not as a claim of
    # vendor API equivalence.
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  # One position of one route, tried or not, for one request.
  #
  # UNMAPPED: how the deployment document declares a model's ordered targets and its fallback
  # flag. Today the binary builds one target per wire, numbers positions by wire rather than by
  # alternative, and sets `fallback_enabled` false (crates/llm-gateway-cli/src/serve.rs:96,
  # 117). Owner: story:target-fallback.
  - name: llm-gateway.upstream.TargetAttempt
    identity: {name: attempt_id, type: String}
    fields:
      - {name: route_alias, type: String}
      # The target's position in the route, from 0 (inventory.rs RouteSummary).
      - {name: position, type: Integer}
      - {name: target_id, type: String}
      - {name: result, type: llm-gateway.upstream.AttemptResult}
      # Present exactly when `result` is `Failed`.
      - {name: failure, type: 'Optional<llm-gateway.upstream.AttemptFailure>'}
      # Whether any byte of the request reached the target. A failed attempt that was sent may
      # have been billed; it is recorded, never assumed free (llm's FallbackRun keeps the same
      # fact as its dispatch).
      # DECIDED 2026-10-06: recorded, as llm records it.
      - {name: request_sent, type: Boolean}
      # Whether any byte of this attempt's answer reached the client. An attempt with this true
      # is final: nothing after it is tried.
      - {name: output_visible, type: Boolean}
    lifecycle: {initial: Recorded, states: [Recorded], terminal: [Recorded]}

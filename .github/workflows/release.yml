# Publishes the gateway image for a release tag: the root Dockerfile, built natively on an amd64
# and an arm64 runner, pushed by digest, then joined into one manifest list
# ghcr.io/beyond10x/llm-gateway:<version>. Releases are tagged by the bot App, whose tag push
# starts this workflow. A version the registry already holds is never replaced.
# crates/llm-gateway-cli/tests/release_workflow.rs checks this file.
name: Release image
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: read
  packages: write
concurrency:
  group: release-image-${{ github.ref_name }}
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/beyond10x/llm-gateway
jobs:
  version-is-new:
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse a version that already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          reference="$IMAGE:$GITHUB_REF_NAME"
          answer=$(docker buildx imagetools inspect "$reference" 2>&1) && status=0 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::$reference already exists; a release never replaces a published image"
            exit 1
          fi
          absent=no
          case "$answer" in
            *": not found" | *"manifest unknown"* | *"name unknown"*)
              [ "$status" -ne 127 ] && absent=yes ;;
            *denied* | *DENIED* | *unauthorized* | *UNAUTHORIZED*)
              # The registry answers denied for a package that was never created. Only the packages
              # API's own 404 says so; any other answer leaves the version unproven absent.
              package=$(gh api /orgs/beyond10x/packages/container/llm-gateway 2>&1) && pstatus=0 || pstatus=$?
              if [ "$pstatus" -ne 0 ] && [ "$pstatus" -ne 127 ]; then
                case "$package" in
                  *"HTTP 404"*) absent=yes ;;
                esac
              fi ;;
          esac
          if [ "$absent" != yes ]; then
            echo "$answer"
            echo "::error::the registry did not say whether $reference exists"
            exit 1
          fi
          echo "$reference is not in the registry yet"

  build:
    needs: version-is-new
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag's commit
        id: revision
        run: echo "sha=$(git rev-parse "$GITHUB_REF^{commit}")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push this platform's image by digest
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            SOURCE_SHA=${{ steps.revision.outputs.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Record the digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest-list:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse a version that appeared meanwhile, then push the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          reference="$IMAGE:$GITHUB_REF_NAME"
          answer=$(docker buildx imagetools inspect "$reference" 2>&1) && status=0 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::$reference already exists; a release never replaces a published image"
            exit 1
          fi
          absent=no
          case "$answer" in
            *": not found" | *"manifest unknown"* | *"name unknown"*)
              [ "$status" -ne 127 ] && absent=yes ;;
            *denied* | *DENIED* | *unauthorized* | *UNAUTHORIZED*)
              # The registry answers denied for a package that was never created. Only the packages
              # API's own 404 says so; any other answer leaves the version unproven absent.
              package=$(gh api /orgs/beyond10x/packages/container/llm-gateway 2>&1) && pstatus=0 || pstatus=$?
              if [ "$pstatus" -ne 0 ] && [ "$pstatus" -ne 127 ]; then
                case "$package" in
                  *"HTTP 404"*) absent=yes ;;
                esac
              fi ;;
          esac
          if [ "$absent" != yes ]; then
            echo "$answer"
            echo "::error::the registry did not say whether $reference exists"
            exit 1
          fi
          echo "$reference is not in the registry yet"
          set -e
          test "$(ls | wc -l)" -eq 2
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$reference"

type: ess-scenario/1
domain: llm-gateway.gateway
scenario: an-inventory-with-a-repeated-alias-is-refused
summary: two routes under one alias compose no gateway
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","inventory":{"routes":[{"route_id":"r0","alias":"same","fallback_enabled":false,"targets":[{"target_id":"t0","position":0}]},{"route_id":"r1","alias":"same","fallback_enabled":false,"targets":[{"target_id":"t0","position":0}]}]},"steps":[]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    error_code: inventory:duplicate-alias

type: ess-scenario/1
domain: llm-gateway.runpod
scenario: a-pod-that-misses-its-startup-deadline-is-terminated
summary: the startup deadline is inclusive; one millisecond past it the pod is terminated
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.runpod.Exercise
  input:
    program_json: '{"models":{"qwen":{}},"steps":[{"step":"ready_after","probes":4294967295},{"step":"ensure","alias":"qwen"},{"step":"advance","ms":600000},{"step":"ensure","alias":"qwen"},{"step":"advance","ms":1},{"step":"ensure","alias":"qwen"}]}'
  outcome: observed
assert:
- view: llm-gateway.runpod.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.runpod.LastExecution
  contains:
    results:
    - ok
    - err:starting
    - ok
    - err:starting
    - ok
    - err:startup-deadline
    terminations:
    - pod1

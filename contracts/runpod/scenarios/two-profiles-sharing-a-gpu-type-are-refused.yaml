type: ess-scenario/1
domain: llm-gateway.runpod
scenario: two-profiles-sharing-a-gpu-type-are-refused
summary: a GPU type declared in two profiles of one model refuses the declaration before Runpod is contacted
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm-gateway.runpod.Exercise
  input:
    program_json: '{"models":{"qwen":{"profiles":[{"name":"l40s-32k","gpu_types":["NVIDIA L40S"]},{"name":"wide","gpu_types":["NVIDIA H100 NVL","NVIDIA L40S"]}]}},"steps":[{"step":"ensure","alias":"qwen"}]}'
  outcome: observed
assert:
- view: llm-gateway.runpod.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.runpod.LastExecution
  contains:
    valid_program: true
    error_code: invalid-model:profile-conflict
    results: []
    create_calls: 0
    lists: 0

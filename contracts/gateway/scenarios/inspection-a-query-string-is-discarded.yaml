type: ess-scenario/1
domain: llm-gateway.gateway
scenario: inspection-a-query-string-is-discarded
summary: a query string changes neither a probe nor an inspection; the path alone decides, and no parameter is decoded
timeline:
- at: '2026-10-08T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","steps":[{"step":"mark_ready"},{"step":"send","raw":"GET /health?probe=1 HTTP/1.1\r\n\r\n"},{"step":"send","raw":"GET /ready?probe=1 HTTP/1.1\r\n\r\n"},{"step":"send","raw":"GET /v1/routes/code?alias=other HTTP/1.1\r\nauthorization: Bearer owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\r\n\r\n"},{"step":"send","raw":"GET /v1/routes/other?alias=code HTTP/1.1\r\nauthorization: Bearer owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\r\n\r\n"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    results:
    - ok
    - 200 live
    - 200 ready
    - 200 inspected
    - 404 route-unknown
    bodies:
    - '{"status":"live"}'
    - '{"status":"ready"}'
    - '{"route":{"route_id":"coding","alias":"code","fallback_enabled":false,"target_count":2,"targets":[{"target_id":"coding-primary","position":0,"protocol":"chat-completions","provider":"my-lab","account":"remote","endpoint":"remote-models","model":"large","binding_revision":"rev-1","auth_kind":"bearer","billing_kind":"metered","context_window":4096,"max_output_tokens":1024},{"target_id":"coding-secondary","position":1,"protocol":"chat-completions","provider":"my-lab","account":"remote","endpoint":"remote-models","model":"large","binding_revision":"rev-1","auth_kind":"bearer","billing_kind":"metered"}]}}'
    - '{"error":{"code":"route-unknown","message":"no such route alias"}}'

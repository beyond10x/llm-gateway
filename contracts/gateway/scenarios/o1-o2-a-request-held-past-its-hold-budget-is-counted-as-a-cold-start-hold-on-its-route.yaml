type: ess-scenario/1
domain: llm-gateway.gateway
scenario: o1-o2-a-request-held-past-its-hold-budget-is-counted-as-a-cold-start-hold-on-its-route
summary: a model-cold-start refusal is one Refused record and one cold-start hold on its model and wire
timeline:
- at: '2026-10-08T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["chat"]}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"warm\"}"]}]],"cold_starts":1,"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"code\"}"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"code\"}"},{"step":"scrape"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    results:
    - ok
    - 503 model-cold-start
    - 200 relayed
    - 200 scraped
    retry_after:
    - '30'
    - absent
    records:
    - model=code wire=chat disposition=Refused refusal=model-cold-start status=503 response_bytes=0 duration_ms=bounded tokens=absent
    - model=code wire=chat disposition=Relayed refusal=absent status=200 response_bytes=13 duration_ms=bounded tokens=absent
    acquired: 2
    scrapes:
    - 1 200 content-type=text/plain; version=0.0.4; charset=utf-8
    - 1 llmgw_inference_requests_total 2
    - 1 llmgw_upstream_failures_total 0
    - 1 llmgw_instruction_views_total 0
    - 1 llmgw_pod_starts_total 0
    - 1 llmgw_pod_start_failures_total 0
    - 1 llmgw_pod_reaps_total 0
    - 1 llmgw_endpoint_invalidations_total 0
    - 1 llmgw_cold_start_wait_seconds_total bounded
    - '1 llmgw_route_requests_total{model="code",wire="chat"} 2'
    - '1 llmgw_route_refusals_total{model="code",wire="chat"} 1'
    - '1 llmgw_route_upstream_status_failures_total{model="code",wire="chat"} 0'
    - '1 llmgw_route_cold_start_holds_total{model="code",wire="chat"} 1'
    - '1 llmgw_route_response_bytes_total{model="code",wire="chat"} 13'

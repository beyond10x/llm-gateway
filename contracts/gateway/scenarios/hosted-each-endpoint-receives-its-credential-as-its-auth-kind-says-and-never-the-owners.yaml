type: ess-scenario/1
domain: llm-gateway.gateway
scenario: hosted-each-endpoint-receives-its-credential-as-its-auth-kind-says-and-never-the-owners
summary: each endpoint gets the request on the same path, a bearer as authorization, an api-key in its own header, anonymous neither, and never a byte of the owner's credential
timeline:
- at: '2026-10-14T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"remote","upstream_model":"vendor-remote","wires":["chat","responses"],"endpoint":{"pod":"pod-1","scheme":"http","auth_kind":"bearer","credential":"endpoint-bearer-0123456789abcdef"}},{"alias":"keyed","upstream_model":"vendor-keyed","wires":["chat"],"endpoint":{"pod":"pod-2","scheme":"http","auth_kind":"api-key","credential":"endpoint-api-key-0123456789abcdef","credential_header":"X-Api-Key"}},{"alias":"open","upstream_model":"open-model","wires":["messages"],"endpoint":{"pod":"pod-3","scheme":"http","auth_kind":"anonymous"}}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"chat-1\"}"]},{"status":200,"content_type":"application/json","chunks":["{\"id\":\"resp-1\"}"]}],[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"chat-2\"}"]}],[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"msg-1\"}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"remote\",\"messages\":[]}"},{"step":"request","path":"/v1/responses","body":"{\"model\":\"remote\",\"input\":\"hi\"}"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"keyed\",\"messages\":[]}"},{"step":"request","path":"/v1/messages","body":"{\"model\":\"open\",\"max_tokens\":8,\"messages\":[]}"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: null
    results:
    - 'ok'
    - '200 relayed'
    - '200 relayed'
    - '200 relayed'
    - '200 relayed'
    bodies:
    - '{"id":"chat-1"}'
    - '{"id":"resp-1"}'
    - '{"id":"chat-2"}'
    - '{"id":"msg-1"}'
    upstream:
    - 'pod-1 POST /v1/chat/completions {"model":"vendor-remote","messages":[]}'
    - 'pod-1 POST /v1/responses {"model":"vendor-remote","input":"hi"}'
    - 'pod-2 POST /v1/chat/completions {"model":"vendor-keyed","messages":[]}'
    - 'pod-3 POST /v1/messages {"model":"open-model","max_tokens":8,"messages":[]}'
    authorizations:
    - 'Bearer endpoint-bearer-0123456789abcdef'
    - 'Bearer endpoint-bearer-0123456789abcdef'
    - 'absent'
    - 'absent'
    received_heads:
    - 'authorization: Bearer endpoint-bearer-0123456789abcdef | content-type: application/json | content-length: 39 | connection: close'
    - 'authorization: Bearer endpoint-bearer-0123456789abcdef | content-type: application/json | content-length: 38 | connection: close'
    - 'x-api-key: endpoint-api-key-0123456789abcdef | content-type: application/json | content-length: 38 | connection: close'
    - 'content-type: application/json | content-length: 51 | connection: close'
    connections:
    - 'pod-1 plain request'
    - 'pod-1 plain request'
    - 'pod-2 plain request'
    - 'pod-3 plain request'
    secret_upstream: false

type: ess-scenario/1
domain: llm-gateway.gateway
scenario: finished-calls-a-declared-bound-copies-a-call-within-it-and-names-the-sizes-of-one-over-it
summary: within a bound of 100 bytes a call's request and answer are copied, a stream as its events and a refusal without an answer; a call past the bound is handed both sizes
timeline:
- at: '2026-11-26T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","call_bytes":100,"models":[{"alias":"code","upstream_model":"served-code","wires":["chat","messages"]}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"a\"}"]},{"status":200,"content_type":"text/event-stream","framing":"chunked","chunks":["data: {\"a\":1}\n\n","data: {\"b\":2}\n\n"]},{"status":200,"content_type":"application/json","chunks":["{\"id\":\"a\"}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"code\"}"},{"step":"request","path":"/v1/messages","body":"{\"model\":\"code\",\"stream\":true}"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"nobody\"}"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"code\"}","pad_to_bytes":120}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: null
    results:
    - ok
    - 200 relayed
    - 200 relayed
    - 404 model-unknown
    - 200 relayed
    finished:
    - call=recorded path=/v1/chat/completions wire=chat route=code upstream=pod-1 attempts=1 queue_wait_ms=bounded ttft_ms=bounded ending=Complete refusal=absent cost_usd=absent session=287f169e87d4 harness=Other span=bounded bytes=copied request=16 answer=body:10
    - call=recorded path=/v1/messages wire=messages route=code upstream=pod-1 attempts=1 queue_wait_ms=bounded ttft_ms=bounded ending=Complete refusal=absent cost_usd=absent session=287f169e87d4 harness=Other span=bounded bytes=copied request=30 answer=events:2
    - call=recorded path=/v1/chat/completions wire=chat route=absent upstream=absent attempts=0 queue_wait_ms=absent ttft_ms=absent ending=Refused refusal=model-unknown cost_usd=absent session=287f169e87d4 harness=Other span=bounded bytes=copied request=18 answer=absent
    - call=recorded path=/v1/chat/completions wire=chat route=code upstream=pod-1 attempts=1 queue_wait_ms=bounded ttft_ms=bounded ending=Complete refusal=absent cost_usd=absent session=287f169e87d4 harness=Other span=bounded bytes=over-bound request=120 answer=10

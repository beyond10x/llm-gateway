type: ess-scenario/1
domain: llm-gateway.gateway
scenario: metrics-listener-serves-get-and-head-on-exactly-metrics-and-nothing-else
summary: the metrics-only listener serves GET and HEAD of exactly /metrics without the owner, and nothing else

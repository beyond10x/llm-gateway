type: ess-scenario/1
domain: llm-gateway.runpod
scenario: a-restarted-pool-adopts-its-own-pod-by-exact-identity-without-creating
summary: a pool restored from its records serves the pod they name, creating and terminating nothing
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.runpod.Exercise
  input:
    program_json: '{"models":{"qwen":{}},"steps":[{"step":"until_ready","alias":"qwen"},{"step":"restart"},{"step":"ensure","alias":"qwen"}]}'
  outcome: observed
assert:
- view: llm-gateway.runpod.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.runpod.LastExecution
  contains:
    results:
    - ready
    - ok
    - ready
    create_calls: 1
    terminations: []
    leases:
    - https://pod1-8000.proxy.runpod.net/v1/ qwen
    - https://pod1-8000.proxy.runpod.net/v1/ qwen

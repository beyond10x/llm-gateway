  #                      fragment
  #   billing_kind       as an endpoint's, default `metered`
  #   context_window     as an endpoint's, optional, 4096..=2000000
  #   max_output_tokens  optional, 1..=context_window (200000 when undeclared): the most
  #                      output a turn may ask for and the bound of the output a turn naming
  #                      none is given (half the window, at most 16384); the window when
  #                      undeclared; `config:value` on an endpoint
  #   anthropic_beta     optional, default empty (story:bedrock-llm-0-13): the `anthropic-beta`
  #                      names a messages client's header may carry into the `InvokeModel`
  #                      body's `anthropic_beta`, in the client's order; every other name is
  #                      dropped and logged by name. At most 32 distinct names, each by
  #                      `llm_core::anthropic_beta_name`; `config:value` on an endpoint and on
  #                      a model whose `api` is `converse`
  #   tool_calling       as an endpoint's, default `parsed`
  - name: llm-gateway.deployment.HostedDeclaration
    kind: struct
    fields:
      - {name: kind, type: llm-gateway.upstream.HostedKind}
      # Required for an `endpoint`, absent for a `bedrock` model.

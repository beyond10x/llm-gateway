type: ess-scenario/1
domain: llm-gateway.gateway
scenario: r1-each-served-setup-instructions-answer-counts-one-instruction-view
summary: every GET or HEAD / answered 200 counts one llmgw_instruction_views_total; the listing and a refused / count none
timeline:
- at: '2026-10-08T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["chat"],"tool_calling":"parsed"}],"pods":[],"steps":[{"step":"mark_ready"},{"step":"request","method":"GET","path":"/","body":"","credential":false},{"step":"request","method":"HEAD","path":"/","body":"","credential":false,"user_agent":"Mozilla/5.0"},{"step":"request","method":"GET","path":"/v1/models","body":"","credential":false},{"step":"request","method":"POST","path":"/","body":"","credential":false},{"step":"scrape"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay

type: ess-scenario/1
domain: llm-gateway.gateway
scenario: wake-and-status-take-the-owner-credential-under-ingress-auth-none
summary: with model calls admitted without a credential, the lifecycle routes still take the owner's
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","ingress_auth":"none","models":[{"alias":"small","upstream_model":"small","wires":["chat"]}],"pods":[[]],"lifecycle":{"wake":[],"status":[{"phase":"stopped"}]},"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/models/small/wake","body":"","credential":false},{"step":"request","path":"/v1/models/small/status","body":"","method":"GET","credential":false},{"step":"request","path":"/v1/models/small/status","body":"","method":"GET"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    results:
    - ok
    - 401 credential-absent
    - 401 credential-absent
    - 200 answered
    bodies:
    - '{"error":{"code":"credential-absent","message":"no owner credential was presented"}}'
    - '{"error":{"code":"credential-absent","message":"no owner credential was presented"}}'
    - '{"model":"small","phase":"stopped"}'
    lifecycle_asks:
    - status small

type: ess-scenario/1
domain: llm-gateway.runpod
scenario: an-unknown-model-is-refused-without-contacting-runpod
summary: an alias no model is declared under is refused before any listing or create
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.runpod.Exercise
  input:
    program_json: '{"models":{"qwen":{}},"steps":[{"step":"ensure","alias":"absent"}]}'
  outcome: observed
assert:
- view: llm-gateway.runpod.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.runpod.LastExecution
  contains:
    results:
    - err:unknown-model
    create_calls: 0
    lists: 0
    phases: []

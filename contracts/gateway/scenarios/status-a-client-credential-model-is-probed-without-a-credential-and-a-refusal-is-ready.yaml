type: ess-scenario/1
domain: llm-gateway.gateway
scenario: status-a-client-credential-model-is-probed-without-a-credential-and-a-refusal-is-ready
summary: an auth_kind client endpoint is probed with no credential and nothing of the caller's, and a 401 or 403 answer is ready; any other status outside 2xx is still unreachable
timeline:
- at: '2026-11-25T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","ingress_auth":"none","models":[{"alias":"subscription","upstream_model":"vendor-sub","wires":["messages"],"endpoint":{"pod":"pod-1","scheme":"http","auth_kind":"client"}},{"alias":"team","upstream_model":"vendor-team","wires":["messages"],"endpoint":{"pod":"pod-2","scheme":"http","auth_kind":"client"}},{"alias":"broken","upstream_model":"vendor-broken","wires":["messages"],"endpoint":{"pod":"pod-3","scheme":"http","auth_kind":"client"}}],"pods":[[{"status":401}],[{"status":403}],[{"status":500}]],"steps":[{"step":"mark_ready"},{"step":"request","method":"GET","path":"/v1/models/subscription/status","body":"","headers":["x-api-key: sk-client-0123456789abcdef","anthropic-version: 2023-06-01"]},{"step":"request","method":"GET","path":"/v1/models/team/status","body":""},{"step":"request","method":"GET","path":"/v1/models/broken/status","body":""}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: null
    results:
    - ok
    - 200 answered
    - 200 answered
    - 200 answered
    bodies:
    - '{"model":"subscription","phase":"ready"}'
    - '{"model":"team","phase":"ready"}'
    - '{"model":"broken","phase":"unreachable","sub_phase":"status-500"}'
    upstream:
    - 'pod-1 GET /v1/models '
    - 'pod-2 GET /v1/models '
    - 'pod-3 GET /v1/models '
    authorizations:
    - 'absent'
    - 'absent'
    - 'absent'
    received_heads:
    - 'accept: application/json | connection: close'
    - 'accept: application/json | connection: close'
    - 'accept: application/json | connection: close'
    secret_upstream: false
    acquired: 0
    records: []

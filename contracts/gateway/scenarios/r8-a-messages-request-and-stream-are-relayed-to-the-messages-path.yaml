type: ess-scenario/1
domain: llm-gateway.gateway
scenario: r8-a-messages-request-and-stream-are-relayed-to-the-messages-path
summary: POST /v1/messages, the Anthropic wire, reaches the target's /v1/messages, streaming and not
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["chat","responses","messages"]}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"msg-1\",\"type\":\"message\"}"]},{"status":200,"content_type":"text/event-stream","framing":"chunked","chunks":["event: message_start\ndata: {\"type\":\"message_start\"}\n\n","event: message_stop\ndata: {\"type\":\"message_stop\"}\n\n"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/messages","body":"{\"model\":\"code\",\"max_tokens\":16,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}"},{"step":"request","path":"/v1/messages","body":"{\"model\":\"code\",\"max_tokens\":16,\"stream\":true,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    results:
    - ok
    - 200 relayed
    - 200 relayed
    bodies:
    - '{"id":"msg-1","type":"message"}'
    - "event: message_start\ndata: {\"type\":\"message_start\"}\n\nevent: message_stop\ndata: {\"type\":\"message_stop\"}\n\n"
    upstream:
    - 'pod-1 POST /v1/messages {"model":"served-code","max_tokens":16,"messages":[{"role":"user","content":"hi"}]}'
    - 'pod-1 POST /v1/messages {"model":"served-code","max_tokens":16,"stream":true,"messages":[{"role":"user","content":"hi"}]}'
    acquired: 2
    invalidated: []
    released: 2

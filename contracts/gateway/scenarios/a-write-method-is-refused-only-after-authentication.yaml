type: ess-scenario/1
domain: llm-gateway.gateway
scenario: a-write-method-is-refused-only-after-authentication
summary: the owner's write is method-not-allowed with an Allow header; anybody else's is credential-absent
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","steps":[{"step":"mark_ready"},{"step":"send","raw":"POST /v1/routes HTTP/1.1\r\nauthorization: Bearer owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\r\ncontent-length: 0\r\n\r\n"},{"step":"send","raw":"DELETE /v1/routes/code HTTP/1.1\r\n\r\n"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    results:
    - ok
    - 405 method-not-allowed
    - 401 credential-absent
    headers:
    - www-authenticate=absent allow=GET, HEAD
    - www-authenticate=Bearer allow=absent

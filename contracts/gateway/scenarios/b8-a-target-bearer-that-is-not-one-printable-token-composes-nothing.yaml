type: ess-scenario/1
domain: llm-gateway.gateway
scenario: b8-a-target-bearer-that-is-not-one-printable-token-composes-nothing
summary: a bearer holding a space cannot be written into a head as one token, so it is refused when it is built and no gateway is composed
timeline:
- at: '2026-10-08T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["chat"],"bearer":"vllm key"}],"pods":[],"steps":[{"step":"mark_ready"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: bearer:not-printable-ascii
    results: []
    upstream: []
    acquired: 0

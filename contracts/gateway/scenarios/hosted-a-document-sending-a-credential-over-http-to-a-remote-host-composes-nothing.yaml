type: ess-scenario/1
domain: llm-gateway.gateway
scenario: hosted-a-document-sending-a-credential-over-http-to-a-remote-host-composes-nothing
summary: the binary refuses a document whose bearer endpoint is a remote host over plain http as config:value, so no credential is sent in cleartext, and nothing is composed
timeline:
- at: '2026-10-14T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","document":"listen = \"127.0.0.1:0\"\nowner_secret_file = \"/run/credentials/owner\"\n\n[hosted.remote]\nwires = [\"chat\", \"responses\"]\nbase_url = \"http://api.example.test:8080/\"\nauth_kind = \"bearer\"\ncredential_file = \"/run/credentials/remote\"\nbilling_kind = \"subscription\"\nupstream_model = \"vendor-large\"\n\n[hosted.local]\nwires = [\"chat\"]\nbase_url = \"http://127.0.0.1:8000/\"\nauth_kind = \"bearer\"\ncredential_file = \"/run/credentials/local\"\n\n[hosted.open]\nwires = [\"messages\"]\nbase_url = \"http://10.0.0.7:8000/\"\nauth_kind = \"anonymous\"\n","withheld":["api.example.test","/run/credentials/remote"],"steps":[{"step":"mark_ready"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    valid_program: true
    error_code: 'config:value'
    results: []
    secret_on_wire: null
    withheld_on_wire: null

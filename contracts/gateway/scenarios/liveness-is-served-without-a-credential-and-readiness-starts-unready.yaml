type: ess-scenario/1
domain: llm-gateway.gateway
scenario: liveness-is-served-without-a-credential-and-readiness-starts-unready
summary: the two probe paths answer without a credential, and a gateway starts not ready (server.rs Gateway::bind, decide)
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","steps":[{"step":"send","raw":"GET /health HTTP/1.1\r\nhost: 127.0.0.1\r\n\r\n"},{"step":"send","raw":"GET /ready HTTP/1.1\r\nhost: 127.0.0.1\r\n\r\n"},{"step":"is_ready"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    valid_program: true
    error_code: null
    results:
    - 200 live
    - 503 unready
    - ready=false
    bodies:
    - '{"status":"live"}'
    - '{"status":"unready"}'
    headers:
    - www-authenticate=absent allow=absent
    - www-authenticate=absent allow=absent
    ready: false

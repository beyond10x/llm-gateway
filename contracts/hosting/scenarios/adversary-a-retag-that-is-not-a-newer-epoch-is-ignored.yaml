type: ess-scenario/1
domain: llm-gateway.hosting
scenario: adversary-a-retag-that-is-not-a-newer-epoch-is-ignored
summary: a foreign owner tag without a strictly newer epoch must still stop us mutating the resource
# docs/hosting.md:107-110 and crates/llm-provision/src/controller.rs:701-702 both say a foreign
# owner tag means this controller stops mutating the resource, "either way". The sibling
# scenario a-newer-epoch-disowns-the-record-and-we-stop-mutating-it only ever retags at a
# strictly newer epoch. Here the tag is foreign and the epoch is not newer, our lease is still
# live, and the controller goes on to destroy controller-b's resource.
timeline:
- at: '2026-09-21T12:00:00Z'
  command: llm-gateway.hosting.Exercise
  input:
    program_json: '{"policy":{"controller":"controller-a","provider":"fake","account":"account-1","ledger":"scope","max_active":2,"max_lifetime_ms":10000,"lease_ms":1000},"steps":[{"step":"declare","at_ms":1,"spec":{"id":"d1","provider":"fake","account":"account-1","model":"requested-model","image":"requested-image","resource_name":"pool-slot","requested_lifetime_ms":5000},"request_id":"request-d1","authorization":{"ledger":"scope","reservation":"reservation-a"}},{"step":"acquire","at_ms":1,"deployment":"d1"},{"step":"provision","at_ms":1,"deployment":"d1"},{"step":"observe","at_ms":2},{"step":"retag","name":"pool-slot","owner":"controller-b","epoch":1},{"step":"observe","at_ms":3},{"step":"stop","at_ms":4,"deployment":"d1"}]}'
assert:
- view: llm-gateway.hosting.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.hosting.LastExecution
  contains:
    valid_program: true
    stops: 0

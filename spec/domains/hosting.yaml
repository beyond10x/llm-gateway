domain: llm-gateway.hosting

# One controller owns one provider/account/ledger scope. These entities are declaration and
# inspection records observed through the crate's public API. `Phase` is the observed runtime
# ownership state and `OwnedResource`'s lifecycle declares it; neither is a promise of a
# production event bus or an Entity Runtime store.
# ESS-LIMIT: the crate (crates/llm-provision) opens no socket, reads no credential or file,
# starts no process, holds no cloud SDK and allocates no resource: it declares no dependency.
# A dependency graph and an absent capability are no ESS construct;
# `row_5_the_hosting_crate_declares_no_dependency_and_names_no_io` in
# crates/llm-provision/tests/hosting.rs holds it. The Runpod adapter's own boundary is
# llm-gateway.runpod's.
types:
  # The resolved hosting lifecycle. `Uncertain`, `StopRequired`, `Stopped` and `Cancelled` are
  # llm.budget.Phase's words with llm.budget.Phase's meaning; the hosting-specific states are a
  # submitted create (`Requested`), an observed live resource (`Active`) and a resource a
  # strictly newer epoch has taken over (`Disowned`). `owes_a_stop` is the phase whose record is
  # listed in `Totals.stop_required`; `occupies_a_slot` is the phase counted against
  # `Controller.max_active`, an uncertain resource included because it may be billed.
  # `Stopped`, `Cancelled` and `Disowned` are terminal: no `Transition` leaves them.
  - name: llm-gateway.hosting.Phase
    kind: enum
    attributes:
      - {name: owes_a_stop, type: Boolean}
      - {name: occupies_a_slot, type: Boolean}
    variants:
      - {name: Declared, attributes: {owes_a_stop: false, occupies_a_slot: false}}
      - {name: Requested, attributes: {owes_a_stop: false, occupies_a_slot: true}}
      - {name: Active, attributes: {owes_a_stop: false, occupies_a_slot: true}}
      - {name: Uncertain, attributes: {owes_a_stop: true, occupies_a_slot: true}}
      - {name: StopRequired, attributes: {owes_a_stop: true, occupies_a_slot: true}}
      - {name: Stopped, attributes: {owes_a_stop: false, occupies_a_slot: false}}
      - {name: Cancelled, attributes: {owes_a_stop: false, occupies_a_slot: false}}
      - {name: Disowned, attributes: {owes_a_stop: false, occupies_a_slot: false}}
  # Every phase change the controller may make (crates/llm-provision/src/machine.rs
  # `TRANSITIONS`), in its order. A pair absent here is refused by `Phase::may_become`; the
  # absences that matter: `Uncertain -> Cancelled` and `StopRequired -> Cancelled` (cancelling
  # cannot discharge an obligation that was incurred), `StopRequired -> Active` (a later healthy
  # observation does not withdraw a stop obligation), and `Declared -> Active`,
  # `-> StopRequired`, `-> Stopped` (nothing is observed, obliged or discharged before a
  # mutation was submitted). From every phase that occupies a slot, `StopRequired`, `Stopped` and
  # `Disowned` are each reachable, so no obligation becomes inexpressible
  # (`every_obligation_is_expressible_from_every_phase_that_can_hold_a_resource` in machine.rs).
  # A command whose only work is one phase change the table refuses answers `WrongPhase`, never
  # a silent success. Held to the constant by
  # `the_declared_transition_table_is_the_published_constant` (checks/conformance/src/hosting.rs)
  # and observed by the scenarios `the-ownership-state-machine-is-exactly-this-table` and, for
  # `Requested -> Disowned` driven through the controller's calls,
  # `a-create-taken-over-before-any-listing-confirmed-it-is-disowned`. The same pairs are the
  # lifecycle of `OwnedResource`, where each one is taken by a command outcome.
  - name: llm-gateway.hosting.Transition
    kind: enum
    attributes:
      - {name: from, type: llm-gateway.hosting.Phase}
      - {name: to, type: llm-gateway.hosting.Phase}
    variants:
      - {name: DeclaredRequested, attributes: {from: Declared, to: Requested}}
      - {name: DeclaredUncertain, attributes: {from: Declared, to: Uncertain}}
      - {name: DeclaredCancelled, attributes: {from: Declared, to: Cancelled}}
      - {name: RequestedRequested, attributes: {from: Requested, to: Requested}}
      - {name: RequestedActive, attributes: {from: Requested, to: Active}}
      - {name: RequestedStopRequired, attributes: {from: Requested, to: StopRequired}}
      - {name: RequestedStopped, attributes: {from: Requested, to: Stopped}}
      - {name: RequestedDisowned, attributes: {from: Requested, to: Disowned}}
      - {name: ActiveActive, attributes: {from: Active, to: Active}}
      - {name: ActiveStopRequired, attributes: {from: Active, to: StopRequired}}
      - {name: ActiveStopped, attributes: {from: Active, to: Stopped}}
      - {name: ActiveDisowned, attributes: {from: Active, to: Disowned}}
      - {name: UncertainUncertain, attributes: {from: Uncertain, to: Uncertain}}
      - {name: UncertainRequested, attributes: {from: Uncertain, to: Requested}}
      - {name: UncertainActive, attributes: {from: Uncertain, to: Active}}
      - {name: UncertainStopRequired, attributes: {from: Uncertain, to: StopRequired}}
      - {name: UncertainStopped, attributes: {from: Uncertain, to: Stopped}}
      - {name: UncertainDisowned, attributes: {from: Uncertain, to: Disowned}}
      - {name: StopRequiredStopRequired, attributes: {from: StopRequired, to: StopRequired}}
      - {name: StopRequiredStopped, attributes: {from: StopRequired, to: Stopped}}
      - {name: StopRequiredDisowned, attributes: {from: StopRequired, to: Disowned}}
  # Why a stop is owed. None of these is a claim that anything stopped.
  # - `AmbiguousMutation`: a create whose answer was lost (`Dispatch.Unknown`, or accepted with
  #   no resource) makes the record `Uncertain`; it is never retried blindly
  #   (`an-ambiguous-create-holds-an-open-stop-obligation`). Its only recoveries are a `Retry`
  #   with the recorded request id against a provider that honours one
  #   (`an-idempotent-retry-reuses-the-request-id-and-allocates-once`) and reconciliation:
  #   `Observe` adopts a listed resource carrying that request id
  #   (`an-ambiguous-create-is-resolved-by-adopting-what-it-left-behind`), and a listing that
  #   can answer for it settles the record with evidence (see `Completeness`).
  # - `LifetimeExceeded`: a resource past its effective deadline (see `Controller`) becomes
  #   `StopRequired`; the ceiling obliges a stop and performs none
  #   (`the-time-ceiling-obliges-a-stop-rather-than-performing-one`).
  # - `LeaseExpired`: a claim that ran out obliges a stop and is not evidence of one
  #   (`an-expired-lease-is-not-evidence-that-the-resource-stopped`); a Runpod pool carries
  #   the obligation out (llm-gateway.runpod `Pool`).
  # - `OwnershipLost`: a resource carrying another owner's tag without a strictly newer epoch
  #   (`a-foreign-owner-tag-without-a-newer-epoch-obliges-a-stop`), or a create answer naming
  #   another scope or owner.
  # The one precedence rule on the reason slot: the reason that opened an obligation is kept,
  # except that `OwnershipLost` always wins. The slot is cleared in exactly one place, when the
  # resource is seen again under the record's own key with no other owner's label on it.
  # `the_first_reason_is_kept_except_that_ownership_lost_always_wins` (controller.rs, over every
  # ordered pair of reasons), `the_reason_that_opened_an_obligation_is_the_one_kept` and the
  # scenario `adversary-a-requested-stop-must-not-hide-a-foreign-owner-tag` hold it.
  - name: llm-gateway.hosting.StopReason
    kind: enum
    variants: [AmbiguousMutation, LifetimeExceeded, LeaseExpired, OperatorRequest, OwnershipLost]
  # llm.catalog.Dispatch's words. `Unknown` is the case the contract exists for. A create answered
  # `NotSent` or `Rejected` withdraws a `Declared` record (`Cancelled`), because the provider
  # answered that nothing exists (`a-create-that-never-left-the-process-allocates-nothing`,
  # `a-create-the-provider-refused-allocates-nothing`); a record that already owes a stop is not
  # withdrawn by a later refusal. `Cancel` is permitted only from `Declared`
  # (`cancelling-a-deployment-that-was-never-submitted-releases-it`,
  # `cancellation-cannot-discharge-a-submitted-create`).
  - name: llm-gateway.hosting.Dispatch
    kind: enum
    variants: [NotSent, Rejected, Unknown, Accepted]
  # How the provider answers the create `Provision` submits. The conformance target drives the
  # in-process fake provider, so the answer is part of the command's input; a deployment learns
  # it from its provider. `Dispatch`'s four words, plus `AcceptedOutsideScope`: an accepted
  # create whose answer names a resource in another provider account, which is never adopted
  # and leaves the record `Uncertain` with `OwnershipLost`
  # (`a_create_answer_outside_this_scope_is_not_adopted_and_nothing_is_addressed_to_it`).
  - name: llm-gateway.hosting.CreateAnswer
    kind: enum
    variants: [Accepted, AcceptedOutsideScope, Unknown, Rejected, NotSent]
  # How the provider answers the create `Retry` resubmits under the recorded request id. A
  # refusal is not listed: what a refused retry means for a record that already owes a stop is
  # `Dispatch`'s rule above, and it moves nothing.
  - name: llm-gateway.hosting.RetryAnswer
    kind: enum
    variants: [Accepted, Unknown]
  # The provider's own word for a resource's runtime state; not readiness. Only `Terminated`
  # ends a resource.
  # DECIDED 2026-10-14: a pod Runpod reports `EXITED` (stopped, still existing and billed) is
  # `Pending`, as one reported `CREATED` is (crates/llm-runpod/src/provider.rs `describe`): it is
  # present and not running, so it is neither `Running` nor evidence that it stopped. The Runpod
  # pool retires it as `PodExited` (llm-gateway.runpod `PoolRefusal`)
  # (`an-exited-pod-is-terminated-and-replaced`,
  # `an_exited_pod_is_terminated_rather_than_recorded_as_stopped` in
  # crates/llm-runpod/tests/adversary.rs).
  - name: llm-gateway.hosting.ProviderState
    kind: enum
    variants: [Pending, Running, Terminated]
  # Why a hosting command was refused (crates/llm-provision/src/error.rs), with the code a
  # caller reads and the fixed message, which quotes no provider text, URL, credential or
  # account. `every_hosting_refusal_is_declared_with_its_code_and_message`
  # (checks/conformance/src/hosting.rs) holds the attributes to the crate, and
  # `every_published_refusal_is_emitted_by_some_real_sequence_of_calls`
  # (crates/llm-provision/tests/hosting.rs) reaches each one through public calls. When each is
  # answered:
  # - `InvalidPolicy`: `max_active` outside 1..=4096, or a zero `max_lifetime_ms` or `lease_ms`
  #   (`a-policy-one-past-the-published-resource-ceiling-is-refused`).
  # - `InvalidSpec`: a specification for another provider or account, or a requested lifetime of
  #   zero or above `max_lifetime_ms`; checked before any provider call
  #   (`a-specification-for-another-account-is-refused`, `a-zero-requested-lifetime-is-refused`,
  #   `a-lifetime-above-the-ceiling-is-refused-without-a-provider-call`).
  # - `Unauthorized`: `Declare` with a compute authorization from another ledger
  #   (`an-authorization-from-another-ledger-is-refused`).
  # - `WrongPhase`: a command the record's phase does not permit; `RequestStop` and
  #   `ConfirmStopped` refuse rather than answer success for a change the table forbids
  #   (`requesting-a-stop-of-a-cancelled-deployment-is-refused`,
  #   `confirming-a-stop-nothing-owes-is-refused`,
  #   `a_command_whose_only_phase_change_is_forbidden_is_refused_rather_than_reported_done`).
  # - `CapacityExceeded`: a provision past `max_active`, decided from the controller's own
  #   records before any mutation is submitted
  #   (`the-resource-ceiling-refuses-before-anything-is-allocated`).
  # - `LeaseHeld`: one lease per deployment; a second owner is refused while a live claim exists
  #   (`concurrent-acquisition-grants-exactly-one-lease`).
  # - `LeaseLost` and `StaleEpoch`: `Controller::fence` refuses a mutation without a live claim,
  #   or whose epoch is below the registry's current one, before the provider is called
  #   (`provisioning-without-a-current-lease-is-refused`,
  #   `a-stale-epoch-is-refused-before-the-provider-is-called`,
  #   `a_claim_that_merely_expired_still_refuses_every_provider_mutation`).
  # - `ForeignResource`: `Stop` on a record whose reason is `OwnershipLost`
  #   (`adversary-a-requested-stop-must-not-hide-a-foreign-owner-tag`), and a restore or create
  #   answer naming another provider or account, which is not adopted: the record keeps no
  #   observation and its obligation stays open
  #   (`a_restored_record_claiming_another_scopes_resource_is_refused`,
  #   `a_create_answer_outside_this_scope_is_not_adopted_and_nothing_is_addressed_to_it`).
  # - `AmbiguousMutation`: `Stop` on a record with no observed resource to address.
  # - `IdempotencyUnsupported`: `Retry` against a provider that does not answer
  #   `honours_idempotency_key`; an unsupported action is reported, never simulated
  #   (`an-unsupported-retry-is-refused-rather-than-simulated`).
  - name: llm-gateway.hosting.HostingError
    kind: enum
    attributes:
      - {name: code, type: String}
      - {name: message, type: String}
    variants:
      - {name: InvalidPolicy, attributes: {code: invalid-policy, message: "invalid hosting policy"}}
      - {name: InvalidSpec, attributes: {code: invalid-spec, message: "deployment specification is outside this scope"}}
      - {name: Unauthorized, attributes: {code: unauthorized, message: "compute authorization names a different budget ledger"}}
      - {name: Duplicate, attributes: {code: duplicate, message: "deployment identifier already exists"}}
      - {name: Missing, attributes: {code: missing, message: "deployment does not exist"}}
      - {name: WrongPhase, attributes: {code: wrong-phase, message: "operation is not valid in this phase"}}
      - {name: ClockReversed, attributes: {code: clock-reversed, message: "hosting clock moved backwards"}}
      - {name: CapacityExceeded, attributes: {code: capacity-exceeded, message: "resource ceiling would be exceeded"}}
      - {name: LeaseHeld, attributes: {code: lease-held, message: "another controller holds the ownership lease"}}
      - {name: LeaseLost, attributes: {code: lease-lost, message: "this controller holds no current lease"}}
      - {name: StaleEpoch, attributes: {code: stale-epoch, message: "a newer epoch owns this resource"}}
      - {name: ForeignResource, attributes: {code: foreign-resource, message: "the observed resource is not the one owned here"}}
      - {name: AmbiguousMutation, attributes: {code: ambiguous-mutation, message: "the mutation outcome is unknown"}}
      - {name: IdempotencyUnsupported, attributes: {code: idempotency-unsupported, message: "the provider does not honour a repeated request id"}}
  # The four routes that close a stop obligation, and nothing else does: every one attaches
  # evidence to the record (`OwnedResource.stop_evidence`). `code` is the evidence attached for
  # the two fixed routes; the provider's own reference for an accepted stop
  # (`an-accepted-stop-carries-the-provider-evidence`) and the caller's reference for
  # `ConfirmStopped` (`an-explicit-confirmation-carries-its-own-evidence`) are attached as given.
  # `InventoryCompleteAbsent` is absence from a listing that can answer for the record (see
  # `Completeness`; `absence-from-a-complete-inventory-discharges-the-obligation`);
  # `ProviderTerminated` is the provider reporting `Terminated`
  # (`a-provider-reported-termination-is-evidence-that-the-resource-stopped`). Disconnecting a
  # client, releasing or expiring a lease, restarting the controller and an incomplete listing
  # close nothing (`disconnecting-a-client-is-not-shutdown`, `releasing-a-lease-is-not-shutdown`,
  # `an-expired-lease-is-not-evidence-that-the-resource-stopped`,
  # `a-restart-keeps-identity-and-forgets-liveness`,
  # `an-incomplete-inventory-is-not-evidence-of-absence`). A record taken over at a strictly
  # newer epoch becomes `Disowned` with no evidence, and moves from `Totals.stop_required` to
  # `Totals.transferred`; this controller issues no further mutation against it
  # (`a-newer-epoch-disowns-the-record-and-we-stop-mutating-it`).
  # `every_evidence_kind_is_attached_by_some_real_sequence_of_calls`
  # (crates/llm-provision/tests/hosting.rs) reaches each route under an exhaustive match.
  - name: llm-gateway.hosting.EvidenceKind
    kind: enum
    attributes:
      - {name: code, type: String}
    variants:
      - {name: InventoryCompleteAbsent, attributes: {code: inventory-complete-absent}}
      - {name: ProviderTerminated, attributes: {code: provider-terminated}}
      - {name: ProviderReference, attributes: {code: provider-reference}}
      - {name: CallerReference, attributes: {code: caller-reference}}
  # Whether a listing named every resource in the scope. Absence from a `Partial` listing
  # carries no information and produces no transition. A record with an observed key is settled
  # by absence from a `Complete` listing; a record with no key yet (an unresolved create) only by
  # absence from a listing that is `Complete` and in which every listed resource carries its
  # request id (`Inventory::answers_request_identity`); any other listing produces no transition
  # (`an-incomplete-inventory-is-not-evidence-of-absence`,
  # `a-complete-listing-with-no-request-identifier-cannot-settle-an-ambiguous-create`,
  # `an-unanswerable-listing-leaves-the-obligation-exactly-where-it-was`).
  - name: llm-gateway.hosting.Completeness
    kind: enum
    attributes:
      - {name: code, type: String}
    variants:
      - {name: Complete, attributes: {code: complete}}
      - {name: Partial, attributes: {code: partial}}
  - name: llm-gateway.hosting.Totals
    kind: struct
    fields:
      # Records whose phase occupies a slot (`Phase.occupies_a_slot`).
      - {name: active_count, type: Integer}
      # Records whose phase is `Uncertain`.
      - {name: unknown_count, type: Integer}
      # The same obligation llm.budget.Totals.stop_required carries, seen from the hosting side.
      - {name: stop_required, type: 'List<String>'}
      # Obligations that moved to a newer epoch rather than being discharged. A disowned
      # record leaves stop_required without ever attaching evidence, because nothing stopped;
      # without this list that transfer would be a disappearance.
      - {name: transferred, type: 'List<String>'}
      # `active_count` has reached `max_active`.
      - {name: at_capacity, type: Boolean}
  - name: llm-gateway.hosting.TransitionFact
    kind: struct
    fields:
      - {name: from, type: String}
      - {name: to, type: String}
  - name: llm-gateway.hosting.DeploymentFact
    kind: struct
    fields:
      - {name: id, type: String}
      - {name: phase, type: String}
      - {name: stop_reason, type: 'Optional<String>'}
      - {name: stop_evidence, type: 'Optional<String>'}
      # Whether a client is attached. Attaching or detaching one changes no lifecycle fact and
      # closes no obligation (`an-attached-client-changes-no-lifecycle-fact`,
      # `disconnecting-a-client-is-not-shutdown`).
      - {name: connected, type: Boolean}
      # Requested. Always present, because the operator stated it.
      - {name: requested_model, type: String}
      - {name: requested_image, type: String}
      - {name: requested_name, type: String}
      - {name: requested_lifetime_ms, type: String}
      - {name: request_id, type: String}
      - {name: ledger, type: String}
      - {name: reservation, type: String}
      # Observed. Absent until a provider reported it, and never filled in from the request
      # above. An unreported model is null; it is not `requested_model`.
      - {name: observed_name, type: 'Optional<String>'}
      - {name: observed_incarnation, type: 'Optional<String>'}
      - {name: observed_state, type: 'Optional<String>'}
      # Null when the provider said nothing; it never means `false`. Ready is exactly `true`
      # (`ProvisionedDeployment::is_ready` is `ready == Some(true)`), so a provider that stops
      # reporting readiness stops being ready to every reader
      # (`unreported-readiness-is-unknown-and-never-ready`,
      # `a-provider-that-says-not-ready-is-not-a-provider-that-says-nothing`).
      - {name: observed_ready, type: 'Optional<Boolean>'}
      - {name: observed_endpoint, type: 'Optional<String>'}
      - {name: observed_model, type: 'Optional<String>'}
      - {name: lease_owner, type: 'Optional<String>'}
      - {name: lease_epoch, type: 'Optional<Integer>'}
      - {name: lease_expires_at_ms, type: 'Optional<String>'}
entities:
  - name: llm-gateway.hosting.Controller
    identity: {name: id, type: String}
    fields:
      - {name: provider_id, type: String}
      - {name: account_id, type: String}
      - {name: ledger_id, type: String}
      # The resource ceiling, 1..=4096 (`MAX_ACTIVE_CEILING`); there is no zero
      # (`a-policy-at-the-published-resource-ceiling-is-admitted`,
      # `a-policy-one-past-the-published-resource-ceiling-is-refused`,
      # `the-last-slot-under-the-resource-ceiling-is-admitted`).
      - {name: max_active, type: Integer}
      # The time ceiling, never zero: there is no "unlimited" spelling. A requested lifetime
      # equal to it is admitted and one millisecond past it refused; a resource is inside its
      # lifetime at its deadline instant and past it one millisecond later
      # (`a-requested-lifetime-exactly-at-the-ceiling-is-admitted`,
      # `the-time-ceiling-does-not-fire-at-its-own-deadline`,
      # `the-time-ceiling-fires-one-millisecond-past-its-deadline`). The effective lifetime is
      # the minimum of the requested lifetime and this ceiling, counted from submission, so a
      # policy tightened across a restart lowers the deadline
      # (`a-policy-tightened-across-a-restart-lowers-the-deadline`,
      # `a-policy-tightened-across-a-restart-fires-at-the-lower-deadline`).
      - {name: max_lifetime_ms, type: String}
      - {name: lease_ms, type: String}
    relations:
      # Owned resources have no meaning without the scope that owns them.
      - {name: resources, kind: owns, target: llm-gateway.hosting.OwnedResource, cardinality: many, via: controller_id}
      # BOUNDARY: `account_id` names an llm.catalog.Account and `ledger_id` an llm.budget.Ledger.
      # Both entities belong to the system `llm` (beyond10x/llm, spec/domains/catalog.yaml and
      # budget.yaml), which this system only calls. ESS-LIMIT: ESS 0.52 resolves a relation only
      # to an entity of the same specification and has no cross-system reference, so these two
      # `references` edges (cardinality one, via account_id and ledger_id) were declared while
      # this domain lived in llm and are recorded here instead of copying llm's domains in.
    # A restart (`Controller::restore`) keeps identity, phase and every open obligation; a
    # restart is not a discharge. It drops the lease, so the restarted controller reacquires at a
    # new epoch before it mutates anything, and every liveness observation, which is stale. It
    # refuses to reopen at an instant earlier than the latest one its records witness (a
    # submission instant or an observation; a `Declared` or `Cancelled` record witnesses
    # nothing), and `apply` refuses a clock that moves backwards as `ClockReversed`
    # (`a-restart-keeps-identity-and-forgets-liveness`,
    # `a-restarted-controller-must-take-a-new-lease-before-it-mutates`,
    # `a-restart-cannot-reopen-the-controller-at-an-earlier-instant`,
    # `the-clock-cannot-move-backwards`).
    # `inventory` and the `Validate` command never allocate: the provider's `allocations`,
    # `submits`, `stops` and `lists` are counted apart (`validating-and-listing-allocate-nothing`).
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  - name: llm-gateway.hosting.OwnedResource
    identity: {name: id, type: String}
    fields:
      - {name: controller_id, type: String}
      - {name: deployment_spec_id, type: String}
      # The budget reservation this billed resource is admitted against. `Declare` requires a
      # compute authorization naming the controller's ledger (`HostingError.Unauthorized`).
      # The controller does not re-derive admission: a Runpod pool admits each create through
      # its spend check (llm-gateway.runpod.SpendLedger) and the binary names that reservation
      # `spend-ceiling`, or `unmetered` when no ceiling is declared (llm-gateway.deployment).
      - {name: reservation_id, type: String}
      # The idempotency key, recorded before the create mutation was submitted.
      - {name: request_id, type: String}
      - {name: stop_reason, type: 'Optional<llm-gateway.hosting.StopReason>'}
      # Absent while an obligation is open; the evidence of one `EvidenceKind` once it closed.
      - {name: stop_evidence, type: 'Optional<String>'}
      # The observed identity. Absent while no provider answer exists. A name alone is not an
      # identity: a provider may hand `resource_name` to a later resource once this one is
      # gone, so `resource_incarnation` is what distinguishes them. A resource with the same name
      # and another incarnation is not found: it is not adopted, not counted and never stopped
      # (`a-reused-name-with-a-new-incarnation-is-not-the-resource-we-owned`).
      - {name: resource_name, type: 'Optional<String>'}
      - {name: resource_incarnation, type: 'Optional<String>'}
    # BOUNDARY: `deployment_spec_id` names an llm.catalog.DeploymentSpec and `reservation_id` an
    # llm.budget.Reservation, both entities of the system `llm` (beyond10x/llm). ESS-LIMIT: as
    # for the controller above, the two `references` edges (cardinality one, via
    # deployment_spec_id and reservation_id) cannot resolve across systems in ESS 0.52 and are
    # recorded here rather than declared.
    # The ownership state machine (crates/llm-provision/src/machine.rs `Phase`, `TRANSITIONS`).
    # The lifecycle state is the record's phase, so the record carries no separate `phase`
    # field. The states are `Phase`'s, in its order; the (from, to) pairs of the transitions
    # below are exactly `TRANSITIONS`, no more and no fewer
    # (`the_owned_resource_lifecycle_is_the_published_transition_table` in
    # checks/conformance/src/hosting.rs). Each transition is one way the controller's public
    # calls change a phase:
    # - `submit`, `lose`, `misanswer`, `withdraw`: `Provision` answered `Accepted`, `Unknown`,
    #   accepted outside the scope, and `NotSent` or `Rejected`.
    # - `cancel`: `Cancel` of a record never submitted.
    # - `confirm`, `relose`: `Retry` of an uncertain create answered `Accepted` or `Unknown`; a
    #   record still uncertain stays so.
    # - `hold`: `ObserveUnlisted`, a listing that does not carry a requested resource; it stays
    #   `Requested`.
    # - `adopt`: `ObserveListed`, a listing that carries the resource under this controller's
    #   tag. `StopRequired` is absent from its sources: a later healthy observation does not
    #   withdraw a stop obligation.
    # - `oblige`, `discharge`: `RequestStop` and `ConfirmStopped`, from every phase that occupies
    #   a slot.
    # - `disown`: `ObserveTakenOver`, a listing that carries the resource retagged at a strictly
    #   newer epoch.
    # `Declared` has no edge to `Active`, `StopRequired` or `Stopped`, and nothing leaves
    # `Stopped`, `Cancelled` or `Disowned`. Two transitions share a pair where two different
    # answers make it (`lose` and `misanswer`, `withdraw` and `cancel`); each is a second route
    # into its target, so a mutation that retargets one leaves the state reachable and is
    # scored rather than stillborn.
    lifecycle:
      initial: Declared
      states: [Declared, Requested, Active, Uncertain, StopRequired, Stopped, Cancelled, Disowned]
      terminal: [Stopped, Cancelled, Disowned]
      transitions:
        - {name: submit, from: [Declared], to: Requested}
        - {name: lose, from: [Declared], to: Uncertain}
        - {name: misanswer, from: [Declared], to: Uncertain}
        - {name: withdraw, from: [Declared], to: Cancelled}
        - {name: cancel, from: [Declared], to: Cancelled}
        - {name: confirm, from: [Uncertain], to: Requested}
        - {name: relose, from: [Uncertain], to: Uncertain}
        - {name: hold, from: [Requested], to: Requested}
        - {name: adopt, from: [Requested, Active, Uncertain], to: Active}
        - {name: oblige, from: [Requested, Active, Uncertain, StopRequired], to: StopRequired}
        - {name: discharge, from: [Requested, Active, Uncertain, StopRequired], to: Stopped}
        - {name: disown, from: [Requested, Active, Uncertain, StopRequired], to: Disowned}
  # One lease per deployment: a second owner is refused while a live claim exists, and an
  # expired claim may be taken over. One epoch is granted to one owner
  # (`a_held_lease_always_carries_the_registrys_current_epoch_and_its_grantee` in lease.rs).
  - name: llm-gateway.hosting.OwnershipLease
    identity: {name: id, type: String}
    fields:
      - {name: controller_id, type: String}
      # The deployment this claim is on; the registry holds at most one live claim for it.
      - {name: deployment_id, type: String}
      - {name: owner_id, type: String}
      # Strictly monotonic per deployment, never reused, including across the owner's restart.
      - {name: epoch, type: Integer}
      # Inclusive: live at this instant, expired one millisecond later.
      - {name: expires_at_ms, type: String}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  - name: llm-gateway.hosting.ExecutionObservation
    identity: {name: observation_id, type: String}
    fields: &execution_facts
      - {name: valid_program, type: Boolean}
      - {name: error_code, type: 'Optional<String>'}
      - {name: results, type: 'List<String>'}
      # Provider-side counters. Absent, never zero, when no provider was ever built: an
      # unreported count is not a count of zero.
      - {name: allocations, type: 'Optional<Integer>'}
      - {name: submits, type: 'Optional<Integer>'}
      - {name: stops, type: 'Optional<Integer>'}
      - {name: lists, type: 'Optional<Integer>'}
      - {name: concurrent_granted, type: 'List<Integer>'}
      - {name: concurrent_errors, type: 'List<String>'}
      - {name: controller, type: 'Optional<String>'}
      - {name: ledger, type: 'Optional<String>'}
      - {name: max_active, type: 'Optional<Integer>'}
      - {name: now_ms, type: 'Optional<String>'}
      - {name: totals, type: 'Optional<llm-gateway.hosting.Totals>'}
      - {name: deployments, type: 'List<llm-gateway.hosting.DeploymentFact>'}
      # The permitted transition table the library actually enforces, read from its published
      # constant, as `Transition` declares it. A pair absent from this list is refused; this is
      # the lifecycle that resolves the formerly open hosting transitions (docs/hosting.md
      # "The resolved lifecycle").
      - {name: transitions, type: 'List<llm-gateway.hosting.TransitionFact>'}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
commands:
  - name: llm-gateway.hosting.Exercise
    input:
      # A bounded fixture program drives the real controller against the real in-process fake
      # provider, including concurrent acquisition, restarts and lost mutation answers.
      - {name: program_json, type: String}
    outcomes:
      - name: observed
        emits: [llm-gateway.hosting.Exercised]
        payload:
          llm-gateway.hosting.Exercised:
            valid_program: {generated: true}
        summary: Observe actual phases, refusals, provider calls, leases and stop obligations.
  # The commands below drive one `OwnedResource` through the controller's public calls
  # (`Controller::apply`), one controller, fake provider and lease registry per record, so a
  # command on one record cannot move another. A refusal is the controller's own
  # (`HostingError`): `WrongPhase` where the record's phase has no edge for the change,
  # `Missing` for an identity no record carries, `Duplicate` for a second declaration.
  # `Declare` records the deployment and takes its ownership lease; every later command runs
  # under that live lease, so `Controller::fence` passes and the phase decides.
  - name: llm-gateway.hosting.Declare
    input:
      - {name: id, type: String}
      - {name: request_id, type: String}
      - {name: reservation_id, type: String}
    outcomes:
      - name: declared
        creates: llm-gateway.hosting.OwnedResource
        instance: id
        emits: [llm-gateway.hosting.ResourceDeclared]
        payload:
          llm-gateway.hosting.ResourceDeclared: {id: input.id}
        sets: {deployment_spec_id: input.id, request_id: input.request_id, reservation_id: input.reservation_id}
      - {name: duplicate, existing_instance: true, error: llm-gateway.hosting.Duplicate}
  - name: llm-gateway.hosting.Provision
    input:
      - {name: id, type: String}
      - {name: answer, type: llm-gateway.hosting.CreateAnswer}
    outcomes:
      - name: accepted
        when: answer == Accepted
        moves: llm-gateway.hosting.OwnedResource.submit
        instance: id
        emits: [llm-gateway.hosting.PhaseMoved]
        payload:
          llm-gateway.hosting.PhaseMoved: {id: input.id}
      - name: lost
        when: answer == Unknown
        moves: llm-gateway.hosting.OwnedResource.lose
        instance: id
        emits: [llm-gateway.hosting.PhaseMoved]
        payload:
          llm-gateway.hosting.PhaseMoved: {id: input.id}
      - name: misanswered
        when: answer == AcceptedOutsideScope
        moves: llm-gateway.hosting.OwnedResource.misanswer
        instance: id
        emits: [llm-gateway.hosting.PhaseMoved]
        payload:
          llm-gateway.hosting.PhaseMoved: {id: input.id}
      - name: refused
        when: {answer: {in: [NotSent, Rejected]}}
        moves: llm-gateway.hosting.OwnedResource.withdraw
        instance: id
        emits: [llm-gateway.hosting.PhaseMoved]
        payload:
          llm-gateway.hosting.PhaseMoved: {id: input.id}
      - {name: missing, unknown_instance: true, error: llm-gateway.hosting.Missing}
      - {name: wrong-phase, wrong_state: true, error: llm-gateway.hosting.WrongPhase}
  - name: llm-gateway.hosting.Retry
    input:
      - {name: id, type: String}
      - {name: answer, type: llm-gateway.hosting.RetryAnswer}
    outcomes:
      - name: accepted
        when: answer == Accepted
        moves: llm-gateway.hosting.OwnedResource.confirm
        instance: id
        emits: [llm-gateway.hosting.PhaseMoved]
        payload:
          llm-gateway.hosting.PhaseMoved: {id: input.id}
      - name: lost
        when: answer == Unknown
        moves: llm-gateway.hosting.OwnedResource.relose
        instance: id
        emits: [llm-gateway.hosting.PhaseMoved]
        payload:
          llm-gateway.hosting.PhaseMoved: {id: input.id}
      - {name: missing, unknown_instance: true, error: llm-gateway.hosting.Missing}
      - {name: wrong-phase, wrong_state: true, error: llm-gateway.hosting.WrongPhase}
  # The three `Observe*` commands are `HostingCommand::Observe` against three listings, each
  # naming the record it asks about. Reconciliation never refuses: a record the listing says
  # nothing new about keeps its phase (`unchanged`), including a `Declared` or terminal one,
  # which reconciliation skips, and a `StopRequired` one a healthy listing does not withdraw.
  # ESS 0.77.0 workaround: one `Observe` command with a `listing` input selecting the three
  # moves would be the closer model, but `wrong_states` is computed per command, so no
  # synthesized scenario sends one listing in a state another listing's move starts from, and
  # dropping such a state from `adopt` or `disown` goes unnoticed (seven surviving from-drop
  # mutants). One command per move makes each move's wrong states its own.
  # `ObserveListed`: a complete listing carries the resource under this controller's own tag.
  - name: llm-gateway.hosting.ObserveListed
    input:
      - {name: id, type: String}
    outcomes:
      - name: adopted
        moves: llm-gateway.hosting.OwnedResource.adopt
        instance: id
        emits: [llm-gateway.hosting.PhaseMoved]
        payload:
          llm-gateway.hosting.PhaseMoved: {id: input.id}
      - {name: unchanged, wrong_state: true, refuses: false}
  # `ObserveTakenOver`: the listing carries the resource retagged by another controller at a
  # strictly newer epoch.
  - name: llm-gateway.hosting.ObserveTakenOver
    input:
      - {name: id, type: String}
    outcomes:
      - name: taken-over
        moves: llm-gateway.hosting.OwnedResource.disown
        instance: id
        emits: [llm-gateway.hosting.PhaseMoved]
        payload:
          llm-gateway.hosting.PhaseMoved: {id: input.id}
      - {name: unchanged, wrong_state: true, refuses: false}
  # `ObserveUnlisted`: a partial listing that does not carry the resource, which is no
  # evidence of anything.
  - name: llm-gateway.hosting.ObserveUnlisted
    input:
      - {name: id, type: String}
    outcomes:
      - name: unconfirmed
        moves: llm-gateway.hosting.OwnedResource.hold
        instance: id
        emits: [llm-gateway.hosting.PhaseMoved]
        payload:
          llm-gateway.hosting.PhaseMoved: {id: input.id}
      - {name: unchanged, wrong_state: true, refuses: false}
  - name: llm-gateway.hosting.RequestStop
    input:
      - {name: id, type: String}
    outcomes:
      - name: obliged
        moves: llm-gateway.hosting.OwnedResource.oblige
        instance: id
        emits: [llm-gateway.hosting.PhaseMoved]
        payload:
          llm-gateway.hosting.PhaseMoved: {id: input.id}
      - {name: missing, unknown_instance: true, error: llm-gateway.hosting.Missing}
      - {name: wrong-phase, wrong_state: true, error: llm-gateway.hosting.WrongPhase}
  # The caller's evidence is attached as given (`EvidenceKind.CallerReference`).
  - name: llm-gateway.hosting.ConfirmStopped
    input:
      - {name: id, type: String}
      - {name: evidence, type: String}
    outcomes:
      - name: confirmed
        moves: llm-gateway.hosting.OwnedResource.discharge
        instance: id
        emits: [llm-gateway.hosting.PhaseMoved]
        payload:
          llm-gateway.hosting.PhaseMoved: {id: input.id}
        sets: {stop_evidence: input.evidence}
      - {name: missing, unknown_instance: true, error: llm-gateway.hosting.Missing}
      - {name: wrong-phase, wrong_state: true, error: llm-gateway.hosting.WrongPhase}
  - name: llm-gateway.hosting.Cancel
    input:
      - {name: id, type: String}
    outcomes:
      - name: cancelled
        moves: llm-gateway.hosting.OwnedResource.cancel
        instance: id
        emits: [llm-gateway.hosting.PhaseMoved]
        payload:
          llm-gateway.hosting.PhaseMoved: {id: input.id}
      - {name: missing, unknown_instance: true, error: llm-gateway.hosting.Missing}
      - {name: wrong-phase, wrong_state: true, error: llm-gateway.hosting.WrongPhase}
# The three `HostingError` refusals the lifecycle commands answer, by the code a caller reads.
errors:
  - name: llm-gateway.hosting.WrongPhase
    summary: "`wrong-phase`: the record's phase has no edge to the phase the command would write."
  - name: llm-gateway.hosting.Missing
    summary: "`missing`: no record carries this deployment identifier."
  - name: llm-gateway.hosting.Duplicate
    summary: "`duplicate`: a record already carries this deployment identifier."
events:
  # Test-adapter notification only; there is no production notification transport.
  - name: llm-gateway.hosting.Exercised
    fields:
      - {name: valid_program, type: Boolean}
  # Test-adapter notifications of the lifecycle commands; the record's phase is read from the
  # `OwnedResources` view.
  - name: llm-gateway.hosting.ResourceDeclared
    fields:
      - {name: id, type: String}
  - name: llm-gateway.hosting.PhaseMoved
    fields:
      - {name: id, type: String}
views:
  - name: llm-gateway.hosting.LastExecution
    source: llm-gateway.hosting.ExecutionObservation
    consistency: read_your_writes
    fields: *execution_facts
  # Every record the lifecycle commands declared in this scenario, with its phase as the
  # lifecycle state.
  - name: llm-gateway.hosting.OwnedResources
    source: llm-gateway.hosting.OwnedResource
    consistency: read_your_writes
    fields:
      - {name: id, type: String}
      - {name: state, type: llm-gateway.hosting.OwnedResource.State}
      - {name: request_id, type: String}
      - {name: reservation_id, type: String}
      - {name: stop_evidence, type: 'Optional<String>'}

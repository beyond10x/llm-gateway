name: Documentation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
      - name: Build the Docusaurus site
        run: npm --prefix website ci && npm --prefix website run build
      - name: Bind the built site to its source commit
        run: |
          cargo test --locked -p llm-gateway-docs
          cargo run --locked -p llm-gateway-docs -- provenance --site website/build --commit "$GITHUB_SHA"
      - name: Upload the exact built site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b10x-project-site
          path: website/build
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

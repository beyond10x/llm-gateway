type: ess-scenario/1
domain: llm-gateway.runpod
scenario: an-idle-pod-is-reaped-and-the-next-request-cold-starts-again
summary: a pod idle for exactly its idle timeout is stopped; one millisecond less is not
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.runpod.Exercise
  input:
    program_json: '{"models":{"qwen":{}},"steps":[{"step":"until_ready","alias":"qwen"},{"step":"advance","ms":1799999},{"step":"reap"},{"step":"advance","ms":1},{"step":"reap"},{"step":"until_ready","alias":"qwen"}]}'
  outcome: observed
assert:
- view: llm-gateway.runpod.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.runpod.LastExecution
  contains:
    results:
    - ready
    - ok
    - ok
    - ok
    - ok
    - ready
    cleanups:
    - idle=[] retired=[] replaced=[] orphans=[]
    - idle=[qwen-1] retired=[] replaced=[] orphans=[]
    terminations:
    - pod-1
    leases:
    - https://pod-1-8000.proxy.runpod.net qwen
    - https://pod-2-8000.proxy.runpod.net qwen

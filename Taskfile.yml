version: '3'
tasks:
  check:
    desc: Check the implementation, the documentation pages and the specification, and run conformance
    cmds:
      - task: rust
      - task: docs
      - ess specify validate --path spec
      - task: spec-diff
      - task: conformance
  conformance:
    desc: Check ESS projection drift and run behavioral conformance three times
    cmds:
      - cargo run --locked -p b10x-llm-gateway-conformance -- check
  dashboard:
    desc: Build the dashboard page into crates/llm-gateway/src/dashboard.html
    cmds:
      - pnpm --dir dashboard install --frozen-lockfile && pnpm --dir dashboard test && pnpm --dir dashboard build
  dashboard-ux:
    desc: Run what the Gate workflow's dashboard job runs, browser install aside (the UI document, type check, unit tests, the built page against the committed one, the layout contract, hard gates and ratchet in Playwright)
    dir: dashboard
    cmds:
      - pnpm install --frozen-lockfile
      - ess ui check --path ui/llm-gateway.ui.yaml
      - pnpm typecheck
      - pnpm test
      - pnpm build
      - git diff --exit-code ../crates/llm-gateway/src/dashboard.html
      - timeout 120 pnpm e2e --workers=2
  docs:
    desc: Check the generated documentation pages for drift and the hand-written ones for the public boundary
    cmds:
      - cargo run --locked -p llm-gateway-docs -- generate --check
  rust:
    cmds:
      - task: test
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  test:
    desc: Build the tests, then run them with cargo-nextest (a test over 60 s is killed and fails), fail when the run takes over 120 s of wall clock, print the ten slowest
    cmds:
      - cargo nextest run --workspace --locked --no-run
      - cargo run --quiet --locked -p b10x-llm-gateway-xtask -- test
  spec-diff:
    desc: Fail on a breaking or unclassified specification change since the merge base with origin/main that contracts/diff-acknowledgements.json does not acknowledge
    cmds:
      - cargo run --locked -p b10x-llm-gateway-conformance -- diff

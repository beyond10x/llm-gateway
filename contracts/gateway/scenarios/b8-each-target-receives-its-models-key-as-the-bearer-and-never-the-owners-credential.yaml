type: ess-scenario/1
domain: llm-gateway.gateway
scenario: b8-each-target-receives-its-models-key-as-the-bearer-and-never-the-owners-credential
summary: a target that carries the model's vLLM key is sent it as the bearer, a target without one is sent no authorization, and no byte any pod receives holds the owner's credential
timeline:
- at: '2026-10-08T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["chat","messages"],"bearer":"vllm-key-code-0123456789abcdef"},{"alias":"plain","upstream_model":"served-plain","wires":["chat"]}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"chat-1\"}"]},{"status":200,"content_type":"text/event-stream","framing":"chunked","chunks":["event: message_stop\n\n"]},{"status":200,"content_type":"application/json","chunks":["{\"id\":\"chat-2\"}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"code\",\"messages\":[]}"},{"step":"request","path":"/v1/messages","body":"{\"model\":\"code\",\"stream\":true,\"messages\":[]}"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"plain\",\"messages\":[]}"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: null
    results:
    - ok
    - 200 relayed
    - 200 relayed
    - 200 relayed
    upstream:
    - 'pod-1 POST /v1/chat/completions {"model":"served-code","messages":[]}'
    - 'pod-1 POST /v1/messages {"model":"served-code","stream":true,"messages":[]}'
    - 'pod-1 POST /v1/chat/completions {"model":"served-plain","messages":[]}'
    authorizations:
    - Bearer vllm-key-code-0123456789abcdef
    - Bearer vllm-key-code-0123456789abcdef
    - absent
    secret_upstream: false
    acquired: 3
    released: 3

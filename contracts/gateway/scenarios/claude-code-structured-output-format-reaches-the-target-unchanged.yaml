type: ess-scenario/1
domain: llm-gateway.gateway
scenario: claude-code-structured-output-format-reaches-the-target-unchanged
summary: output_config.format and the deprecated top-level output_format reach the target unchanged beside an effort the template accepts; only the model is rewritten
timeline:
- at: '2026-10-15T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["messages"]}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"type\":\"message\"}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/messages","body":"{\"model\":\"code\",\"max_tokens\":512,\"output_config\":{\"effort\":\"medium\",\"format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\",\"properties\":{\"title\":{\"type\":\"string\"}},\"required\":[\"title\"]}}},\"output_format\":{\"type\":\"json_schema\",\"schema\":{\"type\":\"object\"}},\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    results:
    - ok
    - 200 relayed
    bodies:
    - '{"type":"message"}'
    upstream:
    - 'pod-1 POST /v1/messages {"model":"served-code","max_tokens":512,"output_config":{"effort":"medium","format":{"type":"json_schema","schema":{"type":"object","properties":{"title":{"type":"string"}},"required":["title"]}}},"output_format":{"type":"json_schema","schema":{"type":"object"}},"messages":[{"role":"user","content":"hi"}]}'

domain: llm-gateway.telemetry

# The gateway's counters and its per-call record (docs/llmgw-capability-matrix.md rows R4, O1, O2,
# O3; story:gateway-observability). The `Relay` command of llm-gateway.gateway observes both: its
# `records` fact holds one UsageRecord per call, and its `scrapes` fact holds what `GET /metrics`
# served. DECIDED 2026-11-04 (story:live-dashboard): the input, output, cache read and cache
# creation counters are filled from the usage a copy of the answer carried, decoded when it is
# content-encoded; a counter the answer did not report stays absent. PLANNED: `reported_model`
# and `reasoning_output_tokens`, which story:usage-records adds; no code fills them yet.
#
# Series. llmgw serves 13 Prometheus counters at `GET /metrics`, all prefixed `llmgw_`
# (llmgw src/lib.rs:144-180 at 048ebd8; llmgw README.md "Metrics"): eight process-wide and five
# per model and wire, labelled `model` and `wire`. The per-route series are registered from the
# configured registry before the first request, so an uncalled route reports zero instead of
# being absent. llm-gateway relays the same three wires (llm-gateway.gateway.Wire).
# DECIDED 2026-10-08 (story:gateway-observability): llm-gateway exports llmgw's 13 names
# verbatim, prefix `llmgw_` included, so a scrape configured for llmgw keeps working when llmgw
# retires (beyond10x/llm story:llmgw-retirement). Labels are `model` (the alias) and `wire`
# (`chat`, `responses`, `messages`), as llmgw, and every (model, wire) pair a relayed model
# declares is registered at zero when the gateway is composed. Each is a `counter`. The text is
# rendered inside the gateway crate, which takes no dependency for it. Where each is counted:
#   fed by the record (one record per relayed call, below):
#     llmgw_inference_requests_total                  every record
#     llmgw_upstream_failures_total                   every record no target answered: the
#                                                     target could not be reached or closed
#                                                     without an answer (`UpstreamFailed`, no
#                                                     `target_status`)
#     llmgw_route_requests_total{model,wire}          every record naming a relayed model
#     llmgw_route_refusals_total{model,wire}          the same, `Refused` or no target answered
#     llmgw_route_upstream_status_failures_total{..}  the same, its `target_status` outside 2xx,
#                                                     relayed (a 4xx, a 500) or answered
#                                                     `upstream-failed` (a 502, 503, 504)
#     llmgw_route_response_bytes_total{model,wire}    the same, its `response_bytes`
#   DECIDED 2026-10-08 (from llmgw src/lib.rs:598-629 at 048ebd8): llmgw counts
#   `upstream_failures` and a route refusal when the request got no answer (:598-604), and
#   `route_upstream_status_failures` for every answer whose status is not a success
#   (:622-629, `!status.is_success()`), whether it relays it or not. llm-gateway counts the same.
#   counted by the gateway where the event happens:
#     llmgw_endpoint_invalidations_total              each target it reports failed (row W7)
#     llmgw_route_cold_start_holds_total{model,wire}  each request its target source held for a
#                                                     starting target: the target says it held
#                                                     it, or the source answered `model-cold-start`
#     llmgw_cold_start_wait_seconds_total             the time those requests spent in `acquire`
#     llmgw_instruction_views_total                   each `GET /` or `HEAD /` it answered 200
#                                                     (row R1)
#   counted by the binary from the pool's results (crates/llm-gateway-cli/src/relaying.rs):
#     llmgw_pod_starts_total                          each pod create the pool submitted, seen as
#                                                     a request's hold binding to a new deployment
#     llmgw_pod_start_failures_total                  each `no-capacity`, `crash-loop`,
#                                                     `credential-refused` or `startup-deadline`
#                                                     answer a request received
#     llmgw_pod_reaps_total                           each deployment or pod a cleanup pass
#                                                     stopped (idle, retired, replaced, orphan)
#     llmgw_pod_start_spend_refusals_total            each `spend-ceiling` answer a request
#                                                     received: a pod start the spend check
#                                                     refused (story:spend-caps)
#   counted by the embedding of the FinishedCalls port (below), through a public method of the
#   gateway's `Metrics` (story:finished-call-facts):
#     llmgw_interaction_records_dropped_total         each finished call the embedding could not
#                                                     queue (`Metrics::count_interaction_record_
#                                                     dropped`)
#     llmgw_interaction_records_skipped_total         each finished call whose bytes were over the
#                                                     bound (`CallBytes` `OverBound`), whose record
#                                                     the embedding left out
#                                                     (`Metrics::count_interaction_record_skipped`)
#   DECIDED 2026-11-26 (story:finished-call-facts): both are process-wide counters after the
#   spend-refusal series, registered at zero; the gateway counts neither itself.
# DECIDED 2026-10-16 (story:spend-caps): beside llmgw's 13 the gateway serves one series of its
# own, `llmgw_pod_start_spend_refusals_total`, process-wide, after llmgw's eight; its prefix
# keeps one scrape configuration for every series. llmgw had no spend ceiling to count.
# DECIDED 2026-10-17 (story:prometheus-metrics): after llmgw's 13 and the spend-refusal series
# the gateway serves two series per model, labelled `model` (the alias) only, registered at zero
# for every relayed or hosted model when the relay is composed:
#   llmgw_requests_total{model,outcome}      a counter: every record naming a relayed model,
#                                            by its `outcome` (Outcome below); all four outcome
#                                            values of every model are registered at zero
#   llmgw_request_duration_seconds{model}    a histogram: every record naming a relayed model,
#                                            observing its `duration_ms` in seconds. Its
#                                            buckets are fixed, `le` = 0.05, 0.1, 0.25, 0.5, 1,
#                                            2.5, 5, 10, 30, 60, 120, 300 and +Inf seconds; a
#                                            record falls in every bucket whose bound in
#                                            milliseconds is at least its `duration_ms`
#                                            (`_bucket` cumulative, then `_sum` in seconds and
#                                            `_count`), as the Prometheus text format writes one
# Order. The text lists the series in the order above, and each series' samples in alias order,
# then by wire in llm-gateway.gateway.Wire's order (`chat`, `responses`, `messages`, not
# alphabetical), then by outcome in Outcome's order, a histogram's buckets in ascending `le`.
# A label is a model alias from the document or a fixed word; no label or value carries a
# credential, a prompt, a completion or a document's content. The token series are not these
# (story:token-and-cache-metrics).
# DECIDED 2026-10-17 (story:prometheus-metrics): the same text is served, without the owner
# credential, by an optional second listener, the deployment's `metrics_listen`
# (llm-gateway.deployment.DeploymentConfiguration). It answers `GET` and `HEAD` on exactly
# `/metrics` and nothing else: any other method or path is `404 path-unknown`, so no model
# route, probe or inspection path is reachable on it. With `metrics_bearer_file` it takes that
# token as `authorization: Bearer` (absent `credential-absent`, not one bearer token
# `credential-malformed`, another token `credential-rejected`, each 401); without it it is
# open. It serves before `mark_ready` and while draining, and stops with the gateway. The
# owner-guarded `/metrics` of the serving listener is unchanged.
# DECIDED 2026-10-08: `GET /metrics` (and `HEAD`) requires the owner credential, like every path
# outside the closed two-path probe set and the two public routes, and is served once the
# gateway is ready, like inspection (llm-gateway.gateway, docs/gateway.md "The HTTP surface").
#
# Usage. A usage record is what the gateway learned about one model call it was asked to relay.
# The token counters are llm's (beyond10x/llm spec/domains/chat.yaml at ee2ae428, its usage
# scenarios): a counter the upstream did not report stays absent, and a reported zero is a
# report. The record never fills an absent counter from an estimate, and never puts the alias
# where the upstream's own model name belongs.
# DECIDED 2026-10-06 (operator, option A of decision-blocker:usage-from-responses): the gateway
# reads usage out of a copy of every answer, event streams included, on each of the three wires.
# The client still receives the target's status, content type and body unchanged (llm-gateway.
# gateway RelayObservation, step 9). The parse uses llm's protocol crates, taken by tag (AGENTS.md
# "Dependencies on llm"), behind a port the binary implements, so the gateway crate's dependency
# closure stays empty (crates/llm-gateway/tests/dependency_boundary.rs). The token counters and
# `reported_model` are story:usage-records'; `disposition`, `refusal`, `status`,
# `response_bytes` and `duration_ms` need no parsing and are story:gateway-observability's.
# DECIDED 2026-10-08 (story:gateway-observability): a record is made for every request to a
# relayed wire path that passed owner authentication, whatever answered it, and goes two ways:
# into the counters above, and out of the gateway through a port the embedding implements
# (`UsageRecords`), as the target source does. The binary writes each as one structured
# `tracing` event at `info` (row O3: level from `RUST_LOG`, default `info`). There is no
# exporter. An unauthenticated or shed request makes no record. Tests read a record from the
# `Relay` command's `records` fact.
#
# Finished calls. DECIDED 2026-11-26 (story:finished-call-facts; sessionspec
# docs/interaction-records.md sections 2 and 6): every model call that was given a call id
# (llm-gateway.gateway.CallHeader), except `POST /v1/messages/count_tokens`, hands the embedding
# one FinishedCall through one port, `FinishedCalls::finished(&self, call, bytes)`, declared on
# the relay (`Relay::with_finished_calls`) as UsageRecords is, and called once per call on the
# connection's thread, after its UsageRecord and before the connection is closed. A relayed,
# translated, passthrough or refused call hands one; a count-tokens call, a shed request and one
# that failed authentication hand none (they have no call id or no model turn). The value is
# built at the one place a call ends, where its UsageRecord is made; the dashboard's finished call
# reads its start, upstream, queue wait, time to first token and session from it, so they are
# gathered once.
# BOUNDARY: sessionspec's `sessionspec_records::wire::GatewayFacts` (crate
# `sessionspec-records`) takes these fields one to one: `call_id`, `session_hash`, `harness`,
# `path`, `route`, `upstream`, `attempts`, `queue_wait_ms`, `ttft_ms`, `started_ms` and
# `finished_ms` by name; `declared_cost_usd` becomes its `declared_cost_microdollars` and
# `ending` its `incomplete` (`Complete` none, `ClientDisconnected` `client_disconnected`,
# `UpstreamCut` `upstream_cut`, `WireError` `wire_error`, `Refused` `refused`), converted by the
# embedding, which links llm's money type: the gateway does no arithmetic on money. Its
# `WireCall` takes `wire` and CallBytes' copy (`request`, and `answer` as `Body` or `Events`).
# ESS has no cross-system relation, so this is a comment, not a reference.
# The session hash is the dashboard's, from one shared reader: SHA-256 of
# `llm-gateway.session/1\0<source>\0<value>`, its first 6 bytes as 12 lower-case hex digits, where
# `<source>` is `claude-code` for `x-claude-code-session-id`, `session-id` for `session-id`,
# `session_id` and `x-opencode-session`, and `agent-address` for the user agent and the client's
# address `<user agent>\0<address>` when no header names the session.
# The byte copy. DECIDED 2026-11-26 (story:finished-call-facts): off unless the relay is declared
# `with_call_bytes(<bound>)`; off, the port gets no CallBytes and no byte of the call is copied.
# On, a call whose request body and answer body together are at most the bound (CallBytesBound)
# gets `Copied` with both; one over it gets `OverBound` with both sizes and no bytes, its copy
# dropped the moment it passed the bound. The client's answer is the same byte for byte with the
# copy on or off, on every wire and relay path.
types:
  # Which harness named a call's session, read as the dashboard labels it: Claude Code by
  # `x-claude-code-session-id` or a `claude-cli` user agent, Codex by a `codex…` user agent or by
  # `session-id`, `session_id` or `x-opencode-session` sent without a user agent, every other
  # client `Other`.
  - name: llm-gateway.telemetry.Harness
    kind: enum
    variants: [ClaudeCode, Codex, Other]
  # How a finished call ended, in this order of precedence: `Refused` when the client was answered
  # a refusal (the FinishedCall's `refusal` names its code, `upstream-failed` included); else
  # `WireError` when the answer, its head written, ended in its wire's terminal error (told by a
  # translator, or read from its bytes); else `UpstreamCut` when a read of the answer's body
  # failed after its head was written; else `ClientDisconnected` when the client went away before
  # the answer's last byte or before any answer was written; else `Complete`, whatever the
  # answer's status.
  - name: llm-gateway.telemetry.CallEnding
    kind: enum
    variants: [Complete, ClientDisconnected, UpstreamCut, WireError, Refused]
  # Whether a call's bytes were copied or were over the bound.
  - name: llm-gateway.telemetry.CallBytesKind
    kind: enum
    variants: [Copied, OverBound]
  # How a copied answer is held: `Body`, the answer's body bytes as the client received them,
  # de-chunked; `Events`, for an answer whose content type is `text/event-stream` and that carries
  # no content coding, the `data:` payload of each server-sent event the client received whole,
  # in order (several `data:` lines of one event joined by a line feed; an event not ended by a
  # blank line before the answer ended is not one). An answer with a content coding is copied as
  # `Body` of the bytes the client received, encoded.
  - name: llm-gateway.telemetry.AnswerCopyKind
    kind: enum
    variants: [Body, Events]
  # The bound a relay declares with `with_call_bytes`: the most bytes of request body and answer
  # body together that one call's copy holds. A call at the bound is copied; one byte over it is
  # `OverBound`. The answer counts its body bytes as the client received them, de-chunked (a
  # stream's whole text, not only its payloads).
  - name: llm-gateway.telemetry.CallBytesBound
    kind: newtype
    of: Integer
    naming:
      summary: The most request and answer body bytes one call's copy holds; declared by the embedding.
  # `Process`: one series per gateway. `ModelWire`: one series per declared (model, wire) pair,
  # labelled `model` and `wire` (llmgw src/lib.rs:170-178).
  # `Model`: one series per relayed model, labelled `model` (and `outcome` for the outcome
  # counter).
  - name: llm-gateway.telemetry.SeriesScope
    kind: enum
    variants: [Process, ModelWire, Model]
  # llmgw declares each of its 13 series `# TYPE <name> counter` (llmgw src/lib.rs:147-179).
  - name: llm-gateway.telemetry.SeriesKind
    kind: enum
    variants: [Counter, Histogram]
  # How one call ended, from the gateway's side: relayed to the client with the target's answer
  # (a 4xx or 500 from the target included, row W7), refused by the gateway before any target
  # answered (`target-unavailable` and `model-cold-start` included: the source handed out none),
  # or ended `upstream-failed` (502). A translated request whose client went away before any
  # answer was written (a non-streamed client that closed while it waited) is `Relayed` with
  # `status` 0, no `target_status` and 0 `response_bytes`: no answer was written because the
  # client left (story:gateway-translation, correction round 2).
  - name: llm-gateway.telemetry.Disposition
    kind: enum
    variants: [Relayed, Refused, UpstreamFailed]
  # How one model call ended, as `llmgw_requests_total` labels it (story:prometheus-metrics):
  #   `ok`              Relayed: an answer reached the client, whatever its status
  #   `upstream_error`  the target failed, refused the call or closed without an answer:
  #                     `upstream-failed` (not timed out), `upstream-refused`,
  #                     `translation-unrepresentable`, `translation-too-large`
  #   `timeout`         the target's read timeout passed before its answer head
  #                     (`upstream-failed`), or a start deadline passed (`model-cold-start`)
  #   `refused`         the gateway refused the call before reaching a target: every other
  #                     refusal code (`spend-ceiling`, `model-stopped`, `target-unavailable`,
  #                     `context-exceeded`, a body or model refusal, …)
  # The table of every refusal code is published in docs/gateway.md, and
  # crates/llm-gateway/src/metrics.rs checks it against `RefusalCode::ALL`. A translated
  # request's transport timeout is reported by the translator as an upstream failure and is
  # counted `upstream_error`. So is a translated answer whose head was written and which the
  # translator ended with its wire's terminal error: its record stays `Relayed`, with the status
  # the client received and no refusal.
  - name: llm-gateway.telemetry.Outcome
    kind: enum
    variants: [Ok, UpstreamError, Timeout, Refused]
  # DECIDED 2026-11-25 (story:call-id-and-usage-record): where a CallRecord is. `in-flight` from
  # the moment its id is given out until the last byte of its answer or its refusal is written,
  # then `ended`. Written as the `state` key of the record.
  - name: llm-gateway.telemetry.CallState
    kind: enum
    attributes:
      - {name: label, type: String}
    variants:
      - {name: InFlight, attributes: {label: in-flight}}
      - {name: Ended, attributes: {label: ended}}
entities:
  - name: llm-gateway.telemetry.MetricSeries
    identity: {name: name, type: String}
    fields:
      - {name: help, type: String}
      - {name: kind, type: llm-gateway.telemetry.SeriesKind}
      - {name: scope, type: llm-gateway.telemetry.SeriesScope}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  - name: llm-gateway.telemetry.UsageRecord
    identity: {name: record_id, type: String}
    fields:
      # DECIDED 2026-11-25 (story:call-id-and-usage-record): the id the call was given
      # (llm-gateway.gateway.CallHeader), which every answer to it carried and its CallRecord
      # is read by. The binary writes it as the `call` field of the record's `usage` event, with
      # `input_tokens`, `output_tokens`, `cache_read_tokens` and `cache_creation_tokens` under
      # the CallRecord's names, each left out when absent.
      - {name: call, type: String}
      # The relayed model's alias, as the client named it in the body's top-level `model`.
      # Absent when the body named no relayed model: a refusal before the body was read, and
      # `body-incomplete`, `body-not-json`, `model-absent` and `model-unknown`. A name no model
      # carries never reaches a record, a label or a log line.
      - {name: model, type: 'Optional<String>'}
      - {name: wire, type: llm-gateway.gateway.Wire}
      - {name: disposition, type: llm-gateway.telemetry.Disposition}
      # How the call ended for `llmgw_requests_total` (Outcome).
      - {name: outcome, type: llm-gateway.telemetry.Outcome}
      # Present exactly when `disposition` is `Refused` or `UpstreamFailed`.
      - {name: refusal, type: 'Optional<llm-gateway.gateway.Refusal>'}
      # The status line the client received; 0 when none was written because the client left
      # before a translated answer (Disposition).
      - {name: status, type: Integer}
      # The status the target answered with: the relayed one, or the 502, 503 or 504 the
      # gateway answered `upstream-failed` instead. Absent when no target answered: a refusal
      # before any target was asked, or a target that could not be reached or closed without
      # an answer.
      - {name: target_status, type: 'Optional<Integer>'}
      # The model name the target reported in its answer. Absent when it reported none; it is
      # never the alias and never the upstream name the gateway rewrote the request to (row W2).
      - {name: reported_model, type: 'Optional<String>'}
      # DECIDED 2026-10-16 (story:model-profile-fallback): the profile
      # (llm-gateway.runpod.ModelProfile `name`) of the pod that served the call, `default` for
      # a model declaring none. Absent when no pod served it: a hosted endpoint, and a refusal
      # before a pod was handed out. The binary's record carries it; the `Relay` command's
      # `records` fact does not, because the gateway scenarios relay to no pod
      # (`a_relayed_call_names_the_profile_of_the_pod_that_served` in
      # crates/llm-gateway-cli/tests/relaying.rs).
      - {name: profile, type: 'Optional<String>'}
      # DECIDED 2026-11-21 (story:gateway-sa-token-ingress): the service account a reviewed bearer
      # named under `ingress_auth = "service-account-token"` (llm-gateway.gateway IngressAuth),
      # `system:serviceaccount:<namespace>:<name>`, taken from the review's answer and never from a
      # request header. Absent for the owner and for a call that took no credential. The binary
      # writes it as the `principal` field of the record's `usage` event; it is no metric label.
      # PLANNED: a per-caller series and quota, in the planned llm-gateway.clients domain.
      - {name: principal, type: 'Optional<String>'}
      - {name: input_tokens, type: 'Optional<Integer>'}
      - {name: output_tokens, type: 'Optional<Integer>'}
      - {name: cached_input_tokens, type: 'Optional<Integer>'}
      - {name: cache_creation_input_tokens, type: 'Optional<Integer>'}
      - {name: reasoning_output_tokens, type: 'Optional<Integer>'}
      # DECIDED 2026-11-26 (story:cost-per-call): what the call cost in USD, by the token price
      # its model declares (llm-gateway.deployment.TokenPriceDeclaration, or a route's
      # RoutePriceDeclaration), computed by llm 0.24.0's own pricing (`llm_cost::PriceBook::quote`,
      # each class's line rounded up once to a nanodollar, the lines summed) and written as llm
      # writes an `Amount`: a decimal string without trailing zeros (`0.000135`, `0`). Present
      # only for a call that was relayed (no `refusal`) and whose answer ended as written (not
      # cut by the client leaving, not cut short by its upstream, not ended in its wire's
      # terminal error), whose model declares
      # a price, whose answer reported both its input and its output tokens, and where every
      # token class the answer reported a non-zero count of has a rate. Otherwise absent: never
      # `0` in place of an unknown, never a lower bound, never an estimate. The classes are
      # llm's: input not read from or written to a cache, cache read, cache creation, output.
      # On the messages wire `input_tokens` leaves the cache classes out; on chat and responses
      # it counts them in. A cache class the answer did not report counts no tokens. The binary writes it as the `cost_usd` field of
      # the record's `usage` event.
      - {name: cost_usd, type: 'Optional<Decimal>'}
      # Decoded body bytes of the target's answer relayed to the client (llmgw
      # `route_response_bytes_total`); 0 for a refusal, whose body is the gateway's own.
      - {name: response_bytes, type: Integer}
      # From the end of the request head to the last byte relayed or the refusal written.
      - {name: duration_ms, type: Integer}
    lifecycle: {initial: Recorded, states: [Recorded], terminal: [Recorded]}
  # DECIDED 2026-11-25 (story:call-id-and-usage-record): one model call as the owner reads it by
  # its id at `GET /v1/calls/{id}` (llm-gateway.gateway.CallRoute), one JSON object
  # `{"format":"llm-gateway.call/1", …}` with its keys in the order of these fields. A value the
  # call's UsageRecord does not carry is an absent key, never 0 and never an estimate.
  # `in-flight`: `id`, `state`, `model` once the body named a relayed model, `wire` and
  # `principal`. `ended`: the UsageRecord's values, with `cache_read_tokens` from its
  # `cached_input_tokens` and `cache_creation_tokens` from its `cache_creation_input_tokens`;
  # `reasoning_output_tokens` and `reported_model` are not in the record. The gateway holds every
  # in-flight call and the last 1024 ended ones (bound `ended-calls-held`), the oldest ended one
  # dropped first; a dropped call is `call-unknown`. A gateway composed again holds none of the
  # earlier calls (`a1_a_gateway_composed_again_gives_out_no_earlier_id_and_holds_none` in
  # crates/llm-gateway/tests/observability/calls.rs).
  # DECIDED 2026-11-26 (story:cost-per-call): `cost_usd`, after the token keys, is the
  # UsageRecord's `cost_usd` written as a JSON string, the decimal llm writes for an amount
  # (`"0.0001299"`), so no reader parses money as a float; absent when the UsageRecord has none
  # and on an `in-flight` record (`a2_a_priced_calls_record_names_its_cost_after_the_token_keys_
  # and_an_unpriced_ones_none` in crates/llm-gateway/tests/observability/calls.rs).
  # ESS-LIMIT: an entity's lifecycle takes the wire name `state`, so the field that the record
  # writes as its key `state` is declared `call_state` here; the record is observed, never moved
  # by a command, and its lifecycle is that of an observation.
  - name: llm-gateway.telemetry.CallRecord
    identity: {name: id, type: String}
    fields:
      - {name: call_state, type: llm-gateway.telemetry.CallState}
      - {name: model, type: 'Optional<String>'}
      - {name: wire, type: llm-gateway.gateway.Wire}
      - {name: disposition, type: 'Optional<llm-gateway.telemetry.Disposition>'}
      - {name: outcome, type: 'Optional<llm-gateway.telemetry.Outcome>'}
      - {name: refusal, type: 'Optional<llm-gateway.gateway.Refusal>'}
      - {name: status, type: 'Optional<Integer>'}
      - {name: target_status, type: 'Optional<Integer>'}
      - {name: input_tokens, type: 'Optional<Integer>'}
      - {name: output_tokens, type: 'Optional<Integer>'}
      - {name: cache_read_tokens, type: 'Optional<Integer>'}
      - {name: cache_creation_tokens, type: 'Optional<Integer>'}
      - {name: cost_usd, type: 'Optional<Decimal>'}
      - {name: response_bytes, type: 'Optional<Integer>'}
      - {name: duration_ms, type: 'Optional<Integer>'}
      - {name: profile, type: 'Optional<String>'}
      - {name: principal, type: 'Optional<String>'}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  # DECIDED 2026-11-26 (story:finished-call-facts): what the gateway knows of one finished model
  # call, handed to the FinishedCalls port once (the Finished calls note above). Observed through
  # the `Relay` command's `finished` fact (llm-gateway.gateway.RelayObservation).
  - name: llm-gateway.telemetry.FinishedCall
    identity: {name: call_id, type: String}
    fields:
      # The Harness's session, hashed by the shared reader; never a header's value.
      - {name: session_hash, type: String}
      - {name: harness, type: llm-gateway.telemetry.Harness}
      # The request path the client called: one wire's path (llm-gateway.gateway.Wire).
      - {name: path, type: String}
      # The inbound wire, the one the client spoke; a translated call's upstream speaks another.
      - {name: wire, type: llm-gateway.gateway.Wire}
      # The relayed model's alias the body named; absent when it named none (UsageRecord `model`).
      - {name: route, type: 'Optional<String>'}
      # The authority of the target the call was handed; absent when none was.
      - {name: upstream, type: 'Optional<String>'}
      # Attempts at the target: each attempt of a passthrough call, 1 on the byte relay and the
      # translated path once a target was handed out, 0 when none was.
      - {name: attempts, type: Integer}
      # Milliseconds from the end of the request head until the target's connection was open;
      # absent when none was opened by the relay (a translated call, a refusal before it).
      - {name: queue_wait_ms, type: 'Optional<Integer>'}
      # Milliseconds from the end of the request head until the first answer body byte reached
      # the client; absent when none did.
      - {name: ttft_ms, type: 'Optional<Integer>'}
      # The UsageRecord's `cost_usd`, the same decimal: present exactly when it is.
      - {name: declared_cost_usd, type: 'Optional<Decimal>'}
      - {name: ending, type: llm-gateway.telemetry.CallEnding}
      # Present exactly when `ending` is `Refused`: the refusal the client was answered.
      - {name: refusal, type: 'Optional<llm-gateway.gateway.Refusal>'}
      # Milliseconds since the Unix epoch: the end of the request head, and the moment the call's
      # last byte or refusal was written. `finished_ms - started_ms` is the UsageRecord's
      # `duration_ms`.
      - {name: started_ms, type: Integer}
      - {name: finished_ms, type: Integer}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  # DECIDED 2026-11-26 (story:finished-call-facts): the copy of one call's bytes the port is
  # handed beside its FinishedCall when the relay declares a CallBytesBound. `Copied` holds the
  # request body as the gateway read it (empty when it read none: a refusal before or while the
  # body was read) and the answer as the client received it, translated for the client on a
  # translated call; `answer` is absent when no answer head of the target's was written to the
  # client (a refusal, a client that left before one). `OverBound` holds no bytes, only both
  # sizes.
  - name: llm-gateway.telemetry.CallBytes
    identity: {name: call_id, type: String}
    fields:
      - {name: kind, type: llm-gateway.telemetry.CallBytesKind}
      # The request body's size in bytes.
      - {name: request_bytes, type: Integer}
      # The answer body's size in bytes as the client received it; 0 with no answer.
      - {name: answer_bytes, type: Integer}
      # How a `Copied` answer is held; absent for `OverBound` and when no answer was written.
      - {name: answer, type: 'Optional<llm-gateway.telemetry.AnswerCopyKind>'}
      # The number of events of an `Events` answer; absent otherwise.
      - {name: events, type: 'Optional<Integer>'}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}

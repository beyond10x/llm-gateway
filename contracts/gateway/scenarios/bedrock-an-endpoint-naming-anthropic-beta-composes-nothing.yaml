type: ess-scenario/1
domain: llm-gateway.gateway
scenario: bedrock-an-endpoint-naming-anthropic-beta-composes-nothing
summary: the binary refuses a hosted endpoint that names anthropic_beta, a key of a Bedrock model only, as config:value, and nothing is composed
timeline:
- at: '2026-10-23T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","document":"listen = \"127.0.0.1:0\"\nowner_secret_file = \"/run/credentials/owner\"\n\n[hosted.open]\nwires = [\"messages\"]\nbase_url = \"http://10.0.0.7:8000/\"\nauth_kind = \"anonymous\"\nanthropic_beta = [\"fixture-beta-a\"]\n","withheld":["10.0.0.7"],"steps":[{"step":"mark_ready"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    valid_program: true
    error_code: 'config:value'
    results: []
    secret_on_wire: null
    withheld_on_wire: null

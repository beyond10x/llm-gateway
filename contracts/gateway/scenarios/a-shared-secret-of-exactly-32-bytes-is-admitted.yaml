type: ess-scenario/1
domain: llm-gateway.gateway
scenario: a-shared-secret-of-exactly-32-bytes-is-admitted
summary: a 32-byte owner secret composes a gateway the owner can inspect
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","steps":[{"step":"mark_ready"},{"step":"send","raw":"GET /v1/routes/code HTTP/1.1\r\nauthorization: Bearer aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\r\n\r\n"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    error_code: null
    results:
    - ok
    - 200 inspected
    secret_on_wire: false

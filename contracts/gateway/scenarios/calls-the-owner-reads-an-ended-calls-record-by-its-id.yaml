type: ess-scenario/1
domain: llm-gateway.gateway
scenario: calls-the-owner-reads-an-ended-calls-record-by-its-id
summary: the owner reads a relayed call's and a refused call's record by the id their answers carried, keys in the published order and an absent value absent, with GET and HEAD only, and nobody else reads it
timeline:
- at: '2026-11-25T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"small","upstream_model":"served-small","wires":["chat","responses"]}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"chat-1\",\"usage\":{\"prompt_tokens\":11,\"completion_tokens\":7,\"prompt_tokens_details\":{\"cached_tokens\":3}}}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"small\",\"messages\":[]}"},{"step":"request","method":"GET","path":"/v1/calls/<call>","body":"","call_from":1},{"step":"request","method":"HEAD","path":"/v1/calls/<call>","body":"","call_from":1},{"step":"request","method":"GET","path":"/v1/calls/<call>","body":"","call_from":1,"credential":false},{"step":"request","method":"POST","path":"/v1/calls/<call>","body":"","call_from":1},{"step":"request","method":"GET","path":"/v1/calls/<call>","body":"{}","call_from":1},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"other\",\"messages\":[]}"},{"step":"request","method":"GET","path":"/v1/calls/<call>","body":"","call_from":7}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: null
    results:
    - 'ok'
    - '200 relayed'
    - '200 answered'
    - '200 answered'
    - '401 credential-absent'
    - '405 method-not-allowed'
    - '400 body-not-allowed'
    - '404 model-unknown'
    - '200 answered'
    calls:
    - 'new'
    - 'absent'
    - 'absent'
    - 'absent'
    - 'absent'
    - 'absent'
    - 'new'
    - 'absent'
    bodies:
    - '{"id":"chat-1","usage":{"prompt_tokens":11,"completion_tokens":7,"prompt_tokens_details":{"cached_tokens":3}}}'
    - '{"format":"llm-gateway.call/1","id":"<call>","state":"ended","model":"small","wire":"chat","disposition":"relayed","outcome":"ok","status":200,"target_status":200,"input_tokens":11,"output_tokens":7,"cache_read_tokens":3,"response_bytes":110,"duration_ms":"<bounded>"}'
    - ''
    - '{"error":{"code":"credential-absent","message":"no owner credential was presented"}}'
    - '{"error":{"code":"method-not-allowed","message":"this path does not accept that method"}}'
    - '{"error":{"code":"body-not-allowed","message":"the inspection surface accepts no request body"}}'
    - '{"error":{"code":"model-unknown","message":"no such model"}}'
    - '{"format":"llm-gateway.call/1","id":"<call>","state":"ended","wire":"chat","disposition":"refused","outcome":"refused","refusal":"model-unknown","status":404,"response_bytes":0,"duration_ms":"<bounded>"}'
    headers:
    - 'content-type=application/json cache-control=absent allow=absent'
    - 'content-type=application/json cache-control=no-store allow=absent'
    - 'content-type=application/json cache-control=no-store allow=absent'
    - 'content-type=application/json cache-control=no-store allow=absent'
    - 'content-type=application/json cache-control=no-store allow=GET, HEAD'
    - 'content-type=application/json cache-control=no-store allow=absent'
    - 'content-type=application/json cache-control=no-store allow=absent'
    - 'content-type=application/json cache-control=no-store allow=absent'
    upstream:
    - 'pod-1 POST /v1/chat/completions {"model":"served-small","messages":[]}'

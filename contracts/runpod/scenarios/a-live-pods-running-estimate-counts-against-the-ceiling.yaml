type: ess-scenario/1
domain: llm-gateway.runpod
scenario: a-live-pods-running-estimate-counts-against-the-ceiling
summary: a live pod adds its price times its time since submission, and the next start that would pass the ceiling is refused
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm-gateway.runpod.Exercise
  input:
    program_json: '{"models":{"a":{"price_per_hour_usd":10,"startup_deadline_ms":1800000,"idle_timeout_ms":36000000},"b":{"price_per_hour_usd":2,"startup_deadline_ms":1800000}},"spend":{"daily_cap_usd":10},"steps":[{"step":"account_spend","daily_usd":1,"total_usd":1},{"step":"until_ready","alias":"a"},{"step":"advance","ms":3000000},{"step":"ensure","alias":"b"}]}'
  outcome: observed
assert:
- view: llm-gateway.runpod.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.runpod.LastExecution
  contains:
    results:
    - ok
    - ready
    - ok
    - err:spend-ceiling:daily:over_usd=0.336112
    create_calls: 1
    spend_reads: 2
    phases:
    - a-1:active
    - b-1:cancelled

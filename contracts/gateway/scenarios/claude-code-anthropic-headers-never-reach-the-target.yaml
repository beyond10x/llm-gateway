type: ess-scenario/1
domain: llm-gateway.gateway
scenario: claude-code-anthropic-headers-never-reach-the-target
summary: anthropic-version, anthropic-beta and x-claude-code-session-id are dropped like every client header; the target receives the gateway's own head on the path without the query
timeline:
- at: '2026-10-15T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["messages"]}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/messages?beta=true","headers":["anthropic-version: 2023-06-01","anthropic-beta: context-management-2025-06-27,structured-outputs-2025-11-13","x-claude-code-session-id: 6f1c2a9e-3b7d-4e58-9a21-0c4d8e7f5b13"],"body":"{\"model\":\"code\",\"max_tokens\":1024,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    results:
    - ok
    - 200 relayed
    upstream:
    - 'pod-1 POST /v1/messages {"model":"served-code","max_tokens":1024,"messages":[{"role":"user","content":"hi"}]}'
    received_heads:
    - 'content-type: application/json | content-length: 85 | connection: close'
    authorizations:
    - absent

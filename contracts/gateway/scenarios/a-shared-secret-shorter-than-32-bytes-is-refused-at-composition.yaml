type: ess-scenario/1
domain: llm-gateway.gateway
scenario: a-shared-secret-shorter-than-32-bytes-is-refused-at-composition
summary: a 31-byte owner secret composes no gateway at all
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","steps":[{"step":"mark_ready"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    valid_program: true
    error_code: verifier:secret-too-short
    results: []
    secret_on_wire: null
    ready: null

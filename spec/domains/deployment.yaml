  # The `llm.routes/1` document a deployment's `routes` key names (story:routes-document).
  # ESS-LIMIT: the rules are not struct invariants, for the reason ModelDeclaration gives; the
  # crate tests named `routes_*` in crates/llm-gateway-cli/tests/routes.rs prove them.
  #   what is read      the file `routes` names, once at start, through the trusted-file reader
  #                     as a `config` file bounded at 2 MiB (StartupRefusal), then
  #                     `llm_models::routes::Routes::parse` of llm 0.18.0, which parses strictly
  #                     and performs no I/O; `llm-models` is linked with no default feature,
  #                     so llm itself reads no secret. A relative path is resolved from the
  #                     process's working directory, as `owner_secret_file` is. A document llm
  #                     refuses (malformed YAML, an unknown field, a repeated key, an unknown
  #                     format, protocol, auth kind or secret source, a literal secret, a relative
  #                     `file:` path, a route to an undeclared endpoint, …) is `config:value`, its
  #                     message `routes <llm's message>`, which names a field, endpoint or route
  #                     and never a value
  #   the credential rule  credentials come only from trusted files: a `file:` secret is read
  #                     once at start through the trusted-file reader with the endpoint-credential
  #                     policy (`endpoint-credential:<rule>`), a `~/` path resolved against `HOME`
  #                     (`config:value` naming `routes.<endpoint>.auth.secret` when `HOME` is
  #                     unset or not absolute). An `env:` or `keychain:` secret is `config:value`
  #                     naming `routes.<endpoint>.auth.secret`. An `api-key` endpoint's
  #                     `auth.header` must also pass HostedDeclaration's `credential_header` rule
  #                     (`config:value` naming `routes.<endpoint>.auth.header`), and on a
  #                     `messages` endpoint it is not `anthropic-version` in any case, the
  #                     header every request to such an endpoint is sent (same refusal)
  #   the alias collision rule  a route name that is also a `[models.<alias>]` or
  #                     `[hosted.<alias>]` alias is `config:value` naming `routes.<route>`
  #   the base-URL rule  llm appends the wire path to `base_url`; the gateway replaces the wire
  #                     path's leading `/v1` with the base path (llm-gateway.upstream
  #                     HostedEndpoint): the two agree only when the URL names its API path. A
  #                     `base_url` with no path (nothing or `/`), or one whose path breaks
  #                     HostedDeclaration's base-path rule, is `config:value` naming
  #                     `routes.<endpoint>.base_url`; a credential over `http` to a host that is
  #                     not loopback is `config:value` there too, as for `[hosted.*]`
  #   the route-name bound  llm admits a route name of 1..=256 printable ASCII bytes without
  #                     `/`; the gateway serves one of at most 246 bytes (`MAX_ROUTE_NAME_BYTES`:
  #                     256, the inventory label bound, less `.` and the longest wire label,
  #                     `responses`), so that its target id `<route>.<wire>` fits one label. A
  #                     longer name is `config:value` naming `routes.<the name's first 32
  #                     bytes>…` and the bound, never the whole name. DECIDED 2026-10-16
  #                     (correction round 1 of story:routes-document): a published bound and a
  #                     named refusal, rather than a generic label error at start
  #   what is served    each route name is a model alias: its upstream model the route's model
  #                     id, its wires the endpoint's protocol only, its tool calling `parsed`
  #                     exactly when `capabilities.tools` is true, its listed context window
  #                     `capabilities.context_window`; the translator translates it under the
  #                     route's capabilities. A direct `<endpoint>/<model-id>` name, which llm also
  #                     resolves, is not a route and is not served (`model-unknown`). A route's
  #                     endpoint is sent one static header when its protocol is `messages`,
  #                     `anthropic-version: <llm_messages::ANTHROPIC_VERSION>` (`2023-06-01` in
  #                     llm 0.18.0), on every request relayed to it, the output clamp's count
  #                     included, and no other static header. DECIDED 2026-10-16 (correction
  #                     round 1 of story:routes-document): Anthropic's Messages API requires
  #                     the header on every request, llm's client already sends it on the
  #                     translated path, and a routes document has no place to declare it
  #   the inventory     one route per route name, one target `<route>.<wire>` at position 0:
  #                     protocol the endpoint's wire, provider and account `routes`, endpoint the
  #                     endpoint's name, model the route's model id, `binding_revision` the
  #                     SHA-256 of the exact routes document bytes read (`digest`), `auth_kind`
  #                     the endpoint's, `billing_kind` llm's expansion (`self-hosted` for an
  #                     `anonymous` endpoint, `metered` otherwise), and the capabilities' context
  #                     window and output limit; never a base URL, a credential file or a
  #                     credential
  - name: llm-gateway.deployment.RoutesDeclaration
    kind: struct
    fields:
      - {name: endpoints, type: 'Map<String, llm-gateway.deployment.RouteEndpointDeclaration>'}
      - {name: routes, type: 'Map<String, llm-gateway.deployment.RouteDeclaration>'}
      - {name: digest, type: String}
  # The closed TOML deployment document. `listen` maps onto llm-gateway.gateway `Gateway`'s
  # bind address (row K1); `owner_secret_file` is read through the trusted-file reader and
  # becomes the gateway's shared-secret owner verifier.
  # `ingress_auth` (IngressAuth) maps onto llm-gateway.gateway `Gateway`'s `ingress_auth`:
  # `bearer`, the default, requires `owner_secret_file` (`config:value` when it is absent) and
  # every model call takes the owner secret, as before; `none` makes `owner_secret_file`
  # optional and admits a model call without a credential. With `none` and no
  # `owner_secret_file` the owner-only surface (`/metrics`, `/v1/routes`) has no owner at all:
  # the gateway is composed with a verifier that accepts no credential, so those paths are
  # refused (`credential-absent` without a header, `credential-rejected` with a bearer token,
  # `credential-malformed` with anything else, as with a secret). With `none`
  # and an `owner_secret_file` they take that secret, as with `bearer`. Any other value is
  # `config:schema`.
  # DECIDED 2026-10-16 (story:ingress-auth-optional): a gateway behind something that
  # authenticates already (a mesh, a private network, one machine) need not make its local
  # clients hold a token; the owner-only surface stays closed because nothing in that case asks
  # for it, and the startup line above says the model calls are open. A relative `owner_secret_file` is
  # resolved from the process's working directory, not from the document's directory
  # (`k30_a_relative_owner_secret_file_is_read_from_the_working_directory` in
  # crates/llm-gateway-cli/tests/binary.rs). `routes`, optional, is the path of an `llm.routes/1`
  # document (RoutesDeclaration). At least one model, of `models`, `hosted` or the routes
  # document, is required: `parse`, which reads no file, admits a document naming `routes` and no
  # other model, and a routes document without a route then refuses the start `config:value`
  # naming `models`. Each model alias, of either table, is served as one route of the inspection
  # inventory, one target per wire, whose `config_digest` is the SHA-256 of the exact document
  # bytes read. A Runpod model's targets are `bearer` and `self-hosted`, its provider the
  # model's provider; a hosted model's carry the declaration's `auth_kind` and `billing_kind`,
  # provider and account `hosted`, endpoint the alias and model its `upstream_model`. No target
  # renders a base URL, a credential file or a credential.
  # DECIDED 2026-10-17 (story:prometheus-metrics): `metrics_listen` and `metrics_bearer_file`
  # are top-level keys beside `listen` (the document has no `[gateway]` table).
  # `metrics_listen`, optional and absent by default, is a `<address>:<port>` the gateway binds a
  # second listener on, serving
  # `GET /metrics` without the owner credential and nothing else (llm-gateway.telemetry). It
  # must differ from `listen` (`config:value` naming `metrics_listen`). `metrics_bearer_file`,
  # optional, names the trusted file of the token a scrape must send as `authorization: Bearer`
  # (StartupRefusal `metrics-bearer:*`); it is `config:value` without `metrics_listen`. Without
  # it the listener is open, and the guides say to bind it only on an address a network policy
  # guards. A relative path is resolved from the working directory, as `owner_secret_file`.
  - name: llm-gateway.deployment.DeploymentConfiguration
    kind: struct
    fields:
      - {name: listen, type: String}
      - {name: ingress_auth, type: llm-gateway.deployment.IngressAuth}
      - {name: owner_secret_file, type: 'Optional<String>'}
      - {name: metrics_listen, type: 'Optional<String>'}
      - {name: metrics_bearer_file, type: 'Optional<String>'}
      - {name: providers, type: 'Map<String, llm-gateway.deployment.ProviderDeclaration>'}
      - {name: models, type: 'Map<String, llm-gateway.deployment.ModelDeclaration>'}
      - {name: hosted, type: 'Map<String, llm-gateway.deployment.HostedDeclaration>'}
      - {name: routes, type: 'Optional<String>'}
  # Why `b10x-llm-gateway credential set` refused (CredentialSetCommand), reported as
  # `credential:<rule>`:
  #   `credential:unknown-target`     `--model` names no `[hosted.*]` or `[models.*]` alias, or
  #                                   `--route` no route of the routes document the deployment
  #                                   names; the message quotes the given name only when it is at
  #                                   most 64 characters of `A-Z a-z 0-9 . _ -`, and otherwise
  #                                   says "the given name"
  #   `credential:not-hosted`         `--model` names a `[models.*]` (Runpod) model, whose key
  #                                   is not an upstream key
  #   `credential:anonymous`          the target's endpoint is `anonymous`: it takes no key
  #   `credential:no-terminal`        no `--stdin`, and `/dev/tty` cannot be opened or set to
  #                                   read without echo
  #   `credential:input-cancelled`    the prompt was ended by Ctrl-C, Ctrl-D or a hang-up (end of
  #                                   input before a newline)
  #   `credential:input-unreadable`   reading the key failed
  #   `credential:input-empty`        nothing before the terminator
  #   `credential:input-too-large`    a key over 4096 bytes
  #   `credential:input-not-a-token`  anything but one printable ASCII token: a CR, an LF other
  #                                   than the one terminator, a space, a tab, a control or a
  #                                   non-ASCII byte, leading or trailing whitespace included
  #   `credential:probe-rejected`     the probe was answered 401 or 403
  #   `credential:probe-unreachable`  the probe failed in transport: no connection, a TLS
  #                                   certificate the gateway does not trust, a timeout (the
  #                                   whole probe is bounded by 30 s) or no HTTP status line
  #   `credential:directory-missing`  the target's directory does not exist or is not a
  #                                   directory
  #   `credential:directory-unsafe`   the target's directory is owned by neither the effective
  #                                   user nor root, or is group- or world-writable (mode &
  #                                   0o022): another user could replace the file the gateway
  #                                   reads
  #   `credential:write`              the temporary file could not be created, written, flushed
  #                                   or renamed over the target
  # No message quotes the key or any part of it.
  - name: llm-gateway.deployment.CredentialRefusal
    kind: enum
    variants: [UnknownTarget, NotHosted, Anonymous, NoTerminal, InputCancelled, InputUnreadable, InputEmpty, InputTooLarge, InputNotAToken, ProbeRejected, ProbeUnreachable, DirectoryMissing, DirectoryUnsafe, Write]
  # What `credential set` stores a key for: a `[hosted.<alias>]` model (`--model`) or a route of
  # the routes document (`--route`).
  - name: llm-gateway.deployment.CredentialTargetKind
    kind: enum
    variants: [Model, Route]
  # The probe's outcome, as the success line writes it: `passed` (a 2xx answer), `skipped`
  # (`--no-probe`), `not-rejected` (any status but 2xx, 401 and 403).
  - name: llm-gateway.deployment.CredentialProbe
    kind: enum
    variants: [Passed, Skipped, NotRejected]
  # DECIDED 2026-10-17 (the owner's request): `b10x-llm-gateway credential set --config <CONFIG>
  # (--model <ALIAS> | --route <NAME>) [--stdin] [--no-probe]` stores one upstream key in the file
  # the deployment already names for it, so that the next start reads it. It is the documented
  # way to store a key; the reader's rules below are the ones both it and any other writer aim at.
  # ESS-LIMIT: the rules are not struct invariants: a terminal, a file mode, a rename and an HTTP
  # probe are process-environment facts no conformance command models. The crate tests in
  # crates/llm-gateway-cli/tests/credential_set.rs prove them.
  #   the target rule   read from the document only, through `load` (the deployment document
  #                     and, for `--route`, the routes document it names); no credential file,
  #                     owner secret or key is read. `--model` takes a `[hosted.<alias>]`
  #                     declaration's `credential_file`, `auth_kind`, `credential_header`,
  #                     `base_url` and `headers`; `--route` takes the route's endpoint's `file:`
  #                     secret (a `~/` path below `HOME`, `config:value` naming
  #                     `routes.<endpoint>.auth.secret` without an absolute `HOME`), its auth,
  #                     its base URL and the static header a `messages` endpoint is sent
  #                     (`anthropic-version`). There is no provider preset. Exactly one of
  #                     `--model` and `--route` (a command-line error otherwise). A document the
  #                     server would refuse to load is refused with the server's `config:*` code
  #                     (StartupRefusal). Refused: an unknown alias or route
  #                     (`credential:unknown-target`), a `[models.*]` model
  #                     (`credential:not-hosted`), an anonymous endpoint (`credential:anonymous`)
  #   the input rule    a hidden prompt on `/dev/tty` (echo, canonical input and signal keys
  #                     off, restored on every path; Ctrl-C, Ctrl-D or a hang-up, end of input
  #                     before a newline, cancels and a partial line is never taken), or standard input
  #                     with `--stdin`; never an argument or an environment variable. One line:
  #                     the first `\n` ends the key and is not part of it (end of input does
  #                     too); nothing may follow it. The key is one printable ASCII token of
  #                     1..=4096 bytes, the reader's token rule (`credential:input-*`)
  #   the probe rule    unless `--no-probe`: one `GET <base path>/models` (`/v1/models` without a
  #                     base path, the path the gateway relays a `/v1/models` request to: a base
  #                     path replaces the wire path's leading `/v1`) to the endpoint's authority, sent `host`, the entry's own
  #                     credential header (`authorization: Bearer <key>`, or `<credential_header>:
  #                     <key>`), its static headers, `accept: application/json` and
  #                     `connection: close`, over the TLS client the gateway reaches every `https`
  #                     hosted endpoint with (plain TCP for a loopback `http` one). The whole
  #                     probe, connect, TLS handshake and status line, ends within 30 s overall
  #                     (10 s bounds each connect, read and write inside it), else it is a
  #                     transport failure. Interim `1xx` answers, with their headers, are
  #                     skipped: the status is the first final one. No model is called. 401 or 403 is
  #                     `credential:probe-rejected` and a transport failure
  #                     `credential:probe-unreachable`, and either writes nothing; a 2xx answer is
  #                     `passed` and any other status `not-rejected`, and both store
  #   the write rule    the target's directory must exist (`credential:directory-missing`) and
  #                     be owned by the user or root and not group- or world-writable
  #                     (`credential:directory-unsafe`). A temporary file `.<name>.<pid>.tmp` in
  #                     it is created exclusively, mode 0600, without following a symlink,
  #                     written with exactly the key's bytes, flushed to disk, then read back
  #                     through the trusted-file reader and token rule the server applies at
  #                     start (the endpoint-credential policy; its `endpoint-credential:<rule>`
  #                     code if it refuses) and compared with the key; only then is it renamed
  #                     over the target. Any refusal leaves the target as it was and removes the
  #                     temporary file
  #   the output rule   on success one line on standard error, `b10x-llm-gateway: credential
  #                     stored <path> probe <passed|skipped|not-rejected> http <code|->`, exit
  #                     status 0; a refusal is `b10x-llm-gateway: refused <code>: <message>`,
  #                     exit status 1; a command-line error prints one fixed usage line naming
  #                     the error kind and `b10x-llm-gateway credential set --help`, never an
  #                     argument's value, exit status 2. No line, event or refusal carries the key
  #                     or any part of it
  # The reader's rules for a credential file, which every writer aims at: a regular file, not a
  # symbolic link, owned by the effective user or root, no group or world permission bit, at most
  # 4098 bytes, UTF-8, and once trailing ASCII whitespace is trimmed one printable ASCII token of
  # at most 4096 bytes (StartupRefusal's endpoint-credential rules).
  - name: llm-gateway.deployment.CredentialSetCommand
    kind: struct
    fields:
      - {name: config, type: String}
      - {name: target_kind, type: llm-gateway.deployment.CredentialTargetKind}
      - {name: target, type: String}
      - {name: stdin, type: Boolean}
      - {name: probe, type: Boolean}
entities:
  # One run of the binary. A refused start has a `refusal` and no `listening`; a served run has
  # `listening`, and `stopped_by` once a signal ended it.
  - name: llm-gateway.deployment.GatewayProcess
    identity: {name: process_id, type: String}
    fields:
      - {name: configuration, type: 'Optional<llm-gateway.deployment.DeploymentConfiguration>'}
      - {name: configuration_digest, type: 'Optional<String>'}
      # The routes document read at start, when the configuration names one.
      - {name: routes, type: 'Optional<llm-gateway.deployment.RoutesDeclaration>'}
      - {name: refusal, type: 'Optional<llm-gateway.deployment.StartupRefusal>'}
      - {name: listening, type: 'Optional<String>'}
      - {name: stopped_by, type: 'Optional<llm-gateway.deployment.StopSignal>'}
      # The graceful stop's report, as `accepted=<n> completed=<n>`.
      - {name: shutdown, type: 'Optional<String>'}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  # One run of `b10x-llm-gateway credential set` (CredentialSetCommand). A stored run has `path`,
  # `probe` and, when a probe was answered, `http_status`; a refused run has `refusal` or
  # `startup_refusal` (a `config:*` or `endpoint-credential:*` code the server's own reader gave)
  # and leaves the target as it was.
  - name: llm-gateway.deployment.CredentialSetRun
    identity: {name: run_id, type: String}
    fields:
      - {name: command, type: llm-gateway.deployment.CredentialSetCommand}
      - {name: path, type: 'Optional<String>'}
      - {name: probe, type: 'Optional<llm-gateway.deployment.CredentialProbe>'}
      - {name: http_status, type: 'Optional<Integer>'}
      - {name: refusal, type: 'Optional<llm-gateway.deployment.CredentialRefusal>'}
      - {name: startup_refusal, type: 'Optional<llm-gateway.deployment.StartupRefusal>'}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}

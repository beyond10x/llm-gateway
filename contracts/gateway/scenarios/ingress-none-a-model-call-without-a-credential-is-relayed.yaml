type: ess-scenario/1
domain: llm-gateway.gateway
scenario: ingress-none-a-model-call-without-a-credential-is-relayed
summary: with ingress_auth none a model call without a credential, and one with a wrong one, are relayed on every wire, while the counters still take the owner secret
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","ingress_auth":"none","models":[{"alias":"open","upstream_model":"served-open","wires":["chat","responses","messages"]}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"chat-1\"}"]},{"status":200,"content_type":"application/json","chunks":["{\"id\":\"resp-1\"}"]},{"status":200,"content_type":"application/json","chunks":["{\"id\":\"msg-1\"}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"open\",\"messages\":[]}","credential":false},{"step":"request","path":"/v1/responses","body":"{\"model\":\"open\",\"input\":\"hi\"}","credential":false,"headers":["authorization: Bearer not-the-owner-0123456789abcdef0123456789"]},{"step":"request","path":"/v1/messages","body":"{\"model\":\"open\",\"messages\":[]}","credential":false,"headers":["authorization: Basic malformed"]},{"step":"scrape","credential":false},{"step":"request","path":"/v1/unknown","body":"{}","credential":false}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: null
    results:
    - 'ok'
    - '200 relayed'
    - '200 relayed'
    - '200 relayed'
    - '401 credential-absent'
    - '401 credential-absent'
    upstream:
    - 'pod-1 POST /v1/chat/completions {"model":"served-open","messages":[]}'
    - 'pod-1 POST /v1/responses {"model":"served-open","input":"hi"}'
    - 'pod-1 POST /v1/messages {"model":"served-open","messages":[]}'
    authorizations:
    - 'absent'
    - 'absent'
    - 'absent'
    secret_upstream: false
    acquired: 3
    released: 3

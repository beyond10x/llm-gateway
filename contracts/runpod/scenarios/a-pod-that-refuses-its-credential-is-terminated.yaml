type: ess-scenario/1
domain: llm-gateway.runpod
scenario: a-pod-that-refuses-its-credential-is-terminated
summary: a pod refusing its vLLM key is retired as credential-refused and terminated
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.runpod.Exercise
  input:
    program_json: '{"models":{"qwen":{}},"steps":[{"step":"ready_after","probes":1},{"step":"ensure","alias":"qwen"},{"step":"refuse_credential","pod":"pod-1"},{"step":"ensure","alias":"qwen"}]}'
  outcome: observed
assert:
- view: llm-gateway.runpod.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.runpod.LastExecution
  contains:
    results:
    - ok
    - err:starting
    - ok
    - err:credential-refused
    terminations:
    - pod-1
    pods: []

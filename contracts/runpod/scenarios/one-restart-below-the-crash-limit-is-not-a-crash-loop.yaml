type: ess-scenario/1
domain: llm-gateway.runpod
scenario: one-restart-below-the-crash-limit-is-not-a-crash-loop
summary: two restarts against a declared limit of three leave the pod starting and untouched
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.runpod.Exercise
  input:
    program_json: '{"models":{"qwen":{"crash_restart_limit":3}},"steps":[{"step":"ready_after","probes":4294967295},{"step":"uptimes","script":[30,5,40,2]},{"step":"until_ready","alias":"qwen"}]}'
  outcome: observed
assert:
- view: llm-gateway.runpod.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.runpod.LastExecution
  contains:
    results:
    - ok
    - ok
    - never-ready
    terminations: []
    create_calls: 1

type: ess-scenario/1
domain: llm-gateway.gateway
scenario: calls-every-answer-to-an-authenticated-model-call-carries-a-new-id
summary: a relayed answer, a refusal and a wrong method on a wire path each carry one new call id, also after a restart, while a request that fails authentication and an answer off the wire paths carry none
timeline:
- at: '2026-11-25T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"small","upstream_model":"served-small","wires":["chat","responses"]}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"chat-1\"}"]},{"status":200,"content_type":"application/json","chunks":["{\"id\":\"chat-2\"}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"small\",\"messages\":[]}"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"other\",\"messages\":[]}"},{"step":"request","method":"GET","path":"/v1/responses","body":""},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"small\",\"messages\":[]}","credential":false},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"small\",\"messages\":[]}","credential":false,"headers":["authorization: Bearer not-the-owner-0123456789abcdef0123456789"]},{"step":"request","method":"GET","path":"/v1/status","body":""},{"step":"restart"},{"step":"mark_ready"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"small\",\"messages\":[]}"}]}'

type: ess-scenario/1
domain: llm-gateway.runpod
scenario: a-secret-name-unusable-in-a-runpod-template-is-refused
summary: a vLLM key secret name outside [A-Za-z0-9_]+ is refused at construction
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.runpod.Exercise
  input:
    program_json: '{"models":{"qwen":{"api_key_secret":"a b}}"}},"steps":[]}'
  outcome: observed
assert:
- view: llm-gateway.runpod.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.runpod.LastExecution
  contains:
    error_code: invalid-model:secret-reference
    create_calls: 0

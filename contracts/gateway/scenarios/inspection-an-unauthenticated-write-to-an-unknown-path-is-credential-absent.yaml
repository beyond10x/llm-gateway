type: ess-scenario/1
domain: llm-gateway.gateway
scenario: inspection-an-unauthenticated-write-to-an-unknown-path-is-credential-absent
summary: without the credential a POST to an unknown path is credential-absent; only the owner learns that the path takes no POST, and that it does not exist
timeline:
- at: '2026-10-08T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","steps":[{"step":"mark_ready"},{"step":"send","raw":"POST /v1/unknown HTTP/1.1\r\ncontent-length: 0\r\n\r\n"},{"step":"send","raw":"POST /v1/unknown HTTP/1.1\r\nauthorization: Bearer owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\r\ncontent-length: 0\r\n\r\n"},{"step":"send","raw":"GET /v1/unknown HTTP/1.1\r\nauthorization: Bearer owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\r\n\r\n"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    results:
    - ok
    - 401 credential-absent
    - 405 method-not-allowed
    - 404 path-unknown
    headers:
    - www-authenticate=Bearer allow=absent
    - www-authenticate=absent allow=GET, HEAD
    - www-authenticate=absent allow=absent

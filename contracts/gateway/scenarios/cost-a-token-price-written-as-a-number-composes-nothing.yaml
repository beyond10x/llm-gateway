type: ess-scenario/1
domain: llm-gateway.gateway
scenario: cost-a-token-price-written-as-a-number-composes-nothing
summary: the binary refuses a document whose Bedrock model writes a token price as a TOML number instead of a quoted decimal string as config:value, and nothing is composed
timeline:
- at: '2026-11-26T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","document":"listen = \"127.0.0.1:0\"\nowner_secret_file = \"/run/owner-secret\"\n\n[hosted.haiku]\nkind = \"bedrock\"\nregion = \"eu-central-1\"\nmodel_id = \"eu.anthropic.claude-fixture-v1:0\"\ncredential_source = \"container\"\n\n[hosted.haiku.token_price]\ninput = 1.25\noutput = \"5\"\n","steps":[{"step":"mark_ready"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    valid_program: true
    error_code: 'config:value'
    results: []

type: ess-scenario/1
domain: llm-gateway.gateway
scenario: metrics-listener-with-a-scrape-token-takes-it-and-decides-the-path-first
summary: a scrape-token listener refuses a missing, malformed or wrong token, and any other path before the token
timeline:
- at: '2026-10-30T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["chat","messages"]}],"pods":[],"metrics_listen":{"bearer":"scrape-token-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"},"steps":[{"step":"scrape","listener":true,"credential":false},{"step":"scrape","listener":true,"authorization":"Basic c2NyYXBl"},{"step":"scrape","listener":true},{"step":"scrape","listener":true,"authorization":"Bearer scrape-token-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"},{"step":"scrape","listener":true,"credential":false,"path":"/v1/routes"},{"step":"scrape","listener":true,"authorization":"Bearer scrape-token-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","path":"/ready"},{"step":"scrape","authorization":"Bearer scrape-token-bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay

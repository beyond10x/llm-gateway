type: ess-scenario/1
domain: llm-gateway.gateway
scenario: w2-the-model-is-rewritten-on-every-wire-and-no-other-byte-changes
summary: only the top-level model value becomes the upstream name, on all three wires; nested model keys, spacing and key order reach the target as sent
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["chat","responses","messages"]}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{}"]},{"status":200,"content_type":"application/json","chunks":["{}"]},{"status":200,"content_type":"application/json","chunks":["{}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/chat/completions","body":"{\"messages\":[{\"role\":\"user\",\"content\":\"model\"}],\"model\":\"code\",\"metadata\":{\"model\":\"code\"}}"},{"step":"request","path":"/v1/responses","body":"{ \"input\" : \"x\" ,\n  \"model\" : \"code\" }"},{"step":"request","path":"/v1/messages","body":"{\"model\":\"code\",\"system\":\"the model is code\"}"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    results:
    - ok
    - 200 relayed
    - 200 relayed
    - 200 relayed
    upstream:
    - 'pod-1 POST /v1/chat/completions {"messages":[{"role":"user","content":"model"}],"model":"served-code","metadata":{"model":"code"}}'
    - "pod-1 POST /v1/responses { \"input\" : \"x\" ,\n  \"model\" : \"served-code\" }"
    - 'pod-1 POST /v1/messages {"model":"served-code","system":"the model is code"}'

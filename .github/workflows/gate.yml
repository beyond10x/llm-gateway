name: Gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  serving-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action revision; toolchain is pinned below
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Rust crates
        run: |
          cargo test --workspace --locked
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Install pinned specification tool
        run: cargo install --locked --git https://github.com/beyond10x/ess.git --rev be44a3365eb273cb3d447b74cd5b0e75181d284e ess-cli --bin ess
      - name: Specification and conformance
        run: |
          ess specify validate --path spec
          cargo run --locked -p b10x-llm-gateway-conformance -- check
      - name: Conformance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: serving-conformance
          path: target/conformance
          if-no-files-found: error

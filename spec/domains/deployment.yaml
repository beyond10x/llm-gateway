domain: llm-gateway.deployment

# The `b10x-llm-gateway` binary (crates/llm-gateway-cli): one process that reads one closed TOML
# deployment document through a trusted-file reader, composes the llm-gateway.gateway `Gateway`
# from it, serves, and stops gracefully on SIGINT or SIGTERM. It replaces llmgw's `llmgw` binary
# (llmgw `src/main.rs:14-96` at 048ebd8; docs/llmgw-capability-matrix.md rows C1, C2, C4, C5,
# K29, K30, D2).
#
# The command line is closed: `--config <CONFIG>`, `-h`/`--help`, `-V`/`--version`, no
# subcommand and no positional argument. llmgw's `--insecure` (C3) has no counterpart: the gateway
# authenticates every request outside its two probes, so the document names the owner secret
# instead.
#
# What the process writes to standard error, one line each:
#   `b10x-llm-gateway: listening on <address>` once the gateway is bound and marked ready;
#   `b10x-llm-gateway: refused <code>: <message>` when startup is refused (exit status 1);
#   `b10x-llm-gateway: stopped by <SIGINT|SIGTERM> accepted=<n> completed=<n>` after a graceful
#   stop (exit status 0). A command-line error is clap's (exit status 2).
# The gateway is bound with `GatewayConfig::new`'s bounds: an 8192-byte head, 64 concurrent
# requests and a ten-second read timeout (llm-gateway.gateway.Gateway). The document has no key
# for any of them. A stop answers every connection already accepted first; how long that takes
# is llm-gateway.gateway's stop rule: at most twice the read timeout for inspection and the
# probes, and not bounded that way for a relay (llm-gateway.gateway.Gateway, ESS-LIMIT).
# DECIDED 2026-10-08 (review row 38, read from the code at c63f07e): the binary serves the three
# wire paths, `POST /v1/chat/completions`, `POST /v1/responses` and `POST /v1/messages`, under
# the owner credential, for the wires each model declares; it relays none of them to a pod yet.
# A model whose provider declares no `connectors` is answered `target-unavailable` (503) on its
# wires, and a document in which a provider declares `connectors` is refused at start (the inert
# wiring below), so no wire request reaches a pod until story:pod-proxy-tls
# (`live_a_model_without_a_connection_is_target_unavailable` and
# `live_a_connectors_document_is_refused_and_the_fixture_receives_nothing` in
# crates/llm-gateway-cli/tests/binary.rs).
# DECIDED 2026-10-08 (row O3, story:gateway-observability): beside those lines the process
# writes `tracing` events to standard error, uncoloured, at the level `RUST_LOG` sets (`info`
# when it is unset, empty or unreadable; a directive it cannot read is dropped without a line). The lines above are not events and stay as written at
# every level. The shipped binary emits one `debug` event, `deployment loaded`; a relaying
# composition also emits one `info` event per usage record, per pod start and per cleanup pass
# that stopped pods, a `warn` event per pod start failure (llm-gateway.telemetry), and one
# `warn` event, `connectors connection unreachable`, naming the provider, when the reachability
# check below fails. No event carries a key, the owner token or an approval proof.
#
# DECIDED: the Runpod API key (row K7) is held by connectors, not by this document: under design
# choice D1 = A (docs/design/runpod-clients.md § 4) the gateway never holds it, so the closed
# document refuses `runpod_api_key_file`. It also carries no `[identity]` (rows K2-K4, not
# needed) and refuses that too.
# DECIDED: each model's vLLM key (row B9) is read from the file its `vllm_api_key_file` names,
# not derived from the Runpod key as llmgw does: the operator writes the value they stored as
# the model's Runpod secret, which the pod receives as `{{ RUNPOD_SECRET_<name> }}`. The binary
# reads each file once at startup and holds the value redacted.
# DECIDED: the relay (row B8) is composed over one `RunpodPool` (`llm_gateway_cli::start_relaying`):
# every model is relayed on its wires, with its `tool_calling`, to the pod the pool hands out for
# its alias, with the model's vLLM key as `authorization: Bearer <key>`. A model relayed this way must name a
# `vllm_api_key_file` (`config:value` otherwise): its pod always expects the key.
# `start_relaying` takes the transport, the connection to a pod and the clock; tests call it with
# `EmulatedRunpod` and loopback pods.
# DECIDED 2026-10-08 (story:live-runpod-wiring, design choice D1 = A): the shipped binary
# (`llm_gateway_cli::start`) always composes the relay, and its only Runpod transport is the
# production one, `ConnectorsRunpod` (llm-gateway.runpod.ConnectorsBinding), built from the
# `connectors` table of the provider (ConnectorsDeclaration below). No command-line option and no
# document key selects `EmulatedRunpod` or any other transport: the closed document refuses every
# key it does not declare (`config:schema`).
#   * A provider that declares `connectors` is connected; its models are relayed through one
#     `RunpodPool` over that transport and must each name a `vllm_api_key_file`
#     (`config:value`). Each such key is handed to the transport by model alias
#     (`ConnectorsRunpod::set_vllm_key`) for the readiness probe, and is the relay's bearer.
#   * At most one provider declares `connectors` (`config:value` otherwise): the pool's controller
#     identity and account are fixed, so two pools would sweep each other's pods.
#   * A model whose provider declares no `connectors` is answered `target-unavailable` on its
#     wires; no pool is asked and no process is run for it.
#   * DECIDED: every refusal the document can earn is decided before the first `connectors`
#     call: the owner secret, the key files, the inventory, the relayed models, each connected
#     model as the pool runs it (`RunpodModel`), the hosting policy and each model's bearer. A
#     document's validity never depends on the connection, and a refused document costs no call.
#     Only process facts (`signal:install`, `listen:bind`) are decided after it.
#   * DECIDED: "reachable" is decided once, at start, before the gateway is marked ready: the work
#     directory is an existing directory owned by the effective user with no group or world
#     permission, and one `pods.list` through the transport answers a complete listing (exit 0,
#     a 2xx status, every entry readable). Anything else is unreachable: the binary still starts,
#     writes the `connectors connection unreachable` event, composes no pool and runs no further
#     `connectors` call for the life of the process, and every model of that provider is
#     answered `target-unavailable`. A connection repaired later takes a restart: a checked
#     connection never changes under a running process.
#   * The connection to a pod is the Runpod proxy's TLS endpoint (`https://`, from llm's Runpod
#     description), which the binary cannot open yet (story:pod-proxy-tls): the shipped pod
#     connector refuses every connection, so no vLLM key leaves the process unencrypted, and the
#     probe reports an `https://` endpoint `Unreachable`, so no pod would ever become ready.
#   * DECIDED 2026-10-08: so that the binary cannot create a billed pod that can never serve,
#     the wiring is inert in the shipped binary until story:pod-proxy-tls. `start` refuses a
#     document in which any provider declares `connectors` with `config:value`
#     (`providers.<name>.connectors cannot be served until the binary speaks TLS to the pod
#     endpoint`), as its first step: before the owner secret or any key file is read, before
#     any `connectors` call and before anything is bound. The process exits 1 like any refused
#     document. `load` still reads and checks the table, so the document's rules stay enforced
#     and tested. story:pod-proxy-tls removes this refusal.
#   * `llm_gateway_cli::start_connected` is the composition `start` will run once that refusal
#     is gone, with the transport wrapped and the pod connector supplied by the caller. Only
#     tests call it, to reach a loopback pod; it is not reachable from the shipped binary's
#     document or command line.
# The pool's inputs, each from the document or fixed:
#   ComputeAuthorization  fixed: ledger `b10x-llm-gateway`, reservation `unmetered`. No budget
#                         ledger is consulted yet; the pair only satisfies the hosting contract
#   wall clock            fixed: system time in Unix milliseconds, never moving backwards
#   LeaseRegistry         fixed: one empty in-process registry per run
#   HostingPolicy         controller `b10x-llm-gateway`, provider `runpod`, account `default`,
#                         ledger `b10x-llm-gateway`, max_lifetime_ms 86400000 (24 h) and
#                         lease_ms 300000 (5 min) are fixed; max_active is the document's model
#                         count, one pod per model
#   RunpodModel           from `[models.<alias>]`: hf_model, image, gpu_types, disk_gb, cache,
#                         data_center_ids, the vLLM settings, cloud_type from the model's
#                         provider, startup_deadline_ms = start_wait_seconds x 1000,
#                         idle_timeout_ms from idle_timeout_minutes. Fixed:
#                         crash_restart_limit 2, crash_window_ms 600000, and api_key_secret
#                         `vllm_<alias>` with every `-` and `.` of the alias written `_` (the
#                         Runpod secret the operator stores the key in)
# The pool is stepped by one cleanup pass (`reap`) before the gateway is marked ready, which
# sweeps the pods a previous run of this controller left (row L15), and then every 60 seconds
# until the stop, well inside lease_ms, as llmgw's reaper (row L13). Proved by `l15_*` and
# `l13_*` in crates/llm-gateway-cli/tests/relaying.rs.
# DECIDED (row K28): a request's hold budget is its own setting, `request_hold_seconds`, separate
# from the pod's startup deadline, `start_wait_seconds`. llmgw uses one value for both. They bound
# different things: the deadline bounds how long a pod may take to serve before it is terminated,
# and the hold bounds how long one client request waits for it. A client with a short timeout of
# its own needs a short hold while the pod keeps its long deadline. The hold defaults to
# `start_wait_seconds`, so a document that does not name it behaves as llmgw. It is at most
# `start_wait_seconds`, because a request still waiting past the deadline would wait for a pod
# that has been terminated. 0 asks the pool once (starting the pod if none is live) and does not
# wait.
# DECIDED (row L6): a request for a model whose pod is not ready is held: the relay asks the pool
# again every 500 ms until the pod is ready, the hold budget passes, or the gateway starts to
# stop. Each ask takes the pool's lock for one step and waits outside it. A held request is bound
# to the pod it first finds starting (`RunpodPool::ensure_held`): it waits on that pod and no
# other, so requests held together start one pod, and a held request never starts a second.
# DECIDED (row W6): a request whose bound pod is still starting when its hold budget passes is
# answered `model-cold-start` (503) with `retry-after: 30`. A request that arrives while the
# model's previous pod is still being stopped waits unbound, and binds to the replacement it
# starts once that stop is confirmed; if its hold budget passes while it is still unbound, no pod
# was starting for it, so it is answered `target-unavailable` without `retry-after`. Once its
# bound pod fails during the hold (retired for its startup deadline, an exit, a crash loop or a
# refused key, marked stop-required, or gone from the slot, whichever request's or cleanup
# pass's step retired it), the request is answered `target-unavailable` at once, without
# `retry-after`, and starts no replacement; the next request does. Any other pool refusal is
# `target-unavailable` too.
# DECIDED: `idle_timeout_minutes = 0` (row K27) means no idle grace: the pod is stopped by the
# first cleanup pass that finds it with no request in flight, and never sooner than its measured
# cold start, which is the floor every idle limit has. `RunpodModel` takes no zero window, so 0 is
# written as 1 ms. Proved by `k27_*` in crates/llm-gateway-cli/tests/relaying.rs.
# DECIDED: a pod counts as in use while a request holds it or waits for it: its idle clock starts
# no earlier than the pool step that first finds it ready, so the cleanup pass never stops the pod
# a waiting request started before that request is served.
# DECIDED: a request through the relay that fails stops the model's current pod if it is the one
# that failed (row W7, `RunpodPool::invalidate`); the next request starts a replacement.
# DECIDED: once the gateway starts to stop, a request may still use a pod that is ready now, but
# starts no pod and waits for none: with no ready pod for its model, or still waiting for one
# when the stop begins, it is answered `target-unavailable` at once. Stopping stops no pod: pods
# outlive the process, and the next start's cleanup pass terminates them.
# ESS-LIMIT: the binary is observed by the crate's row-named process tests
# (crates/llm-gateway-cli/tests/binary.rs, crates/llm-gateway-cli/tests/config.rs), not by a
# conformance command: a signal, a file mode and a symlink are process-environment facts the
# fixture-program targets in checks/conformance do not model.
types:
  # Why startup is refused, reported as `<source>:<rule>`. Sources are `config` (the deployment
  # document), `owner-secret` (the file `owner_secret_file` names), `vllm-api-key` (a file a
  # model's `vllm_api_key_file` names), `listen` and `signal`.
  #
  # The trusted-file rules apply to every file (llmgw `src/trusted.rs:21-42`): the file is opened
  # once without following a final symlink and every check reads that handle. `vllm-api-key`
  # follows `owner-secret` in every rule: mode & 0o077 and a 4098-byte file bound. Every
  # `vllm-api-key:<rule>` message starts `models.<alias>.vllm_api_key_file <path>:`, naming the
  # model and the file and never the key's bytes.
  #   `<source>:unreadable`     the file cannot be opened (absent, no permission)
  #   `<source>:symlink`        the final path component is a symbolic link
  #   `<source>:not-regular`    the handle is not a regular file
  #   `<source>:untrusted-owner` owned by neither the effective user nor root
  #   `<source>:unsafe-mode`    `config`: group- or world-writable (mode & 0o022, as llmgw);
  #                             `owner-secret`: any group or world permission (mode & 0o077),
  #                             because it is a credential
  #   `<source>:too-large`      `config` over 262144 bytes (256 KiB, llmgw `src/config.rs:16`),
  #                             `owner-secret` over 4098 bytes: a 4096-byte token and its CRLF
  #                             (llmgw bounds the file at 4096, `src/config.rs:17`); the bound
  #                             is also enforced on the bytes read, so a file that grows after
  #                             the check is refused
  #   `<source>:not-utf8`       the bytes are not UTF-8
  # Document rules:
  #   `config:schema`  not TOML, or not the closed DeploymentConfiguration: an unknown key at
  #                    any level, a missing required key, or a value of the wrong type. The
  #                    message is `line <n>: <reason>`, naming the line of the offending key
  #                    and, for an unknown key, every key allowed where it stands
  #                    (`k29_a_schema_refusal_names_its_line_and_the_keys_allowed_there`)
  #   `config:value`   a value outside its rule (the ranges on the types below)
  # Owner secret rules, after trailing ASCII whitespace is trimmed:
  #   `owner-secret:too-large`    a token over 4096 bytes (`token:too-large`)
  #   `owner-secret:not-a-token`  empty, or not one printable ASCII token (`token:<rule>` of
  #                               llm-gateway.gateway.CompositionRefusal)
  #   `owner-secret:too-short`    under 32 bytes (`verifier:secret-too-short`)
  # vLLM key rules, after trailing ASCII whitespace is trimmed (the value is sent as a bearer):
  #   `vllm-api-key:too-large`    a key over 4096 bytes
  #   `vllm-api-key:not-a-token`  empty, or not one printable ASCII token
  # Process rules:
  #   `listen:bind`     the listen address cannot be bound
  #   `signal:install`  SIGINT and SIGTERM handlers cannot be installed
  - name: llm-gateway.deployment.StartupRefusal
    kind: enum
    variants: [ConfigUnreadable, ConfigSymlink, ConfigNotRegular, ConfigUntrustedOwner, ConfigUnsafeMode, ConfigTooLarge, ConfigNotUtf8, ConfigSchema, ConfigValue, OwnerSecretUnreadable, OwnerSecretSymlink, OwnerSecretNotRegular, OwnerSecretUntrustedOwner, OwnerSecretUnsafeMode, OwnerSecretTooLarge, OwnerSecretNotUtf8, OwnerSecretNotAToken, OwnerSecretTooShort, VllmApiKeyUnreadable, VllmApiKeySymlink, VllmApiKeyNotRegular, VllmApiKeyUntrustedOwner, VllmApiKeyUnsafeMode, VllmApiKeyTooLarge, VllmApiKeyNotUtf8, VllmApiKeyNotAToken, ListenBind, SignalInstall]
  # The signal that ended a served process.
  - name: llm-gateway.deployment.StopSignal
    kind: enum
    variants: [Sigint, Sigterm]
  # `providers.<name>.kind`: only `runpod-vllm` (llmgw `src/config.rs:50-54`).
  - name: llm-gateway.deployment.ProviderKind
    kind: enum
    variants: [RunpodVllm]
  # `cloud_type`: `SECURE` or `COMMUNITY`, default `SECURE`; maps onto llm_runpod::CloudType.
  - name: llm-gateway.deployment.CloudType
    kind: enum
    variants: [Secure, Community]
  # `wires` entries: `chat`, `responses`, `messages` (llmgw `src/config.rs:56-64`).
  - name: llm-gateway.deployment.Wire
    kind: enum
    variants: [Chat, Responses, Messages]
  # `thinking`: `on` or `off`, default `off`; maps onto llm_runpod::Thinking.
  - name: llm-gateway.deployment.Thinking
    kind: enum
    variants: [On, Off]
  # `reasoning_effort`: the closed set llmgw accepts (llmgw `src/config.rs:18`).
  - name: llm-gateway.deployment.ReasoningEffort
    kind: enum
    variants: [Low, Medium, High, Xhigh]
  # `[providers.<name>]`. The name is 1..=64 of `a-z 0-9 - _ .` without a leading dash
  # (`config:value`).
  # `connectors`, optional: when present the provider's pods are reached through the connectors
  # connection it names, and the table is closed.
  - name: llm-gateway.deployment.ProviderDeclaration
    kind: struct
    fields:
      - {name: kind, type: llm-gateway.deployment.ProviderKind}
      - {name: cloud_type, type: llm-gateway.deployment.CloudType}
      - {name: connectors, type: 'Optional<llm-gateway.deployment.ConnectorsDeclaration>'}
  # `[providers.<name>.connectors]`: how the binary reaches the connectors owner process that
  # holds the Runpod authorization (docs/design/runpod-clients.md § 4). It maps one to one onto
  # llm-gateway.runpod.ConnectorsBinding, `timeout_seconds` x 1000 being its `timeout_ms`. Every
  # rule is `config:value`; a missing key other than `timeout_seconds` is `config:schema`.
  # ESS-LIMIT: the ranges are not struct invariants, for the reason ModelDeclaration gives; the
  # crate tests named `connectors_*` in crates/llm-gateway-cli/tests/config.rs prove them.
  #   executable       an absolute path, 1..=1024 bytes, no control character: the `connectors`
  #                    CLI. It is not looked up on PATH
  #   adapter          1..=128 printable ASCII without a space, not starting with `-` (it is one
  #                    argument of the CLI, never read as an option): the adapter alias the
  #                    connectors configuration binds the Runpod catalog provider to
  #   connection       the same rule: the saved connectors connection id
  #   work_directory   an absolute path, 1..=1024 bytes, no control character: an existing
  #                    private directory for each write's input document and approval proof
  #                    (checked at start, see the reachability rule above)
  #   timeout_seconds  1..=600, default 60: the bound on one CLI call
  - name: llm-gateway.deployment.ConnectorsDeclaration
    kind: struct
    fields:
      - {name: executable, type: String}
      - {name: adapter, type: String}
      - {name: connection, type: String}
      - {name: work_directory, type: String}
      - {name: timeout_seconds, type: Integer}
  # `[models.<alias>]`, llmgw `ModelConfig` (`src/config.rs:95-136`) and its rules
  # (`src/config.rs:244-342`), every one `config:value`. The alias follows the provider-name rule.
  # ESS-LIMIT: the ranges are not struct invariants: synthesis refuses an invariant no view can
  # observe (ESS-SYNTH-013), and no entity publishes a ModelDeclaration outside a Map. The crate
  # tests named `k29_*` prove them.
  #   provider              names a declared provider
  #   wires                 non-empty, no repeat
  #   context_window        4096..=2000000
  #   hf_model, image       1..=200 printable ASCII
  #   gpu_types             1..=16 entries, each 1..=64 printable ASCII, tried in order
  #   max_model_len         1024..=context_window
  #   max_num_seqs          1..=1024, default 8
  #   gpu_util              0.1..=1.0, default 0.90
  #   disk_gb               10..=2000, default 80
  #   thinking              default off
  #   sampling              a JSON object, as text
  #   extra_vllm_args       at most 64, each 1..=256 printable ASCII
  #   network_volume_id     1..=64 ASCII alphanumerics; requires data_center_ids
  #   volume_mount_path     absolute, no trailing slash, at most 128 of `A-Za-z0-9 / - _`,
  #                         default `/workspace`
  #   data_center_ids       at most 16, each 2..=32 of `A-Z 0-9 -`
  #   idle_timeout_minutes  0..=1440, default 30
  #   start_wait_seconds    10..=3600, default 600: the pod's startup deadline
  #   request_hold_seconds  0..=start_wait_seconds, default start_wait_seconds: how long one
  #                         request waits for the pod (row K28)
  #   vllm_api_key_file     optional; the file holding the key the model's pod's vLLM server
  #                         expects, read through the trusted-file reader (`vllm-api-key:<rule>`)
  #   tool_calling          `parsed` or `absent` (llm-gateway.clients.ToolCalling), default
  #                         `absent`; any other value is `config:schema`
  # DECIDED 2026-10-08 (story:model-tool-calling): `tool_calling` is the model's own key, and a
  # document that omits it declares `Absent`. An omitted key then refuses a tool request as
  # `tools-not-served` before a pod is asked for, instead of starting and billing a pod that
  # cannot answer it; a model is served tools only when the operator says its pod parses them
  # (`--enable-auto-tool-choice` and a `--tool-call-parser` in `extra_vllm_args`). The binary
  # does not check those flags against the declaration (llm-gateway.clients ToolCalling says
  # why). Proved by `tool_calling_*` in crates/llm-gateway-cli/tests/config.rs.
  - name: llm-gateway.deployment.ModelDeclaration
    kind: struct
    fields:
      - {name: provider, type: String}
      - {name: wires, type: 'List<llm-gateway.deployment.Wire>'}
      - {name: context_window, type: Integer}
      - {name: hf_model, type: String}
      - {name: image, type: String}
      - {name: gpu_types, type: 'List<String>'}
      - {name: max_model_len, type: Integer}
      - {name: max_num_seqs, type: Integer}
      - {name: gpu_util, type: Decimal}
      - {name: disk_gb, type: Integer}
      - {name: thinking, type: llm-gateway.deployment.Thinking}
      - {name: reasoning_effort, type: 'Optional<llm-gateway.deployment.ReasoningEffort>'}
      - {name: sampling, type: 'Optional<String>'}
      - {name: extra_vllm_args, type: 'List<String>'}
      - {name: network_volume_id, type: 'Optional<String>'}
      - {name: volume_mount_path, type: String}
      - {name: data_center_ids, type: 'List<String>'}
      - {name: idle_timeout_minutes, type: Integer}
      - {name: start_wait_seconds, type: Integer}
      - {name: request_hold_seconds, type: Integer}
      - {name: vllm_api_key_file, type: 'Optional<String>'}
      - {name: tool_calling, type: llm-gateway.clients.ToolCalling}
  # The closed TOML deployment document. `listen` maps onto llm-gateway.gateway `Gateway`'s
  # bind address (row K1); `owner_secret_file` is read through the trusted-file reader and
  # becomes the gateway's shared-secret owner verifier. A relative `owner_secret_file` is
  # resolved from the process's working directory, not from the document's directory
  # (`k30_a_relative_owner_secret_file_is_read_from_the_working_directory` in
  # crates/llm-gateway-cli/tests/binary.rs). At least one model is required. Each
  # model alias is served as one route of the inspection inventory, one target per wire, whose
  # `config_digest` is the SHA-256 of the exact document bytes read.
  - name: llm-gateway.deployment.DeploymentConfiguration
    kind: struct
    fields:
      - {name: listen, type: String}
      - {name: owner_secret_file, type: String}
      - {name: providers, type: 'Map<String, llm-gateway.deployment.ProviderDeclaration>'}
      - {name: models, type: 'Map<String, llm-gateway.deployment.ModelDeclaration>'}
entities:
  # One run of the binary. A refused start has a `refusal` and no `listening`; a served run has
  # `listening`, and `stopped_by` once a signal ended it.
  - name: llm-gateway.deployment.GatewayProcess
    identity: {name: process_id, type: String}
    fields:
      - {name: configuration, type: 'Optional<llm-gateway.deployment.DeploymentConfiguration>'}
      - {name: configuration_digest, type: 'Optional<String>'}
      - {name: refusal, type: 'Optional<llm-gateway.deployment.StartupRefusal>'}
      - {name: listening, type: 'Optional<String>'}
      - {name: stopped_by, type: 'Optional<llm-gateway.deployment.StopSignal>'}
      # The graceful stop's report, as `accepted=<n> completed=<n>`.
      - {name: shutdown, type: 'Optional<String>'}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}

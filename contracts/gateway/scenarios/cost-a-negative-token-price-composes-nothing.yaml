type: ess-scenario/1
domain: llm-gateway.gateway
scenario: cost-a-negative-token-price-composes-nothing
summary: the binary refuses a document whose hosted model declares a negative token price as config:value, and nothing is composed
timeline:
- at: '2026-11-26T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","document":"listen = \"127.0.0.1:0\"\nowner_secret_file = \"/run/owner-secret\"\n\n[hosted.remote]\nwires = [\"chat\"]\nbase_url = \"http://127.0.0.1:9/v1\"\nauth_kind = \"anonymous\"\n\n[hosted.remote.token_price]\ninput = \"-3\"\noutput = \"15\"\n","steps":[{"step":"mark_ready"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    valid_program: true
    error_code: 'config:value'
    results: []

type: ess-scenario/1
domain: llm-gateway.hosting
scenario: an-uncertain-create-is-confirmed-adopted-and-discharged-on-the-callers-evidence
summary: one record walks lose, relose, confirm, adopt and discharge through the controller's calls and ends Stopped with the evidence its caller gave
timeline:
- at: '2026-10-30T12:00:00Z'
  command: llm-gateway.hosting.Declare
  input: {id: d1, request_id: request-d1, reservation_id: reservation-a}
  outcome: declared
- at: '2026-10-30T12:00:01Z'
  command: llm-gateway.hosting.Provision
  input: {id: d1, answer: Unknown}
  outcome: lost
- at: '2026-10-30T12:00:02Z'
  command: llm-gateway.hosting.Retry
  input: {id: d1, answer: Unknown}
  outcome: lost
- at: '2026-10-30T12:00:03Z'
  command: llm-gateway.hosting.Retry
  input: {id: d1, answer: Accepted}
  outcome: accepted
- at: '2026-10-30T12:00:04Z'
  command: llm-gateway.hosting.ObserveListed
  input: {id: d1}
  outcome: adopted
- at: '2026-10-30T12:00:05Z'
  command: llm-gateway.hosting.ConfirmStopped
  input: {id: d1, evidence: operator-ticket-1}
  outcome: confirmed
assert:
- view: llm-gateway.hosting.OwnedResources
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.hosting.OwnedResources
  contains:
    id: d1
    state: Stopped
    request_id: request-d1
    reservation_id: reservation-a
    stop_evidence: operator-ticket-1

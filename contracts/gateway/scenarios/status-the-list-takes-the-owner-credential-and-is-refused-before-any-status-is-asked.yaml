type: ess-scenario/1
domain: llm-gateway.gateway
scenario: status-the-list-takes-the-owner-credential-and-is-refused-before-any-status-is-asked
summary: GET /v1/status takes the owner credential, its method, a body and readiness are refused before any status is asked, and a model without a status has no phase or callable
timeline:
- at: '2026-11-25T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","ingress_auth":"none","models":[{"alias":"small","upstream_model":"small","wires":["chat","responses"]}],"pods":[[]],"steps":[{"step":"request","method":"GET","path":"/v1/status","body":""},{"step":"mark_ready"},{"step":"request","method":"GET","path":"/v1/status","body":"","credential":false},{"step":"request","method":"POST","path":"/v1/status","body":""},{"step":"request","method":"GET","path":"/v1/status","body":"{}"},{"step":"request","method":"GET","path":"/v1/status","body":""},{"step":"request","method":"HEAD","path":"/v1/status","body":""}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: null
    results:
    - 503 unavailable
    - ok
    - 401 credential-absent
    - 405 method-not-allowed
    - 400 body-not-allowed
    - 200 answered
    - 200 answered
    bodies:
    - '{"error":{"code":"unavailable","message":"the gateway is not ready to serve inspection"}}'
    - '{"error":{"code":"credential-absent","message":"no owner credential was presented"}}'
    - '{"error":{"code":"method-not-allowed","message":"this path does not accept that method"}}'
    - '{"error":{"code":"body-not-allowed","message":"the inspection surface accepts no request body"}}'
    - '{"format":"llm-gateway.status/1","models":[{"model":"small","kind":"pod","wires":["chat","responses"]}]}'
    - ''
    headers:
    - content-type=application/json cache-control=no-store allow=absent
    - content-type=application/json cache-control=no-store allow=absent
    - content-type=application/json cache-control=no-store allow=GET, HEAD
    - content-type=application/json cache-control=no-store allow=absent
    - content-type=application/json cache-control=no-store allow=absent
    - content-type=application/json cache-control=no-store allow=absent
    lifecycle_asks:
    - status small
    - status small
    acquired: 0
    upstream: []
    connections: []
    records: []

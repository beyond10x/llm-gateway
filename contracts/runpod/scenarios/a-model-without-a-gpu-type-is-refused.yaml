type: ess-scenario/1
domain: llm-gateway.runpod
scenario: a-model-without-a-gpu-type-is-refused
summary: a declaration with no GPU type is refused at construction and Runpod is never contacted
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.runpod.Exercise
  input:
    program_json: '{"models":{"qwen":{"gpu_types":[]}},"steps":[{"step":"ensure","alias":"qwen"}]}'
  outcome: observed
assert:
- view: llm-gateway.runpod.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.runpod.LastExecution
  contains:
    valid_program: true
    error_code: invalid-model:no-gpu
    results: []
    create_calls: 0
    lists: 0

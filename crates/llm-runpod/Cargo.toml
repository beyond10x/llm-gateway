[package]
name = "b10x-llm-runpod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Runpod provisioning adapter for vLLM."

[lints]
workspace = true

[lib]
name = "llm_runpod"

# A fixture of the `connectors` CLI that tests/transport.rs drives the production transport
# against. It is a test helper, built by cargo so that no test runs a shell script.
[[bin]]
name = "connectors-fixture"
path = "tests/fixture/connectors.rs"
test = false
doc = false

[dependencies]
llm-provision = { package = "b10x-llm-provision", path = "../llm-provision" }
llm-providers = { package = "b10x-llm-providers", git = "https://github.com/beyond10x/llm", tag = "0.5.0" }
serde_json.workspace = true

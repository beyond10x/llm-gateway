type: ess-scenario/1
domain: llm-gateway.gateway
scenario: claude-code-the-startup-probe-head-api-hello-is-refused
summary: Claude Code's connection-warming HEAD /api/hello is credential-absent without the owner credential and path-unknown with it, each without a body
timeline:
- at: '2026-10-15T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","steps":[{"step":"mark_ready"},{"step":"send","raw":"HEAD /api/hello HTTP/1.1\r\nanthropic-version: 2023-06-01\r\n\r\n"},{"step":"send","raw":"GET /api/hello HTTP/1.1\r\n\r\n"},{"step":"send","raw":"HEAD /api/hello HTTP/1.1\r\nauthorization: Bearer owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\r\nanthropic-version: 2023-06-01\r\n\r\n"},{"step":"send","raw":"GET /api/hello HTTP/1.1\r\nauthorization: Bearer owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\r\n\r\n"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    results:
    - ok
    - 401 no-body
    - 401 credential-absent
    - 404 no-body
    - 404 path-unknown
    bodies:
    - ''
    - '{"error":{"code":"credential-absent","message":"no owner credential was presented"}}'
    - ''
    - '{"error":{"code":"path-unknown","message":"no such gateway resource"}}'
    headers:
    - www-authenticate=Bearer allow=absent
    - www-authenticate=Bearer allow=absent
    - www-authenticate=absent allow=absent
    - www-authenticate=absent allow=absent

type: ess-scenario/1
domain: llm-gateway.runpod
scenario: the-spend-check-runs-before-each-create-of-the-gpu-fallback
summary: each create of the GPU fallback is preceded by its own spend check
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm-gateway.runpod.Exercise
  input:
    program_json: '{"models":{"qwen":{"price_per_hour_usd":2,"startup_deadline_ms":1800000}},"spend":{"daily_cap_usd":10},"steps":[{"step":"refuse_gpu","gpu":"NVIDIA L40S"},{"step":"account_spend","daily_usd":0,"total_usd":0},{"step":"ensure","alias":"qwen"}]}'
  outcome: observed
assert:
- view: llm-gateway.runpod.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.runpod.LastExecution
  contains:
    results:
    - ok
    - ok
    - err:starting
    create_calls: 2
    spend_reads: 2
    requested_gpus:
    - NVIDIA L40S
    - NVIDIA H100 NVL

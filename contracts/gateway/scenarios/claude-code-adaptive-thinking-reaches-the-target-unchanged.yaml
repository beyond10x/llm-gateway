type: ess-scenario/1
domain: llm-gateway.gateway
scenario: claude-code-adaptive-thinking-reaches-the-target-unchanged
summary: the thinking object Claude Code sends to a model id it does not recognise, type adaptive, reaches the target unchanged on the messages wire (llm-gateway.clients ThinkingHandling Relayed)
timeline:
- at: '2026-10-15T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["messages"],"tool_calling":"parsed"}],"pods":[[{"status":200,"content_type":"text/event-stream","framing":"chunked","chunks":["event: message_start\ndata: {\"type\":\"message_start\"}\n\n","event: message_stop\ndata: {\"type\":\"message_stop\"}\n\n"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/messages?beta=true","body":"{\"model\":\"code\",\"max_tokens\":1024,\"stream\":true,\"thinking\":{\"type\":\"adaptive\"},\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}]}"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    results:
    - ok
    - 200 relayed
    bodies:
    - "event: message_start\ndata: {\"type\":\"message_start\"}\n\nevent: message_stop\ndata: {\"type\":\"message_stop\"}\n\n"
    upstream:
    - 'pod-1 POST /v1/messages {"model":"served-code","max_tokens":1024,"stream":true,"thinking":{"type":"adaptive"},"messages":[{"role":"user","content":"hi"}]}'
    acquired: 1

type: ess-scenario/1
domain: llm-gateway.gateway
scenario: start-on-request-true-without-a-daily-cap-composes-nothing
summary: the binary refuses a document whose model names start_on_request = true while its provider declares no daily_cap_usd as config:value, and nothing is composed
timeline:

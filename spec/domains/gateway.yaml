domain: llm-gateway.gateway

# The authenticated single-owner gateway (crates/llm-gateway, docs/gateway.md). It admits one
# owner through an injected verifier, serves a closed two-path liveness and readiness surface,
# lists its models and answers setup instructions without a credential (`GET /v1/models` and
# `GET /`, rows R5 and R1), lets the owner read an immutable route inventory and its counters
# (`GET /metrics`, row R4), drains and stops gracefully
# (crates/llm-gateway/src/lib.rs:5-18). The entities are verification-adapter observations of
# the real `Gateway` bound to a loopback socket and exercised with raw HTTP/1.1 requests; they
# are not a production event bus.
#
# The gateway also relays three model-call wires to a target the embedding selects
# (story:wire-relay; the `Relay` command below). A model's declared `wires` are the wires its
# upstream speaks. A request on one of them is relayed byte for byte. A request on another wire
# goes to the relay's `Translator`, when the embedding composed one (story:gateway-translation),
# and is refused `wire-not-served` otherwise.
# DECIDED 2026-10-16 (story:gateway-translation): the translation contract.
#   - Where: the gateway crate holds only a std-only port (crates/llm-gateway/src/translate.rs,
#     `Translator` and `Translation`); the binary implements it with llm 0.18.0's ingress decoders,
#     protocol clients and ingress encoders (crates/llm-gateway-cli/src/translate.rs) over a tokio
#     runtime the binary owns. The upstream wire is the model's first declared wire.
#   - Decode before any target: the client's body is decoded onto llm's neutral turn, checked
#     against the model's capabilities and projected for the upstream wire before the target
#     source is asked, so a refused request never wakes a pod. A field outside llm's subset is
#     `translation-unsupported`; a value breaking one of its rules is `translation-invalid`;
#     carried reasoning state (llm `Item::UnattributedOpaque`) is `translation-opaque-state`:
#     the upstream speaks another protocol than the one the state was read from, and the gateway
#     binds no carried state. Nothing is dropped.
#   - Upstream: the target supplies the scheme, authority, base path and credential; the turn is
#     sent once with llm's client for the upstream wire. Neither the gateway's static headers nor
#     the Messages effort mapping and output clamp apply on this path.
#   - Answer: a streamed answer is written event by event as the client wire's server-sent
#     events, a non-streamed one as its JSON object, with the upstream's reported counters and
#     no others. Continuation state the upstream mints for its own wire (Responses reasoning
#     items, Messages signed thinking) is not carried to another wire. An upstream that fails
#     before any output is `upstream-failed` (and is reported to the target source, as on the
#     byte relay) when it could not be reached, timed out, was unavailable or cut its connection
#     (a reset, or an end inside a frame), whatever was dispatched, and `upstream-refused`, the
#     target kept, when its answer's status refused the request or its answer broke its wire
#     (a stream ended cleanly before its terminal event, a call to a tool not offered). An answer llm's encoder refuses is `translation-unrepresentable`, and one past
#     a bound of the translated path `translation-too-large`, before any output; after output
#     either ends with the wire's terminal error (`response.failed`, an `error` event, or a chat
#     `data: {"error":…}` chunk and no `[DONE]`). A client that stops reading, or that closes
#     its connection while it waits for a non-streamed answer, cancels the turn; nothing is
#     retried or replayed.
# DECIDED 2026-10-16 (correction round 1 of story:gateway-translation): no key of a translated
#   request is passed over: a key outside the subset, at any level, is
#   `translation-unsupported`, not dropped. A translated messages request naming no output
#   limit carries `min(16384, w / 2)` of the window `w` it is translated under (200000 for a
#   model that declares none) rather than the whole window.
# DECIDED 2026-10-17 (story:llm-0-7-0-pin): the translator runs on llm 0.7.0, whose decoders
#   give every field a coding-agent client sends one rule (llm docs/design.md "Client request
#   fields"): carried, translated, advisory or refused by name, and refuse every other key by
#   its path at every level. llm 0.6.0's chat and responses decoders passed over keys below the
#   top level, and the gateway closed those levels itself; it no longer does, so a field llm
#   0.7.0 carries (a Responses item's `id`, `instructions`, `parallel_tool_calls`,
#   `prompt_cache_key`, `text.verbosity`, `reasoning.summary`, `client_metadata`; a Messages
#   `thinking`, a `system` of text blocks, `cache_control`, effort `max`) reaches the upstream
#   as llm projects it, and one it refuses (`thinking.display`, `context_management`,
#   `output_config.format`, `text.format`, a hosted tool, a `strict` chat function) is
#   `translation-unsupported`. Claude Code's first turn and Codex's first turn are carried
#   (scenario translate-a-coding-agents-turn-reaches-another-wire-with-its-controls). Codex's
#   second turn replays a reasoning item, which is still `translation-opaque-state` (but see
#   the decision on sealed reasoning state below).
#   A model is translated under the reasoning efforts `minimal` to `xhigh`, and `none` as well
#   when its upstream is chat or responses: llm 0.7.0 checks the effort the upstream wire
#   receives, so effort `max` reaches a chat or responses upstream as `xhigh` and disabled
#   thinking as `none`, while `max` and `none` stay refused on a messages upstream.
# DECIDED 2026-10-17 (story:cross-wire-reasoning-state, design A): reasoning state the gateway
#   minted, sealed and bound per route. Codex replays the reasoning items of its previous answer
#   on every turn, so a translated route that refused every carried item refused Codex's second
#   turn.
#   - The key: the translator generates one HMAC-SHA256 key when it starts (`ring`'s system
#     random source) and never writes it out, logs it or hands it to anything. A gateway that
#     could not generate one seals nothing and carries every answer as before.
#   - The seal: when an answer to a responses client on a translated route carries upstream
#     reasoning state (a messages upstream's signed `thinking` or `redacted_thinking` block,
#     llm `Item::Opaque`), the client is handed, for each block, a finished `reasoning` item
#     whose `encrypted_content` is a Seal over that block for the route's SealScope
#     (ReasoningSeal says what it holds). The first such item is the one the streamed
#     reasoning opened, under its `id`, its summary the reasoning shown. A chat upstream mints
#     no state: when it streamed reasoning (`reasoning_content`), the open reasoning item is
#     finished with a seal over `null`, so a client that replays it replays nothing.
#   - Binding: SealBinding decides each carried item, and SealRefusal names every case that is
#     `translation-opaque-state`, before any target is asked for.
#   - Not sealed: nothing is sealed toward a chat client (llm's chat encoder carries no opaque
#     state) or a messages client (llm's messages encoder places a block the stream did not
#     show after every streamed block, so a replayed block would reach the upstream out of its
#     place); their answers carry no upstream state, as before, and a carried `thinking` block
#     from such a client is `translation-opaque-state`. Same-wire routes are relayed byte for
#     byte and unchanged.
#   - Nothing leaks: the refusal is the fixed one; no log line, event, metric or usage record
#     carries a seal, its key or the state it holds.
# ESS-LIMIT: that a seal cannot be made or altered without the key is a property of HMAC, no
#   ESS construct; nor is the key's secrecy (held in memory only, never rendered), the
#   constant-time check, or that ReasoningSeal `tag` is a function of the key. That a
#   SealScope's two wires differ is no type invariant: no view publishes a SealScope, so
#   synthesis refuses one (`ESS-SYNTH-013`). The scenarios observe what the gateway does with a seal it made for the same
#   route (bound), for another route (refused), with one altered or forged (refused) and with
#   one made before a restart (refused); `seal_*` in crates/llm-gateway-cli/src/seal.rs hold the
#   rest (every byte position, every field of the route, the key never rendered).
# DECIDED 2026-10-16 (correction round 2): an llm `protocol` failure before output is
#   `upstream-refused` and invalidates nothing; only `transport`, `deadline` and `unavailable`
#   replace the target.
# There is exactly one owner (crates/llm-gateway/src/auth.rs:11), and
# the single-owner admission is what the credential scenarios in contracts/gateway/scenarios/ declare.
# DECIDED 2026-09-27: the gateway has no multi-tenant accounts or quotas; tenancy and quotas belong
# to the embedding platform, which runs one gateway per owner.
# ESS-LIMIT: the owner comparison is constant-time (auth.rs:69-78). ESS 0.56 has no construct
# for a timing or side-channel property (no non-functional or duration-distribution assertion
# over a command); only its functional result is declared here, and the timing is proved by the
# crate's unit cases.
# ESS-LIMIT: nothing in the crate's build resolves a credential, opens a connection to an
# upstream or creates a billed resource: its dependency closure, as cargo resolves it, holds no
# credential, HTTP, provisioning, provider or async-runtime crate, and today it is the crate
# alone. The relay speaks only over connections its injected targets open. A dependency graph
# is no ESS construct; `the_transitive_closure_contains_nothing_that_can_resolve_a_secret_or_provision`
# and `the_manifest_names_nothing_forbidden` in crates/llm-gateway/tests/dependency_boundary.rs
# hold it. The gateway is never given a credential source: the embedding resolves the owner's
# material once and hands over an `OwnerToken`
# (`the_owner_inspects_routes_without_a_credential_or_a_secret_read` in tests/gateway.rs).
# ESS-LIMIT: `OwnerToken` is redacted in `Debug`, has no `Display`, no `Clone` and no
# serialisation, and its bytes are overwritten when it is dropped; `TargetBearer` likewise. A
# value's rendering and its freed memory are no ESS construct.
# `the_owner_credential_is_redacted_in_every_debug_rendering` in tests/gateway.rs and
# `row_12_owner_material_and_a_target_bearer_overwrite_their_bytes_on_drop` in
# tests/spec_declarations.rs hold them. On the wire, `secret_on_wire` below is observed.
# DECIDED: an embedding that authenticates otherwise implements `OwnerVerifier` itself, and that
# implementation must redact its own `Debug`; the crate cannot check code it does not hold.
# `GatewayConfig` holds no credential at all (the `Gateway` entity's fields), so a configuration
# value can be logged.
types:
  # The closed refusal set. Each variant carries the wire `code` a client reads, the HTTP
  # `status` and the fixed `message` (crates/llm-gateway/src/error.rs `refusal_codes!`), the
  # same three docs/gateway.md's refusal table publishes. Every refusal is written
  # `{"error":{"code":..,"message":..}}`, and it quotes nothing the caller sent: a rejected
  # credential is never echoed back and no upstream text reaches a refusal
  # (`a_rejected_or_malformed_credential_is_never_echoed_back` in tests/gateway.rs). The
  # attributes are held to the crate by
  # `row_4_every_refusal_the_crate_emits_is_declared_with_its_code_status_and_message` in
  # tests/spec_declarations.rs, and the published table by
  # `the_published_refusal_table_matches_the_codes_the_crate_can_emit` in tests/gateway.rs.
  # Which request earns which code is the decision order of the `Exchange` and `Relay`
  # commands below.
  # DECIDED: llmgw answers `{"error":{"type":..,"message":..}}` with `invalid_request_error`,
  # `model_not_found` and `upstream_error` (llmgw src/lib.rs:515-552, 686-691); llm-gateway keeps
  # its own published refusal shape and codes, so a client reads `error.code`, not `error.type`.
  # DECIDED: llmgw's `model_cold_start` (llmgw src/lib.rs:567-576, 693-699) is `model-cold-start`,
  # kebab-case like every other code here, with the same 503 and `retry-after: 30`. It is the only
  # refusal that carries `retry-after`.
  - name: llm-gateway.gateway.Refusal
    kind: enum
    attributes:
      - {name: code, type: String}
      - {name: status, type: Integer}
      - {name: message, type: String}
    variants:
      - {name: BodyIncomplete, attributes: {code: body-incomplete, status: 400, message: "the request body ended or stalled before it was complete"}}
      - {name: BodyNotAllowed, attributes: {code: body-not-allowed, status: 400, message: "the inspection surface accepts no request body"}}
      - {name: BodyNotJson, attributes: {code: body-not-json, status: 400, message: "the request body is not one JSON object"}}
      - {name: BodyTooLarge, attributes: {code: body-too-large, status: 413, message: "the request body exceeds its byte bound"}}
      - {name: ContextExceeded, attributes: {code: context-exceeded, status: 400, message: "prompt is too long: the input leaves no room for output in the model context window"}}
      - {name: CredentialAbsent, attributes: {code: credential-absent, status: 401, message: "no owner credential was presented"}}
      - {name: CredentialMalformed, attributes: {code: credential-malformed, status: 401, message: "the owner credential is not a bearer token"}}
      - {name: CredentialRejected, attributes: {code: credential-rejected, status: 401, message: "the presented owner credential was rejected"}}
      - {name: MethodNotAllowed, attributes: {code: method-not-allowed, status: 405, message: "this path does not accept that method"}}
      - {name: ModelAbsent, attributes: {code: model-absent, status: 400, message: "the request body names no model"}}
      - {name: ModelColdStart, attributes: {code: model-cold-start, status: 503, message: "the model is still starting; ask again after the retry-after delay"}}
      - {name: ModelUnknown, attributes: {code: model-unknown, status: 404, message: "no such model"}}
      - {name: Overloaded, attributes: {code: overloaded, status: 503, message: "the gateway is already serving its maximum concurrent requests"}}
      - {name: PathUnknown, attributes: {code: path-unknown, status: 404, message: "no such gateway resource"}}
      - {name: RequestMalformed, attributes: {code: request-malformed, status: 400, message: "the request is not well-formed HTTP"}}
      - {name: RequestTooLarge, attributes: {code: request-too-large, status: 431, message: "the request head exceeds its byte bound"}}
      - {name: RouteUnknown, attributes: {code: route-unknown, status: 404, message: "no such route alias"}}
      - {name: SpendCeiling, attributes: {code: spend-ceiling, status: 503, message: "the model's pod was not started: it would pass a spend ceiling of its provider account, or that account's spend is unknown"}}
      - {name: TargetUnavailable, attributes: {code: target-unavailable, status: 503, message: "no model target is available"}}
      - {name: ToolsNotServed, attributes: {code: tools-not-served, status: 400, message: "the model does not serve tool calls"}}
      - {name: TranslationInvalid, attributes: {code: translation-invalid, status: 400, message: "the request breaks a rule of the subset the gateway translates"}}
      - {name: TranslationOpaqueState, attributes: {code: translation-opaque-state, status: 400, message: "the request carries reasoning state the gateway did not seal for this route"}}
      - {name: TranslationTooLarge, attributes: {code: translation-too-large, status: 502, message: "the model's answer passed a bound of the translated path, published in the gateway contract"}}
      - {name: TranslationUnrepresentable, attributes: {code: translation-unrepresentable, status: 502, message: "the model's answer cannot be written on this wire"}}
      - {name: TranslationUnsupported, attributes: {code: translation-unsupported, status: 400, message: "the request uses a field or value outside the subset the gateway translates"}}
      - {name: Unavailable, attributes: {code: unavailable, status: 503, message: "the gateway is not ready to serve inspection"}}
      - {name: UpstreamFailed, attributes: {code: upstream-failed, status: 502, message: "the model target could not be reached or failed; the next request asks for a replacement"}}
      - {name: UpstreamRefused, attributes: {code: upstream-refused, status: 502, message: "the model target refused the translated request"}}
      - {name: WireNotServed, attributes: {code: wire-not-served, status: 400, message: "the model is not served on this wire"}}
  # A wire the gateway relays, each on its own path, to the same path at the target, joined to a
  # hosted endpoint's base path when it has one (Relay step 7; rows R6-R8):
  # `chat` is `POST /v1/chat/completions` (OpenAI chat completions), `responses` is
  # `POST /v1/responses` (the Codex wire), `messages` is `POST /v1/messages` (Anthropic messages).
  # Whether a request to a wire path of a gateway composed with a relay takes the owner
  # credential (server.rs IngressAuth). `Bearer`, the default, authenticates it at step 5 of the
  # `Exchange` order like every other path. `None` admits it without reading `authorization`
  # at all, so a missing, malformed, repeated or wrong credential is no refusal and is never
  # forwarded.
  # Nothing else changes: the probes and public routes as before, and `/metrics`, `/v1/routes`,
  # `/v1/routes/{alias}` and every other path still authenticate, so the surface still cannot be
  # enumerated without the credential. An embedding with no owner at all composes the gateway
  # with `NoOwnerVerifier`, which accepts no credential (scenarios
  # ingress-none-a-model-call-without-a-credential-is-relayed,
  # ingress-none-without-an-owner-secret-the-owner-surface-stays-refused,
  # ingress-none-with-an-owner-secret-the-owner-surface-takes-that-secret).
  # DECIDED 2026-10-16 (story:ingress-auth-optional).
  - name: llm-gateway.gateway.IngressAuth
    kind: enum
    variants: [Bearer, None]
  - name: llm-gateway.gateway.Wire
    kind: enum
    variants: [Chat, Responses, Messages]
  # What a reasoning seal binds (story:cross-wire-reasoning-state; crates/llm-gateway-cli/src/seal.rs
  # `Scope`): the route, as the model's alias (the `RelayModel` alias, ListedModel `id`) and its
  # upstream model, and the two wires of the translation. A seal opens only under exactly the
  # scope it was made for, so one made for another route or another pair of wires is refused.
  # The two wires differ: a same-wire route is relayed byte for byte and seals nothing.
  - name: llm-gateway.gateway.SealScope
    kind: struct
    fields:
      - {name: alias, type: String}
      - {name: upstream_model, type: String}
      - {name: client_wire, type: llm-gateway.gateway.Wire}
      - {name: upstream_wire, type: llm-gateway.gateway.Wire}
  # A seal as a responses client holds it, in a `reasoning` item's `encrypted_content`
  # (`SEAL_PREFIX` in seal.rs): `llmgw-seal-1.`, the sealed state's JSON bytes in unpadded
  # base64url, `.`, and the ReasoningSeal `tag` in unpadded base64url, so every character is a
  # base64url character or `.`. The scenarios' RelayObservation `bodies` write each one
  # `<sealed>`, because its key differs on every run.
  - name: llm-gateway.gateway.Seal
    kind: newtype
    of: String
    prefix: "llmgw-seal-1."
    alphabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_."
  # One seal and what it holds (seal.rs `Sealer::seal`, `Sealer::open`). `state` is the upstream's
  # reasoning block as the upstream gave it (a messages upstream's signed `thinking` or
  # `redacted_thinking` block, llm `Item::Opaque`), or `null` for a chat upstream, which mints
  # no state. `tag` is the 32-byte HMAC-SHA256, under the key the translator generated when it
  # started, of the label `llm-gateway reasoning seal 1`, the `scope`'s `alias`,
  # `upstream_model`, `client_wire` and `upstream_wire` (`chat`, `responses`, `messages`) and the state's
  # JSON bytes, each prefixed with its length as eight big-endian bytes. `seal` is the three
  # written out. The client sees the state; the seal does not hide it, it attributes it: only
  # this gateway, since it last started, could have made it for that scope.
  - name: llm-gateway.gateway.ReasoningSeal
    kind: struct
    fields:
      - {name: seal, type: llm-gateway.gateway.Seal}
      - {name: scope, type: llm-gateway.gateway.SealScope}
      - {name: state, type: Json}
      - {name: tag, type: Bytes}
  # What a translated request's carried reasoning item (llm `Item::UnattributedOpaque`) comes to
  # (translate.rs `bind_sealed`), decided before any target is asked for. An item is bound only
  # when the client's wire is responses, it is a `reasoning` item, and its `encrypted_content`
  # is a Seal that opens, in constant time, under the running key for the request's SealScope.
  #   Bound    the sealed state is a block and the upstream wire is messages: the block is sent
  #            at the item's place, as llm `Item::Opaque` of the binding of the target the relay
  #            acquired, byte for byte as the upstream gave it.
  #   Dropped  the sealed state is `null` and the upstream wire is chat: the item is dropped
  #            before the turn is projected.
  #   Refused  anything else, with the Refusal `TranslationOpaqueState` (400). A request is bound
  #            whole or refused whole.
  - name: llm-gateway.gateway.SealBinding
    kind: enum
    attributes:
      - {name: refusal, type: String}
    variants:
      - {name: Bound, attributes: {refusal: none}}
      - {name: Dropped, attributes: {refusal: none}}
      - {name: Refused, attributes: {refusal: translation-opaque-state}}
  # Why a carried reasoning item is SealBinding `Refused`, each the same fixed
  # `translation-opaque-state` that quotes nothing of the item, so a client cannot tell them
  # apart and the gateway does not either (seal.rs `Sealer::open` answers one `None`):
  #   NotSealable   the client's wire is not responses (a messages client's carried `thinking`
  #                 block; nothing is sealed toward a chat or messages client), or the item is
  #                 not a `reasoning` item, or it is already attributed state
  #   Unsealed      its `encrypted_content` is absent or not a Seal
  #   Altered       a forged seal, or one with any character altered or cut
  #   OtherScope    a seal made for another route or another pair of wires
  #   KeyGone       a seal made before the gateway last started
  #   StateMismatch a seal that opens over state its upstream wire cannot take (a block toward
  #                 chat, `null` toward messages)
  # Scenarios translate-carried-reasoning-state-is-refused-without-asking-for-a-target
  # (NotSealable, Unsealed), translate-sealed-reasoning-state-from-another-route-is-refused
  # (OtherScope), translate-altered-or-forged-sealed-reasoning-state-is-refused (Altered) and
  # translate-sealed-reasoning-state-from-before-a-restart-is-refused (KeyGone) observe them;
  # StateMismatch needs a seal the gateway made for one upstream wire opened under another,
  # which a scope that names the upstream wire forbids, and `bind_sealed` in translate.rs
  # refuses it regardless.
  - name: llm-gateway.gateway.SealRefusal
    kind: enum
    variants: [NotSealable, Unsealed, Altered, OtherScope, KeyGone, StateMismatch]
  # The two public routes (rows R5 and R1; story:public-model-listing), each answered to `GET`
  # and `HEAD` without a credential, by the `path` alone, with the `content_type` named here
  # (`Instructions` takes its own from the InstructionAnswer it chooses). Neither asks the
  # target source for a target, so neither wakes a pod, and neither renders an owner-only fact:
  # no route inventory label, no `config_digest`, no target endpoint or authority, no upstream
  # model name, no bearer and no byte of the owner secret. What they render is read from the
  # relayed models alone (`RelayModel`: alias, wires, tool calling, `max_model_len`,
  # `context_window`); a gateway composed without a relay lists no model.
  # DECIDED: llmgw serves both routes without authentication (llmgw src/lib.rs:127-131), and
  # so does llm-gateway: a client is told how to reach the gateway before it holds anything.
  - name: llm-gateway.gateway.PublicRoute
    kind: enum
    attributes:
      - {name: path, type: String}
      - {name: content_type, type: String}
    variants:
      - {name: Models, attributes: {path: /v1/models, content_type: application/json}}
      - {name: Instructions, attributes: {path: /, content_type: chosen}}
  # The owner's two lifecycle routes, one pair per relayed model (story:model-wake-and-status;
  # architecture-decision-record:on-demand-gpu-lifecycle, decision 3), served only by a gateway
  # composed with a relay. `{alias}` is the rest of the path between `/v1/models/` and the
  # route's last segment, compared byte for byte with the relayed models' aliases: nothing is
  # percent-decoded, and an empty alias is no lifecycle path. They are not wire paths, so they
  # take the owner credential whatever the IngressAuth, after the head, the probes and shedding
  # (`Exchange` steps 1-5), and are then decided in this order, none of which asks the target
  # source anything: a method the route does not take is `method-not-allowed` with `allow`
  # naming its `methods`; a declared body is `body-not-allowed`; before `mark_ready` it is
  # `unavailable`; an alias no relayed model has is `model-unknown`; a model whose target source
  # starts no pod for it (a hosted endpoint, a route of the routes document: a plain relayed
  # upstream, `RelayTargets::wake` and `RelayTargets::status` answering `None`) is
  # `path-unknown`, because the route does not exist for that model. Then:
  #   Wake    `POST`: asks the target source to start the model's pod as a request's first ask
  #           for it would (`RelayTargets::wake`), and answers `202` at once with the ModelStatus
  #           the source reports after that ask; it never waits for the pod to serve. While a
  #           start is in progress, or the pod is ready, it starts nothing more and answers `202`
  #           the same way. A source that refuses answers what `acquire` would have
  #           (TargetRefusal): `target-unavailable`, `spend-ceiling` (503, without
  #           `retry-after`) or `model-cold-start`.
  #   Status  `GET`, and `HEAD` without a body: asks the target source for the model's
  #           ModelStatus (`RelayTargets::status`), which starts nothing, and answers `200`.
  # Both answers are `application/json`, `cache-control: no-store`, the ModelStatus as
  # `{"model":<alias>,"phase":<code>,"sub_phase"?:<sub-phase>,"profile"?:<profile>}` with its
  # keys in that order, a value the source did not report absent, never empty. Neither makes a
  # usage record (llm-gateway.telemetry) nor counts a series of its own; a pod a wake started is
  # counted by the embedding as any pod start (scenarios wake-*, status-*).
  # DECIDED 2026-10-17: the routes sit under the model's own `/v1/models/{alias}/` and are not
  # public routes: `/v1/models` alone is public (PublicRoute). A model with no lifecycle is
  # answered with the existing `path-unknown`, and no refusal code is added.
  # The binary's target source (llm-gateway.deployment): a Runpod model's wake is one
  # `RunpodPool::wake` (llm-gateway.runpod.Pool), so its spend check and its profile fallback
  # are a request's. A pod it starts counts in `llmgw_pod_starts_total`, a spend refusal in
  # `llmgw_pod_start_spend_refusals_total`, a failed start in `llmgw_pod_start_failures_total`,
  # as a request's would. Any pool refusal but `spend-ceiling` (`no-capacity` once every profile
  # was refused, `stopping` while a previous pod's stop is unconfirmed, a retired pod's reason)
  # is `target-unavailable`. Once the gateway starts to stop, a wake starts nothing: it answers
  # `202` with the status of a model starting or ready, and `target-unavailable` otherwise. Its
  # status is `RunpodPool::status`. A model of a provider whose `connectors` connection is
  # absent or unreachable is `target-unavailable` to a wake and `stopped` to a status.
  - name: llm-gateway.gateway.LifecycleRoute
    kind: enum
    attributes:
      - {name: path, type: String}
      - {name: methods, type: String}
      - {name: status, type: Integer}
    variants:
      - {name: Wake, attributes: {path: "/v1/models/{alias}/wake", methods: POST, status: 202}}
      - {name: Status, attributes: {path: "/v1/models/{alias}/status", methods: "GET, HEAD", status: 200}}
  # Where a model's pod is (`llm_gateway::ModelPhase`), named by what a request for the model
  # would meet: `stopped`, no pod is live and a request starts one; `starting`, a request is held
  # while the pod starts; `ready`, the pod was last observed serving and a request is relayed
  # to it; `stopping`, a previous pod owes a stop not yet confirmed and nothing starts meanwhile.
  # The binary reads it from the hosting state machine (llm-gateway.runpod.Pool `status`).
  - name: llm-gateway.gateway.ModelPhase
    kind: enum
    attributes:
      - {name: code, type: String}
    variants:
      - {name: Stopped, attributes: {code: stopped}}
      - {name: Starting, attributes: {code: starting}}
      - {name: Ready, attributes: {code: ready}}
      - {name: Stopping, attributes: {code: stopping}}
  # The answer `GET /` chooses, from the request's `user-agent` lowercased, by the first rule
  # that holds, in the order declared (llmgw src/lib.rs:231-245 at 048ebd8). No `user-agent` is
  # `Plain`. Each renders, per relayed model, the llm-gateway.clients.ClientProfile of its
  # `client` with the model's alias and `context_window` filled in, for exactly the models that
  # declare that profile's wire and tool calling `Parsed`; a model without a `context_window`
  # gets no context setting. The gateway origin in every base URL is `http://` and the
  # request's `host`, when it is non-empty and only ASCII letters, digits, `.`, `-`, `_`, `:`,
  # `[` and `]`, and the listener's bound address otherwise, so no other caller byte is
  # rendered. The credential setting is named, never given a value.
  #   Codex       one `config.toml` profile per model, `[model_providers.b10x-gateway]` with
  #               `base_url` the origin plus `/v1`, `env_key = "B10X_GATEWAY_TOKEN"`,
  #               `wire_api = "responses"`, `model` the alias and `model_context_window`.
  #   ClaudeCode  one block of `export NAME='value'` lines per model: `ANTHROPIC_BASE_URL` the
  #               origin, each model setting the alias, `CLAUDE_CODE_MAX_CONTEXT_TOKENS`.
  #   Html        the `Plain` text, HTML-escaped, inside one `<pre>` of a fixed page.
  #   Plain       where the other answers and the listing are found, then the Loom profile per
  #               model on the `chat` wire: the llm catalog (`llm.catalog/1`) lines of an
  #               account with
  #               `auth_kind = "bearer"`, an endpoint `base_url` the origin plus `/v1`, and a
  #               serving model with `protocol = "chat-completions"`, `upstream_name` the
  #               alias, `capabilities.tools = true` and `capabilities.context_window`.
  # DECIDED: docs/design/runpod-clients.md § 5 step 7 writes `protocol = "chat"`; llm's
  # catalog spells the chat wire `chat-completions` (beyond10x/llm
  # `crates/llm-core/src/vocabulary.rs:4-10`), and the instructions render what llm reads.
  - name: llm-gateway.gateway.InstructionAnswer
    kind: enum
    attributes:
      - {name: rule, type: String}
      - {name: client, type: String}
      - {name: content_type, type: String}
    variants:
      - {name: Codex, attributes: {rule: "contains codex", client: Codex, content_type: "text/plain; charset=utf-8"}}
      - {name: ClaudeCode, attributes: {rule: "contains claude or anthropic", client: ClaudeCode, content_type: "text/plain; charset=utf-8"}}
      - {name: Html, attributes: {rule: "starts with mozilla/", client: Loom, content_type: "text/html; charset=utf-8"}}
      - {name: Plain, attributes: {rule: "anything else", client: Loom, content_type: "text/plain; charset=utf-8"}}
  # Why a gateway cannot be composed, reported as `error_code` `<source>:<rule>`. Owner material
  # (auth.rs OwnerToken::new): `token:empty`, `token:too-large` (over 4096 bytes),
  # `token:not-printable-ascii`. The shared-secret verifier (auth.rs SharedSecretVerifier::new):
  # `verifier:secret-too-short` (under 32 bytes). Every identifier (inventory.rs Label::new):
  # `label:length` (empty or over 256 bytes), `label:not-printable-ascii`. A route
  # (inventory.rs RouteSummary::new): `inventory:route-without-target`,
  # `inventory:too-many-targets` (over 64), `inventory:non-contiguous-positions`,
  # `inventory:duplicate-target`. A snapshot (inventory.rs RouteInventory): `inventory:duplicate-alias`,
  # and `inventory:too-many-routes` for more than 4096 routes (inventory.rs:25, 252); exactly
  # 4096 is composed. A program reaches that count through its inventory's `generated_routes`,
  # which appends routes `g<i>` the program need not spell out. `inventory:malformed-digest` is
  # a `config_digest` that is not exactly 64 (`digest-characters`, an exact length, not a
  # maximum) lowercase hexadecimal characters; a snapshot whose source reported no digest has
  # none, never an empty one (scenario a-config-digest-that-is-not-lowercase-hex-is-refused,
  # `a_digest_is_either_a_real_digest_or_absent` in src/inventory.rs and
  # `every_published_bound_flips_at_exactly_the_published_number` in tests/gateway.rs).
  #
  # A relayed model (row K11; relay.rs RelayModel::new, Relay::new): `relay:no-wire` for an empty
  # wire set, `relay:repeated-wire` for a wire named twice, `relay:duplicate-model` for two models
  # with one alias.
  #
  # A target's bearer (row B8; relay.rs TargetBearer::new) follows the owner material's rules:
  # `bearer:empty`, `bearer:too-large` (over 4096 bytes), `bearer:not-printable-ascii`. A bearer
  # is checked when the embedding builds it, so no relayed request can carry a CR, LF or space
  # into the head it is written to.
  #
  # A target's credential header (relay.rs CredentialHeader::new; the `credential_header` of
  # llm-gateway.upstream.HostedEndpoint): `credential-header:length` for an empty name or one
  # over 64 bytes (`credential-header-bytes`), `credential-header:not-a-token` for a byte that is
  # no RFC 9110 token character, `credential-header:reserved` for a header the gateway writes
  # itself or that frames a message (llm-gateway.deployment.HostedDeclaration lists them). It is
  # checked when the embedding builds it, so it can neither end its line nor add a second
  # framing or `authorization` header to the head.
  #
  # A target's static header (relay.rs StaticHeader::new; the `headers` of
  # llm-gateway.upstream.HostedEndpoint): `static-header:name-length` for an empty name or one
  # over 64 bytes, `static-header:name-not-a-token` for a name byte that is no RFC 9110 token
  # character, `static-header:reserved` for a name `credential-header:reserved` refuses,
  # `static-header:value-length` for an empty value or one over 1024 bytes
  # (`static-header-value-bytes`), and `static-header:value-not-printable` for a value byte
  # outside 0x20-0x7e or a leading or trailing space. The binary's endpoint then refuses a set
  # of more than 32, two names equal without regard to case, or a name equal to the endpoint's
  # own credential header as `endpoint:headers`.
  - name: llm-gateway.gateway.CompositionRefusal
    kind: enum
    variants: [TokenEmpty, TokenTooLarge, TokenNotPrintableAscii, VerifierSecretTooShort, LabelLength, LabelNotPrintableAscii, InventoryRouteWithoutTarget, InventoryTooManyTargets, InventoryNonContiguousPositions, InventoryDuplicateTarget, InventoryDuplicateAlias, InventoryMalformedDigest, InventoryTooManyRoutes, RelayNoWire, RelayRepeatedWire, RelayDuplicateModel, BearerEmpty, BearerTooLarge, BearerNotPrintableAscii, CredentialHeaderLength, CredentialHeaderNotAToken, CredentialHeaderReserved, StaticHeaderNameLength, StaticHeaderNameNotAToken, StaticHeaderReserved, StaticHeaderValueLength, StaticHeaderValueNotPrintable]
entities:
  # One gateway: one owner verifier, one route inventory snapshot, one listener
  # (server.rs GatewayConfig, GatewayHandle).
  #
  # The lifecycle. `Gateway::bind` listens at once and starts not ready. `mark_ready` opens
  # the public routes, inspection, the counters and the relay. `begin_drain` reports unready while every request
  # that still arrives is served, and it cannot be undone: `mark_ready` does not clear it
  # (scenario a-drain-reports-unready-keeps-serving-and-cannot-be-undone,
  # `a_drain_cannot_be_undone_by_marking_ready_again` in tests/gateway.rs).
  # `GatewayHandle::shutdown` reports unready at once, stops accepting, finishes every accepted
  # connection and only then stops serving inspection, so no connection the report counts as
  # completed was refused because of the stop. Its report's `completed` equals its `accepted`
  # and counts every accepted connection, those refused on their own merits included (scenario
  # a-graceful-stop-completes-every-accepted-connection), and `in_flight_at_signal` is what was
  # still running when the stop was signalled (`graceful_shutdown_drains_readiness_then_stops_accepting`
  # in tests/gateway.rs, `a_connection_accepted_before_shutdown_is_finished_rather_than_refused`
  # in tests/adversary.rs).
  # ESS-LIMIT: a duration is no ESS construct (see the header). For inspection a stop takes at
  # most twice `read_timeout_ms`: one deadline covers the whole head and another the whole
  # answer (`a_stalled_head_is_refused_when_the_read_timeout_expires`,
  # `a_trickled_head_is_refused_when_the_read_timeout_expires` and
  # `a_peer_that_never_reads_its_answer_cannot_hold_the_stop` in tests/gateway.rs). A relay is
  # not bounded that way: its head and its body each have one deadline, each chunk written to
  # the client has its own, reading the target is bounded by the connection the target opened,
  # and a stop waits for a relayed stream to end
  # (`row_23_a_stop_waits_for_a_relayed_stream_to_end` and
  # `row_23_a_client_that_stops_reading_a_stream_cannot_hold_the_stop` in
  # tests/spec_declarations.rs).
  # ESS-LIMIT: dropping the handle without a shutdown still stops the listener, and reports
  # nothing; a handle's drop is no command
  # (`row_24_dropping_the_handle_without_a_shutdown_stops_the_listener`).
  - name: llm-gateway.gateway.Gateway
    identity: {name: id, type: String}
    fields:
      # `request-head-bytes`, a maximum: a longer head is `request-too-large`. An embedding may
      # set it; `GatewayConfig::new` defaults it to 8192.
      - {name: max_head_bytes, type: Integer}
      # `concurrent-requests`, a maximum: a request that is not a probe, arriving while that
      # many are in flight, is `overloaded`. An embedding may set it; `GatewayConfig::new`
      # defaults it to 64.
      - {name: max_concurrent_requests, type: Integer}
      # `GatewayConfig::read_timeout`, in milliseconds: one deadline for the whole request head,
      # never a timeout per read, and a second of the same length for the whole answer. An
      # embedding may set it; `GatewayConfig::new` defaults it to 10000 (ten seconds).
      # ESS-LIMIT: a deadline is no ESS construct; the three tests named above hold it.
      - {name: read_timeout_ms, type: Integer}
      # `GatewayConfig::count_timeout`, in milliseconds: the output clamp's count (Relay step 7)
      # has this long, from the moment its connection is open, to be written and answered; a
      # count not answered by then is a count that fails. An embedding may set it;
      # `GatewayConfig::new` defaults it to 10000 (ten seconds).
      # ESS-LIMIT: a deadline is no ESS construct;
      # `clamp_a_count_that_never_answers_relays_the_request_once_its_deadline_passes` holds it.
      - {name: count_timeout_ms, type: Integer}
      # `GatewayConfig::ingress_auth`: whether a model call takes the owner credential
      # (IngressAuth). An embedding may set it; `GatewayConfig::new` defaults it to `Bearer`.
      - {name: ingress_auth, type: llm-gateway.gateway.IngressAuth}
      # Ready is set once by the embedding; a drain is one way for the life of the handle
      # (server.rs mark_ready, begin_drain).
      - {name: ready, type: Boolean}
      - {name: draining, type: Boolean}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  # One entry of `GET /v1/models` (row R5), one per relayed model in alias order, rendered in
  # the OpenAI list shape `{"object":"list","data":[entry…]}` with an entry's keys in the order
  # below: `id` is the alias, `object` is `model`, `owned_by` is `llm-gateway`, `max_model_len`
  # is the longest sequence the model's server takes, absent when the embedding declared none
  # (never `0`), and `wires` names the wires a client may call the model on. For a relay without
  # a translator they are the model's declared wires in their declared order (`chat`,
  # `responses`, `messages`), and no other key exists. For a relay with a translator `wires` is
  # all three in that fixed order, and `upstream_wires`, after it, names the declared wires in
  # their declared order: the ones relayed byte for byte, every other one translated
  # (story:gateway-translation; scenario translate-the-listing-names-every-wire-and-the-upstream-wires).
  # DECIDED 2026-10-16: `upstream_wires` is left out without a translator, where it would repeat
  # `wires`, so a gateway composed as before lists exactly what it listed before. The client
  # profiles of `GET /` stay keyed on the declared wires (llm-gateway.clients.ClientProfile):
  # Codex and Claude Code send fields llm's translated subset refuses (docs/gateway.md
  # "Translation"), so a profile through translation would not work.
  - name: llm-gateway.gateway.ListedModel
    identity: {name: id, type: String}
    fields:
      - {name: object, type: String}
      - {name: owned_by, type: String}
      - {name: max_model_len, type: 'Optional<Integer>'}
      - {name: wires, type: 'List<llm-gateway.gateway.Wire>'}
      - {name: upstream_wires, type: 'Optional<List<llm-gateway.gateway.Wire>>'}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  # What a lifecycle route (LifecycleRoute) answers for one model (`llm_gateway::ModelStatus`):
  # its alias, its ModelPhase, the provider's own word for the pod while it starts when the
  # provider reports one (`sub_phase`; the binary's are llm-gateway.hosting `ProviderState`
  # codes: `pending`, the pod is not running yet, and `running`, it runs and its server does not
  # answer ready yet), and the profile the pod was started on
  # (llm-gateway.runpod.ModelProfile `name`), absent when unknown.
  - name: llm-gateway.gateway.ModelStatus
    identity: {name: model, type: String}
    fields:
      - {name: phase, type: llm-gateway.gateway.ModelPhase}
      - {name: sub_phase, type: 'Optional<String>'}
      - {name: profile, type: 'Optional<String>'}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  - name: llm-gateway.gateway.ExchangeObservation
    identity: {name: observation_id, type: String}
    fields: &exchange_facts
      - {name: valid_program, type: Boolean}
      # Why the gateway could not be composed: `token:<rule>`, `verifier:<rule>`,
      # `label:<rule>`, `inventory:<rule>`, or a document's `config:<rule>`.
      - {name: error_code, type: 'Optional<String>'}
      # One entry per step, in order. An exchange is `<status> <refusal code>` for a refusal,
      # `<status> <probe status>` for a probe, `<status> inspected` for a served inspection and
      # `<status> no-body` for an answer to `HEAD`.
      - {name: results, type: 'List<String>'}
      # The body of every exchange, in order, exactly as the gateway wrote it. A probe is
      # `{"status":"live"}`, `{"status":"ready"}` or `{"status":"unready"}`; an answer to `HEAD`
      # has no body. An inspection renders exactly the identifier bytes the composer supplied
      # and nothing else: `{"config_digest"?,"route_count","routes":[route…]}` for
      # `/v1/routes` and `{"route":route}` for `/v1/routes/{alias}`, a route being
      # `{"route_id","alias","fallback_enabled","target_count","targets":[target…]}` and a target
      # `{"target_id","position","protocol","provider","account","endpoint","model",
      # "binding_revision","auth_kind","billing_kind","context_window"?,"max_output_tokens"?}`.
      # There is no key for an endpoint URL, a secret reference name or credential material
      # (`an_inspection_response_carries_exactly_these_keys` in tests/gateway.rs,
      # `provenance_renders_exactly_the_bytes_the_composer_supplied` in src/inventory.rs). A
      # limit the snapshot's source did not report is absent, never `0` and never a substituted
      # value, and a snapshot with no `config_digest` renders no `config_digest` key (scenario
      # the-owner-inspects-every-route-and-unreported-limits-stay-absent,
      # `an_unreported_limit_stays_absent_and_never_becomes_zero` in tests/gateway.rs).
      - {name: bodies, type: 'List<String>'}
      # Per exchange, `www-authenticate=<value> allow=<value>`, `absent` for a header that was
      # not sent: every `401` carries `www-authenticate: Bearer`, and every `405` an `allow`
      # naming the methods the path takes.
      - {name: headers, type: 'List<String>'}
      # Per exchange, `content-type=<value> cache-control=<value> connection=<value>`, `absent`
      # for a header that was not sent. Every answer the gateway writes itself is
      # `application/json`, except the counters at `/metrics` and the text and HTML answers of
      # `GET /` (InstructionAnswer), and every answer is `cache-control: no-store` and
      # `connection: close`.
      - {name: answer_headers, type: 'List<String>'}
      # Whether any byte the gateway wrote contains the owner secret. Absent when no gateway
      # was composed.
      - {name: secret_on_wire, type: 'Optional<Boolean>'}
      # Whether any byte the gateway wrote contains any of the program's `withheld` strings.
      # Absent when no gateway was composed.
      - {name: withheld_on_wire, type: 'Optional<Boolean>'}
      # `GatewayHandle::is_ready` after the last step; absent once the gateway is stopped.
      - {name: ready, type: 'Optional<Boolean>'}
      # The graceful stop's report, as `accepted=<n> completed=<n>`.
      - {name: shutdown, type: 'Optional<String>'}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
  # One run of the relay (story:wire-relay), observed over loopback: the real gateway composed
  # with relayed models and a target source whose targets are loopback fixture pods. Nothing
  # leaves the machine.
  #
  # The relay, in the order the gateway decides (each step is the row it answers):
  #   1. The head, probes, shedding, the public routes and owner authentication come first,
  #      exactly as steps 1-5
  #      of the `Exchange` order below: an unauthenticated relay is refused before any byte of
  #      its body is read. DECIDED: llmgw serves its wires without authentication
  #      (`--insecure`, llmgw README.md:28); llm-gateway admits only its owner's bearer
  #      credential, unless the embedding sets `ingress_auth` to `None` (IngressAuth): then
  #      step 5 is skipped for a wire path, and no credential is read.
  #   2. A wire path takes `POST` only; another method is `method-not-allowed` with
  #      `allow: POST`. Before `mark_ready` a relay is `unavailable`, like inspection.
  #   3. W1: the body is framed by `content-length` or `transfer-encoding: chunked` and nothing
  #      else: both, a repeated or a list-valued framing header, or another coding is
  #      `request-malformed` before a target is asked for
  #      (`adv_w1_conflicting_or_unknown_framings_are_refused_before_a_target_is_asked` in
  #      tests/adversary_relay.rs, `the_body_framing_is_read_from_the_head_alone` in
  #      src/relay.rs). The body is bounded at 33554432 bytes (32 MiB; llmgw src/lib.rs:35). A
  #      `content-length` over the bound is `body-too-large` before a byte is read; a chunked
  #      body is decoded and refused the moment its decoded size passes the bound. Exactly
  #      33554432 bytes are relayed. A chunk size is `1*HEXDIG` with an optional extension after
  #      `;` (RFC 9112 section 7.1), else `request-malformed`, which also names a head holding a
  #      CR, LF or NUL inside a line (RFC 9110 section 5.5). A chunked body's trailer section
  #      counts against the head bound (`request-too-large`). The whole body is read under one
  #      `read_timeout_ms` deadline, not a timeout per read, and a body that ends or stalls
  #      before it is complete is `body-incomplete`
  #      (`row_14_a_body_trickled_past_one_read_timeout_is_body_incomplete`). An HTTP/1.1
  #      request carrying `expect: 100-continue` is sent an interim `100 Continue` before its
  #      body is read; an HTTP/1.0 one is not
  #      (`row_15_expect_100_continue_is_answered_for_http_1_1_only`).
  #   4. W3: the body must be one well-formed UTF-8 JSON object (`body-not-json`) with exactly
  #      one top-level `model` key whose value is a string (`model-absent`; a second top-level
  #      `model` is `body-not-json`, because the target could read the other one), naming a
  #      relayed model after JSON unescaping (`model-unknown`, 404).
  #   5. K11: the model must declare the path's wire, or the relay must have a translator; a
  #      relay without one refuses any other wire `wire-not-served` (scenario
  #      k11-a-wire-the-model-does-not-declare-is-refused-without-waking-a-target). Then a body
  #      whose top-level `tools` is a non-empty array, for a model whose tool calling is
  #      `Absent`, is `tools-not-served` (400), on a declared wire and a translated one alike;
  #      a `tools` that is absent, an empty array or not an array, and any `tools` below the
  #      top level, is relayed unchanged (llm-gateway.clients ToolCalling). A body naming
  #      `tools` twice at its top level is refused when either is a non-empty array. Steps 3-5
  #      hand out no target, so a refused request never wakes a pod.
  #      Translation (story:gateway-translation): a request on a wire the model does not
  #      declare, to a relay with a translator, leaves the byte relay here. The translator
  #      prepares it for the model's first declared wire before any target is asked for: it
  #      decodes the body with llm 0.18.0's ingress decoder for the client's wire (chat
  #      `decode_ingress_request`, responses `ingest_request` with the body's model the
  #      model's alias, messages `decode_request`), each of which refuses a key outside its
  #      subset at every level by its path, `translation-unsupported` (scenario
  #      translate-a-field-outside-the-subset-is-refused-without-asking-for-a-target,
  #      `translation_guard_*` in crates/llm-gateway-cli/tests/translation_guards.rs), and
  #      carries the fields coding-agent clients send as llm's "Client request fields" rule
  #      says (scenario translate-a-coding-agents-turn-reaches-another-wire-with-its-controls), binds
  #      carried reasoning state only when it is a seal the gateway made for this route and
  #      these wires since it last started, and refuses every other carried item
  #      `translation-opaque-state` (the decision on sealed reasoning state above; scenarios
  #      translate-sealed-reasoning-state-is-bound-on-the-route-that-sealed-it,
  #      translate-sealed-reasoning-state-from-another-route-is-refused,
  #      translate-altered-or-forged-sealed-reasoning-state-is-refused,
  #      translate-sealed-reasoning-state-from-before-a-restart-is-refused), a field or value outside the subset (llm `unsupported`,
  #      `too-large`) `translation-unsupported` and one breaking its rules (llm
  #      `invalid-request`, `protocol`) `translation-invalid`, checks the turn against the
  #      model's capabilities (tools and tool choice when its tool calling is `Parsed`,
  #      temperature and top_p, reasoning efforts `minimal` to `xhigh` (and `none` for a chat
  #      or responses upstream, checked as the upstream wire receives them), a context window and
  #      output limit of its `max_model_len`, else its `context_window`, else 200000) and
  #      projects it for the upstream wire, each refusal the same way (scenarios
  #      translate-a-field-outside-the-subset-is-refused-without-asking-for-a-target,
  #      translate-carried-reasoning-state-is-refused-without-asking-for-a-target). Then the
  #      target is acquired as at step 7, cold starts counted alike, and the turn is sent once
  #      to it with llm's client for the upstream wire: at `<scheme>://<authority>` and the
  #      target's base path (`/v1` without one) joined to the upstream wire's path, with the
  #      target's credential as its kind says and nothing else of the gateway's (no static
  #      header, no effort rewrite, no output clamp count; scenario
  #      translate-a-messages-upstream-gets-no-effort-rewrite-and-no-count). A request to a
  #      messages upstream that names no output limit carries `min(16384, w / 2)` of the
  #      window `w` it is translated under (the model's, else the capabilities', 200000 by
  #      default), and never more than the capabilities' output limit. Its answer is
  #      written to the client on the client's wire (step 9 below, translated): the head once,
  #      on the first event or at the outcome, `200` with `content-type: text/event-stream`
  #      for a streamed request (responses always; chat and messages with `stream` true) and
  #      `application/json` with a `content-length` for the rest, `cache-control: no-store`
  #      and `connection: close`. Each server-sent event is written as llm's encoder writes
  #      it: `event: <type>` and `data: <json>` for responses and messages, `data: <json>`
  #      for chat, which ends `data: [DONE]`. Identifiers (`chatcmpl-`, `resp_`, `msg_`) and
  #      `created` are the gateway's own. A failure before any output: an llm `transport`,
  #      `deadline` or `unavailable` failure (unreachable, a `408` or `5xx`, timed out, a
  #      connection reset or ended inside a frame), whatever was dispatched, is
  #      `upstream-failed`, reported to the target source by the target's authority as at step
  #      8; a failure an answer's status decided (`unauthorized`, `rate-limited`, `refused`,
  #      `invalid-request`, `unsupported`) or an answer that broke its wire (`protocol`: a
  #      stream ended cleanly before its terminal event, a body that is no event stream, a call
  #      to a tool the request did not offer) is `upstream-refused` (502) and the target is
  #      kept; an answer past a bound of the translated path (llm `too-large`: 65536 events,
  #      33554432 bytes, a 1048576-byte line, 1048576 bytes of one event's joined data, or
  #      65536 bytes of one tool call's arguments, docs/gateway.md "Bounds of the translated
  #      path") is `translation-too-large` (502). An outcome the encoder refuses
  #      before any output is `translation-unrepresentable` (502); after output, it, a bound and
  #      any upstream failure end the stream with the wire's terminal error (responses
  #      `response.failed`, messages an `error` event, chat a
  #      `data: {"error":{"code":"translation-unrepresentable"|"translation-too-large"|"upstream-failed",…}}`
  #      chunk and no `[DONE]`), the target kept (scenario
  #      translate-an-answer-the-encoder-refuses-ends-in-a-terminal-error-event). A write to the
  #      client that fails cancels the turn, which drops the upstream connection; so does a
  #      client found, between two events of a non-streamed answer, to have closed its
  #      connection or its sending side (`TranslatedAnswer::gone`); nothing is retried (scenario
  #      translate-a-client-that-disconnects-cancels-the-upstream-turn). The target is released
  #      after the last byte, as at step 9.
  #      Bedrock (DECIDED 2026-10-23, story:bedrock-hosted-target): a `kind = "bedrock"`
  #      hosted model (llm-gateway.upstream.HostedEndpoint) is served as a model whose upstream
  #      wire is `messages` and which is translated only, so a request on every wire, the
  #      messages wire included, leaves the byte relay here; a relay without a translator
  #      refuses it `wire-not-served`. The translator prepares it as above with three
  #      differences. A field Bedrock does not take is dropped rather than refused, and its
  #      name alone logged (a reasoning effort, on every Bedrock model; parallel tool calls on
  #      `Converse`; thinking on a model id that is not Anthropic's). Carried reasoning state
  #      a client sends back on the messages wire to an `AnthropicInvoke` model is passed to
  #      Bedrock as that model's own; any other is bound or refused as above. A messages
  #      client's `anthropic-beta` header to an `AnthropicInvoke` model whose `anthropic_beta`
  #      list is not empty is read by llm's decoder (a malformed one is `translation-invalid`)
  #      and the names on the list reach the Invoke body's `anthropic_beta` in the client's
  #      order, each other name dropped and logged by name (story:bedrock-llm-0-13); to any
  #      other Bedrock model the header is dropped unread and logged once. The turn is checked
  #      with llm's `check_request` for the target before anything is sent. And the turn is
  #      sent with llm's Bedrock client, signed with the container credentials, to
  #      `https://bedrock-runtime.<region>.amazonaws.com` or the model's `endpoint`, rather than
  #      to a target from the target source: no pod is woken and nothing is held. Failures map
  #      as above, the authority reported being `bedrock`. Proved by the tests in
  #      crates/llm-gateway-cli/tests/bedrock.rs against a fixture Bedrock Runtime and a
  #      fixture container credentials endpoint; no scenario reaches Bedrock, because the
  #      container credentials are process environment (llm-gateway.deployment ESS-LIMIT).
  #   6. W2:the top-level `model` value is rewritten to the model's upstream name on every wire,
  #      written as a JSON string (a `"` or `\` in the name is escaped).
  #      W4: on the messages wire only, `output_config.effort` and
  #      `chat_template_kwargs.reasoning_effort` equal to `high` or `max` become `xhigh`; any
  #      other value (`low`, `medium` and `xhigh` among them), and these fields on the chat and
  #      responses wires, pass unchanged (llmgw src/lib.rs:470-504 for `high`). DECIDED
  #      2026-10-15 (story:claude-code-wire): `max` too. Claude Code sends
  #      `low|medium|high|xhigh|max` (https://code.claude.com/docs/en/llm-gateway-protocol,
  #      "Feature pass-through"), vLLM v0.27.1 admits all five and hands the value to the chat
  #      template as `reasoning_effort` (vllm/entrypoints/anthropic/protocol.py line 114,
  #      serving.py lines 513-514), and the served Qwen3.8 template accepts only `xhigh`,
  #      `medium` and `low` and raises on any other (Qwen/Qwen3.8-27B-FP8 `chat_template.jinja`
  #      lines 46-49), which fails the turn. `xhigh` is the template's deepest effort, the
  #      nearest to both (scenario w4-on-the-messages-wire-effort-max-reaches-the-target-as-xhigh).
  #      The structured-output request `output_config.format` is relayed unchanged, beside the
  #      effort and on every wire: vLLM v0.27.1 serves `{"type":"json_schema","schema":…}` as
  #      structured output (serving.py lines 505-512) and ignores the deprecated top-level
  #      `output_format`, which is relayed unchanged too (scenario
  #      claude-code-structured-output-format-reaches-the-target-unchanged). Every other byte of
  #      the body reaches the target unchanged, `thinking` included
  #      (llm-gateway.clients.ThinkingHandling `Relayed`).
  #      Declared effort: on the messages wire only, a body that names no effort (no member
  #      `effort` in a top-level `output_config` object and no member `reasoning_effort` in a
  #      top-level `chat_template_kwargs` object, whatever such a member's value), sent to a
  #      model that declares a reasoning effort (`RelayModel::with_reasoning_effort`: `low`,
  #      `medium` or `xhigh`), reaches the target with `output_config.effort` equal to it: a
  #      top-level `output_config` object gains `"effort":"<v>"` as its last member (the last
  #      such object, when the key is named twice), and a body without one gains
  #      `"output_config":{"effort":"<v>"}` as its last top-level member. A body whose top-level
  #      `output_config` is not an object gains nothing. A body that names an effort keeps the
  #      W4 mapping above and never the declared value; a model that declares none, and the
  #      chat and responses wires, are relayed as before. The binary declares a hosted model's
  #      `reasoning_effort` (llm-gateway.deployment.HostedDeclaration) and never a Runpod
  #      model's, whose effort is already its server's default chat-template argument.
  #      DECIDED 2026-10-15 (story:effort-default): Claude Code 2.1.300 sent no effort to a
  #      hand-started vLLM v0.27.1, whose Qwen3.8 template then defaults to `xhigh`
  #      (`chat_template.jinja` lines 46-49), and the first turn thought for its whole
  #      `max_tokens`; vLLM hands `output_config.effort` to the template as `reasoning_effort`
  #      (vllm/entrypoints/anthropic/serving.py lines 513-514), so the request is where a
  #      server the gateway did not start is told the operator's effort (scenarios
  #      hosted-a-declared-effort-reaches-the-endpoint-when-the-request-names-none,
  #      hosted-a-declared-effort-never-replaces-a-named-one-or-reaches-another-wire).
  #      DECIDED: llmgw re-serialises the parsed document (sorted keys, compact); llm-gateway
  #      rewrites only those string values in place, and inserts only that member.
  #   7. The embedding's target source hands out the target serving the model, or says why it
  #      hands out none: none can be had is `target-unavailable` (503); W6: the model's target
  #      is still starting and the request's hold budget has passed is `model-cold-start` (503)
  #      with `retry-after: 30`, so the client asks again later rather than treating the model
  #      as down; starting its pod would pass a spend ceiling of its provider account, or that
  #      account's spend is unknown, is `spend-ceiling` (503, story:spend-caps,
  #      `TargetRefusal::SpendCeiling`), without `retry-after`. How long a request is held for its target, and what a stop does to a held
  #      request, are the embedding's (llm-gateway.deployment, rows L6 and K28); the gateway
  #      holds nothing itself. The request goes to the same path at the target, with `host` set
  #      to the target's authority and a `content-length` (`r6_*`, `r7_*` and `r8_*` in
  #      tests/wire_relay.rs). A target with a base path (`RelayTarget::base_path`, a hosted
  #      endpoint whose `base_url` names one) is asked on that path joined to the wire path,
  #      the base path replacing the wire path's leading `/v1`, the count of the output clamp
  #      below included (llm-gateway.upstream.HostedEndpoint `base_url`; scenario
  #      hosted-a-base-url-path-replaces-the-v1-prefix-of-every-wire-path); `host` is still the
  #      authority alone. A target with static headers (`RelayTarget::headers`, a hosted
  #      endpoint's `headers`) is sent each as `<name>: <value>` after `host`, in name order,
  #      before the credential and the framing headers, on the relayed request and on the
  #      count alike (scenario hosted-static-headers-reach-the-endpoint-and-the-clients-never-do).
  #      A `StaticHeader` is checked when the embedding builds it, so it can neither end its
  #      line, nor replace or repeat a header the gateway writes, nor carry `authorization`.
  #      B8: a target that carries a bearer (the model's vLLM key, which the embedding reads)
  #      is sent `authorization: Bearer <key>`; a target without one is sent no
  #      `authorization`. A target that also names a credential header (an `api-key` hosted
  #      endpoint, llm-gateway.upstream.HostedEndpoint) is sent `<header>: <key>` instead, and
  #      no `authorization`. The head the target receives is built by the gateway alone: no
  #      header of the client's request is forwarded, so the owner's credential never reaches
  #      a target, in the head or anywhere else. Claude Code's `anthropic-version` and
  #      `anthropic-beta` are dropped with the rest: vLLM v0.27.1's messages endpoint reads
  #      neither (vllm/entrypoints/anthropic/api_router.py and serving.py read no request
  #      header), so the forward-verbatim rule of Claude Code's gateway protocol page, written
  #      for an Anthropic upstream, has nothing to serve here (scenario
  #      claude-code-anthropic-headers-never-reach-the-target).
  #      The output clamp, on the messages wire only, after the target is handed out and before
  #      the request is relayed to it. The window `w` is the `max_model_len` the target handed
  #      out states (`RelayTarget::max_model_len`), else the model's declared `max_model_len`
  #      (`RelayModel::with_max_model_len`), else its declared `context_window`, else it has
  #      none: the binary declares a Runpod model's `max_model_len`, what `vllm serve` is started
  #      with, and a hosted model's `context_window` and never its `max_model_len`, so a hosted
  #      model declaring no `context_window` has no window.
  #      DECIDED 2026-10-17 (story:model-profile-fallback): a pod of a profiled model states the
  #      `max_model_len` of the profile it was started on, so a call served by a fallback
  #      profile with a shorter window is clamped to that window, not the first profile's; the
  #      binary declares the model's `max_model_len` as the smallest among its profiles, which
  #      is what `GET /v1/models` lists and what a pod whose profile is unknown is clamped to
  #      (scenario clamp-the-window-the-serving-target-states-wins-over-the-models). For a model with a window and a body
  #      whose top-level `max_tokens` is one non-negative JSON integer (digits only, named once
  #      at the top level), the gateway first sends `POST /v1/messages/count_tokens` to the same
  #      target over a connection of its own, with the head and credential of the relayed
  #      request and the body step 6 wrote. A count answered 2xx whose body is one JSON object
  #      with one top-level non-negative integer `input_tokens` = `n` decides: `w - n < 1` is
  #      `context-exceeded` (400) and nothing is relayed; a `max_tokens` above `w - n` is
  #      rewritten in place to `w - n`, and one at or below it is unchanged. The count has its
  #      own deadline, `count_timeout_ms` of the Gateway (ten seconds unless the embedding sets
  #      it), from the moment its connection is open: the target's own read timeout, which may
  #      be far longer, never holds the request. A count that fails (no connection, a request
  #      that cannot be written, an answer head that never arrives or is malformed, a status
  #      outside 2xx, an answer body longer than the head bound, a body without such an
  #      `input_tokens`, or an answer not complete by the deadline) relays the request
  #      unchanged, reports nothing to the target source and counts no series. A count past its
  #      deadline is abandoned, not waited for: its connection closes when the target answers
  #      or the target's own timeout ends it. A body without such a `max_tokens`, a model
  #      without a window, and the chat and responses wires are relayed without a count. The
  #      count runs only on a target `acquire` handed out, so it never wakes a pod the relay
  #      would not have woken.
  #      DECIDED 2026-10-15 (story:max-tokens-clamp): a consumer's Claude Code 2.1.300 against
  #      vLLM v0.27.1 `--max-model-len 65536` spent its whole 32000 `max_tokens` on a first
  #      turn, and the continuation's input plus `max_tokens` passed the window, which vLLM
  #      answered 500. vLLM v0.27.1 serves `POST /v1/messages/count_tokens` and answers
  #      `{"input_tokens":n,"context_management":{"original_input_tokens":n}}` for a messages
  #      body (vllm/entrypoints/anthropic/api_router.py lines 95-133, serving.py lines
  #      1020-1025); only the top-level `input_tokens` is read. The refusal's message starts `prompt is too long`: Claude Code 2.1.301
  #      lowercases an API error's message and tests it for `prompt is too long`, which it
  #      classes `prompt_too_long` and answers by compacting (its bundled client, read
  #      2026-10-15) (scenarios clamp-*).
  #   8. W7: a target that cannot be connected to, a request that cannot be written to it, an
  #      answer head that never arrives or is malformed, and an answer of 502, 503 or 504 are
  #      each reported failed to the target source by the authority of the endpoint that served
  #      it (so the source drops it only if it is still current), and the client gets
  #      `upstream-failed` (502) (`w7_*` in tests/wire_relay.rs,
  #      `row_17_an_unwritable_request_or_a_malformed_answer_head_is_upstream_failed`). The next
  #      request asks the source again and so reaches a replacement. Any other status, 500 and
  #      4xx included, is relayed and the target is kept.
  #   9. W5: the target's status, its `content-type` and its decoded body bytes reach the client
  #      unchanged and as they arrive, event streams included, as `transfer-encoding: chunked`
  #      with `cache-control: no-store` and `connection: close`, and no other header of the
  #      target's (`adv_w5_target_headers_other_than_content_type_never_reach_the_client`). An
  #      answer cut short on either side ends without its last chunk, so the client sees it cut
  #      (`adv_w5_a_stream_cut_mid_event_reaches_the_client_cut_and_keeps_the_endpoint`). The
  #      target is held until the last byte is relayed (row L12), then released. An HTTP/1.0
  #      client is not sent a chunked answer (RFC 9112 section 6.1): it gets the bytes unframed,
  #      ended by closing the connection. Every head the target sends, interim 1xx heads
  #      included, and its trailer section share one head-sized budget.
  #  10. O1, O2: every request to a wire path that passed step 1 makes one
  #      llm-gateway.telemetry.UsageRecord once its answer or refusal is written, before the
  #      connection is closed. The record feeds the counters llm-gateway.telemetry lists and
  #      leaves the gateway through the embedding's `UsageRecords`. A translated answer's
  #      record carries the status of the answer the gateway wrote as its `target_status` (llm's
  #      client reads only a 2xx answer), and its `response_bytes` are the translated bytes; a
  #      translated call refused after its target answered carries the status the target
  #      answered with. A model's route series are those of the wires it declares, translator
  #      or not: a translated request on another wire feeds the process-wide series only.
  # A refused relay is closed gracefully: the refusal is written, the write side closed, and
  # what the client still sends is read and discarded, up to 33554432 bytes and within one
  # `read_timeout_ms`, so a reset cannot destroy the refusal before the client reads it
  # (`row_19_a_client_still_sending_a_refused_body_reads_its_refusal`).
  # R4: `GET /metrics` (and `HEAD`) serves those counters as Prometheus text
  # (`content-type: text/plain; version=0.0.4; charset=utf-8`), one `# HELP`, `# TYPE` pair and
  # its samples per series, in llm-gateway.telemetry's order. It takes the owner credential and
  # readiness like inspection: unauthenticated it is `credential-absent`, before `mark_ready` it
  # is `unavailable`, and another method is `method-not-allowed` with `allow: GET, HEAD`. A
  # gateway composed without a relay serves the process-wide series and no per-route one.
  - name: llm-gateway.gateway.RelayObservation
    identity: {name: observation_id, type: String}
    fields: &relay_facts
      - {name: valid_program, type: Boolean}
      # Why the gateway could not be composed: `token:<rule>`, `verifier:<rule>`,
      # `label:<rule>`, `relay:<rule>`, `bearer:<rule>`, `credential-header:<rule>`,
      # `static-header:<rule>`, `endpoint:base-url` for an endpoint the binary refuses, or
      # `endpoint:headers` for a static header set it refuses, or a routes
      # document's `config:<rule>` (`routes_document`).
      - {name: error_code, type: 'Optional<String>'}
      # One entry per step, in order: `ok` for `mark_ready`, and for a request
      # `<status> <refusal code>` for a refusal, `<status> relayed` for a relayed answer,
      # `<status> translated` for a 2xx answer a pod replied to that reached the client in
      # other bytes, and `<status> answered` for an answer to a public route or a lifecycle
      # route (LifecycleRoute), and for a scrape
      # `<status> scraped` when served or `<status> <refusal code>`. A request whose client
      # closed early (`close_after_bytes`) is `<status> closed`.
      - {name: results, type: 'List<String>'}
      # The body each request received, decoded from its HTTP framing, in order. Each reasoning
      # seal in it (`llmgw-seal-1.` and the base64url and `.` characters after it), which
      # differs on every run because its key does, is written `<sealed>`.
      - {name: bodies, type: 'List<String>'}
      # Per request, `content-type=<value> cache-control=<value> allow=<value>`, `absent` for a
      # header that was not sent.
      - {name: headers, type: 'List<String>'}
      # Per request, the value of the `retry-after` header the client received, or `absent`
      # when none was sent (row W6).
      - {name: retry_after, type: 'List<String>'}
      # Per request, `streamed` when every chunk a pod released reached the client before the
      # pod released the next, `held` when one did not, `none` when no pod answered it.
      - {name: arrivals, type: 'List<String>'}
      # Every request a fixture pod received, in order, as `<pod> <method> <path> <body>`; the
      # pods are `pod-1`, `pod-2`, … in the order the target source hands them out. A body over
      # 4096 bytes is written `<n> bytes`.
      - {name: upstream, type: 'List<String>'}
      # How many times the gateway asked the target source for a target.
      - {name: acquired, type: Integer}
      # Every pod the gateway reported failed, in order.
      - {name: invalidated, type: 'List<String>'}
      # How many targets the gateway had released when the run ended.
      - {name: released, type: Integer}
      # Per request a fixture pod received, in the order of `upstream`, the value of its
      # `authorization` header as received, or `absent` when it carried none.
      - {name: authorizations, type: 'List<String>'}
      # Whether any byte any fixture pod received contains the owner secret. A TLS pod's bytes
      # are searched as it decrypted them.
      - {name: secret_upstream, type: Boolean}
      # Every connection a fixture pod accepted, in order, as `<pod> <transport> <read>`: the
      # transport is `plain`, `tls` for a completed TLS handshake or `tls-refused` for one the
      # client abandoned, and `<read>` is `request` when the pod read any request byte
      # (decrypted, for TLS) and `nothing` when it read none. A connection past the pod's
      # script, or answered `{transport: refused}`, is closed unread and not recorded.
      - {name: connections, type: 'List<String>'}
      # Per request a fixture pod received, in the order of `upstream`, every header line of
      # its head but `host` (whose port is the fixture's), as received and in order, each
      # `<name>: <value>`, joined by ` | `.
      - {name: received_heads, type: 'List<String>'}
      # One entry per llm-gateway.telemetry.UsageRecord the gateway handed out, in order, as
      # `model=<alias|absent> wire=<wire> disposition=<Relayed|Refused|UpstreamFailed>
      # refusal=<code|absent> status=<n> target_status=<n|absent>
      # response_bytes=<n> duration_ms=<check>
      # tokens=<check>`. `duration_ms` is `bounded` when the record's value is at most the
      # time the client took from sending the request to reading its last byte, and the value
      # otherwise; `tokens` is `absent` when all five token counters are absent, and
      # `reported` otherwise.
      - {name: records, type: 'List<String>'}
      # Per `scrape` step, in order: `<n> <status> content-type=<value>`, then for a served
      # scrape every sample line of its body as `<n> <line>`, where `<n>` counts scrapes from 1.
      # `llmgw_cold_start_wait_seconds_total` is measured, so its value is written `bounded`
      # when it is at most the time the run has taken, and as served otherwise. So is every
      # model's `llmgw_request_duration_seconds` (llm-gateway.telemetry): a `_bucket` sample of
      # a finite `le` is written `cumulative` when its value is at least the bucket before it
      # and at most the `+Inf` bucket's, and as served otherwise; `_sum` is written `bounded`
      # when it is at most `_count` times the time the run has taken; the `+Inf` bucket and
      # `_count` are written as served.
      - {name: scrapes, type: 'List<String>'}
      # Per reply a fixture pod began to write, in order, `<pod> complete` when it wrote every
      # chunk of its answer, or `<pod> cut` when its connection closed before it had: a write
      # failed, or the gateway closed the connection while the pod waited to release a chunk.
      - {name: upstream_ends, type: 'List<String>'}
      # Every lifecycle ask the gateway made of its target source, in order, as `wake <alias>`
      # or `status <alias>` (LifecycleRoute): a request refused before the source is asked
      # adds none.
      - {name: lifecycle_asks, type: 'List<String>'}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
commands:
  # A request outside the relay, in the order the gateway decides (docs/gateway.md, "The HTTP
  # surface"; server.rs serve, dispatch, decide):
  #   1. The head, and nothing beyond it, is read under the `max_head_bytes` bound
  #      (`request-too-large`) and one `read_timeout_ms` deadline (`request-malformed` when it
  #      never completes). A head that is not HTTP/1.x, a head that is not UTF-8 (obs-text
  #      included), a header whose name is followed by whitespace before its colon (RFC 9112
  #      section 5.1), and a CR, LF or NUL inside a line (RFC 9110 section 5.5) are
  #      `request-malformed` (scenarios a-request-head-that-is-not-http-is-malformed,
  #      gateway-a-header-name-followed-by-whitespace-is-malformed; the UTF-8 rule by
  #      crates/llm-gateway/tests/adversary_public_listing.rs
  #      adversary_r1_a_user_agent_that_is_not_utf8_is_request_malformed). A query string is
  #      discarded: no request parameter is decoded, and the path alone decides (scenarios
  #      inspection-a-query-string-is-discarded, head-inspection-answers-without-a-body).
  #   2. The probes, matched before anything else, without a credential and whatever the load:
  #      exactly `GET` or `HEAD` on exactly `/health` is `200 {"status":"live"}` for as long as
  #      the process serves; on exactly `/ready` it is `200 {"status":"ready"}`, or
  #      `503 {"status":"unready"}` before `mark_ready` and while draining. Any other method on
  #      those paths, and any other path, goes on to step 3 (scenarios
  #      liveness-is-served-without-a-credential-and-readiness-starts-unready,
  #      a-ready-gateway-reports-ready, the-probe-surface-is-two-literal-paths-and-two-methods).
  #   3. Shedding, before authentication, because shedding has to be cheaper than the work it
  #      sheds: past `max_concurrent_requests` a request is `overloaded` (scenarios
  #      an-overloaded-gateway-sheds-inspection-but-still-answers-probes,
  #      the-concurrency-bound-admits-its-own-count).
  #   4. The public routes (PublicRoute, rows R5 and R1), without a credential: exactly `GET`
  #      or `HEAD` on exactly `/v1/models` or `/`. A declared body is `body-not-allowed` and
  #      before `mark_ready` they are `unavailable`, as inspection. Then `/v1/models` answers
  #      `200` with the ListedModel list and `/` answers `200` with the InstructionAnswer its
  #      `user-agent` chooses; each served `/` counts one `llmgw_instruction_views_total`
  #      (llm-gateway.telemetry). Neither asks the target source for anything. Any other method
  #      goes on to step 5, so without a credential it is `credential-absent`, and with the
  #      owner's it is `method-not-allowed` with `allow: GET, HEAD` at step 8 (scenarios
  #      `r1-*` and `r5-*`).
  #   5. Owner authentication, before any further decoding (a wire path of a gateway whose
  #      `ingress_auth` is `None` skips this step, IngressAuth): no `authorization` is
  #      `credential-absent`, one that is not a single bearer token is `credential-malformed`
  #      (the scheme is matched without regard to case), and a token that is not the owner's
  #      is `credential-rejected`. So an unauthenticated request to an unknown path, with any
  #      method, is `credential-absent`, and the surface cannot be enumerated without the
  #      credential (scenarios authentication-comes-before-the-path-is-decided,
  #      inspection-an-unauthenticated-write-to-an-unknown-path-is-credential-absent).
  #      DECIDED 2026-10-15 (story:claude-code-wire, design choice D2 = A): Claude Code's
  #      connection-warming `HEAD /api/hello` gets no route of its own. Without the owner
  #      credential it is `credential-absent`, with it `path-unknown` at step 8, each without
  #      a body; Claude Code's gateway protocol page calls it startup traffic "a gateway can
  #      reject without breaking anything" (https://code.claude.com/docs/en/llm-gateway-protocol,
  #      read 2026-10-15) (scenario claude-code-the-startup-probe-head-api-hello-is-refused).
  #   6. A wire path of a gateway composed with a relay goes on to the `Relay` order below, and a
  #      lifecycle path of one (`/v1/models/{alias}/wake` and `/v1/models/{alias}/status`) is
  #      answered as LifecycleRoute says. Without a relay a lifecycle path is a path the gateway
  #      does not serve (step 8).
  #   7. `/metrics`, R4 (see RelayObservation).
  #   8. Inspection: anything but `GET` or `HEAD` is `method-not-allowed` with
  #      `allow: GET, HEAD`, the two public routes included; a declared body is
  #      `body-not-allowed`; before `mark_ready` it is
  #      `unavailable`; then `/v1/routes` serves every route, `/v1/routes/{alias}` the route
  #      with that alias or `route-unknown`, and any other path is `path-unknown`. A gateway
  #      composed without a relay therefore answers the three wire paths as it answers any
  #      path it does not serve (scenario
  #      inspection-without-a-relay-the-wire-paths-are-paths-the-gateway-does-not-serve).
  # The gateway serves one request per connection: it answers the first request on a connection
  # and closes it, and a request pipelined behind it is never answered (scenario
  # inspection-every-answer-is-json-no-store-and-closes-after-one-request).
  - name: llm-gateway.gateway.Exchange
    input:
      # A bounded fixture program: the owner secret, the listener bounds, an optional route
      # inventory, and the raw requests sent to the loopback socket. Instead of an inventory it
      # may name a `document`, the text of a deployment document (llm-gateway.deployment), whose
      # route inventory the binary builds from it (`llm_gateway_cli::parse` and `inventory`;
      # no file it names is read). A document the binary refuses composes nothing, its
      # `error_code` the refusal's `<source>:<rule>`. `withheld` names strings no byte the
      # gateway writes may contain (`withheld_on_wire`).
      - {name: program_json, type: String}
    outcomes:
      - name: observed
        emits: [llm-gateway.gateway.Exchanged]
        payload:
          llm-gateway.gateway.Exchanged:
            valid_program: {generated: true}
        summary: Observe the real gateway's answers to raw requests over a loopback socket.
  - name: llm-gateway.gateway.Relay
    input:
      # A bounded fixture program:
      #   secret  the owner secret; with `ingress_auth` `none` it may be empty, and the gateway
      #           is then composed with `NoOwnerVerifier`, which accepts no credential
      #   ingress_auth  optional, `bearer` (the default) or `none`, the Gateway's
      #           `ingress_auth`; any other value makes the program invalid
      #   translation  optional, `off` (the default: the relay has no translator, as before) or
      #           `on`: the relay is composed with the binary's translator
      #           (`llm_gateway_cli::LlmTranslator`), whose clock reads a fixed `created` of
      #           1800000000 and whose identifiers count from 1 in each run, so a translated
      #           answer's bytes are exact; any other value makes the program invalid. A
      #           translated request reaches its pod over plain HTTP from llm's client, so a
      #           pod it reaches serves `http`
      #   models  `[{alias, upstream_model, wires, bearer, tool_calling, max_model_len,
      #           context_window, reasoning_effort}]`, the relayed models;
      #           `wires` names `chat`, `responses`, `messages`; the optional `bearer` is the key
      #           every target the source hands out for that model carries (row B8); the
      #           optional `tool_calling` is `parsed` or `absent`, default `absent`, as the
      #           deployment document's; the optional `max_model_len` and `context_window` are
      #           what the public routes render (rows R5, R1), absent unless given, and the
      #           first of them given is the model's window for the output clamp (step 7); the
      #           optional `target_max_model_len` is the `max_model_len` every target the
      #           source hands out for that model states (`RelayTarget::max_model_len`), none
      #           unless given, which the output clamp takes before the model's own window; the
      #           optional `reasoning_effort` is `low`, `medium` or `xhigh`, the effort the model
      #           declares (step 6), none unless given, and any other value makes the program
      #           invalid;
      #           the optional `endpoint` serves the model by a hosted endpoint
      #           (llm-gateway.upstream.HostedEndpoint) instead of the source's current pod:
      #           `{pod, scheme, base_path, certificate, auth_kind, credential,
      #           credential_header, headers}`, where `headers` is an object of static header
      #           names to values (none unless given), and
      #           `pod` names the fixture pod at the endpoint's authority (`pod-1`, …),
      #           `base_path` is appended to `<scheme>://<authority>` to make the endpoint's
      #           `base_url` (none unless given),
      #           `scheme` is `http` or `https` (that pod then serves TLS), `certificate` is
      #           `trusted` (the default: a certificate for the pod's address from the run's
      #           test root, the only root the client trusts) or `untrusted` (one from a root it
      #           does not), and `auth_kind`, `credential` and `credential_header` are the
      #           endpoint's (the credential's material, not a file). Such a model is served by
      #           the binary's own hosted target source, `llm_gateway_cli::HostedTargets`, over
      #           the binary's TLS client with the test seam's root, and takes no `bearer`
      #   routes_document  optional, the text of an `llm.routes/1` document
      #           (llm-gateway.deployment.RoutesDeclaration) whose routes are served beside
      #           `models`, as the binary serves them (`llm_gateway_cli::Routes`): each route a
      #           model on its endpoint's wire, served by `HostedTargets` from the hosted
      #           endpoint derived from its endpoint, and translated under its capabilities when
      #           `translation` is `on`. Every `//pod-<n>` in the text is replaced by `//` and
      #           that fixture pod's authority before it is parsed, so a `base_url` reads
      #           `http://pod-1/v1`. No file the document names is read: each credentialed
      #           endpoint's credential is the material `route_credentials` gives under the
      #           endpoint's name. A document the binary refuses, an endpoint without its
      #           credential, or a route name equal to a model's alias composes nothing, its
      #           `error_code` the refusal's `<source>:<rule>` (`config:value`)
      #   route_credentials  optional, an object of endpoint names to credential material
      #   pods    one script per fixture pod, `pod-1` first. The target source hands out the
      #           current pod; once the gateway reports it failed, the next pod is current. A
      #           pod answers its connections with its script in order, and refuses a
      #           connection past its script. An answer is
      #           `{status, content_type, chunks, framing, release}` (`framing` is `length`, the
      #           default, or `chunked`; with `release` `received`, the default, each chunk is
      #           released only after the client received the bytes of the ones before it, or
      #           after two seconds; with `release` `progress`, for an answer the gateway
      #           translates into other bytes, each chunk is released once the client has
      #           received more body bytes than when the one before was released, or after two
      #           seconds, and at once when the client has closed early), or
      #           `{transport: refused}` (the connection is refused) or `{transport: closed}`
      #           (the request is read and the connection closed without an answer)
      #   cold_starts  optional, default 0: the target source answers its first `cold_starts`
      #           acquisitions with the model still starting past the request's hold budget
      #           (row W6), and hands out the current pod after that
      #   lifecycle  optional: the target source's answers to the lifecycle routes
      #           (LifecycleRoute) for the models served by its pods, `{wake, status}`, each a
      #           list of answers taken in order, one per ask. An answer is
      #           `{phase, sub_phase, profile}` (a ModelStatus; `phase` one of ModelPhase's
      #           codes, the other two optional) or, for `wake` only, `{refusal}` naming
      #           `target-unavailable`, `model-cold-start` or `spend-ceiling`. An ask past its
      #           list is answered `target-unavailable` (wake) or `stopped` (status). Without
      #           `lifecycle` the source starts no pod for any model, and a model served by a
      #           hosted endpoint never has one, both as `None`
      #   metrics_listen  optional, `{bearer}`: the gateway also serves the metrics-only
      #           listener (llm-gateway.telemetry, the deployment's `metrics_listen`) on a
      #           loopback port, as `GatewayHandle::serve_metrics`, taking `bearer` as its scrape
      #           token when given and open without it; one it cannot bind composes nothing,
      #           `error_code` `bind:metrics-listen`
      #   steps  in order: `{step: mark_ready}`, `{step: scrape}` (a `GET /metrics`, with
      #           optional `credential`, default true: the owner's bearer token; `authorization`,
      #           sent as that header's value in place of it; `method` and `path` in place of
      #           `GET` and `/metrics`; and `listener`, default false: sent to the metrics-only
      #           listener, which a program without `metrics_listen` makes invalid; a CR or LF
      #           in any of them, or a space in `method` or `path`, makes the program invalid),
      #           or `{step: request, path, body}` with
      #           optional `method` (default `POST`), `credential` (default true: the owner's
      #           bearer token), `pad_to_bytes` (the body grows by `,"pad":"a…"` before its last
      #           `}` to exactly that many bytes), `declare_bytes` (only a head declaring
      #           that `content-length` is sent, never a body), `user_agent` (sent as the
      #           request's `user-agent`; none is sent without it) and `headers` (a list of
      #           `<name>: <value>` lines sent after `host`, as a client such as Claude Code
      #           adds `anthropic-version`; a line holding a CR or LF makes the program
      #           invalid), `close_after_bytes` (the client stops reading and closes the
      #           connection once it has received at least that many body bytes; the step's
      #           result is then `<status> closed`) and `half_close` (default false: the client
      #           keeps its sending side open while it waits, as a client waiting for any
      #           answer must, since the gateway reads a closed sending side as a client gone;
      #           true shuts it once the request is written, a client that is gone before the
      #           answer begins), `sealed_from` (the index,
      #           from 0, of an earlier request step: every `<sealed>` in this body is replaced
      #           by the first reasoning seal, `llmgw-seal-1.…`, the client received in that
      #           step's answer; a program naming a step that is not an earlier request makes
      #           the program invalid, and a step whose answer carried no seal sends `<sealed>`
      #           as it is) and `alter_seal` (default false: with `sealed_from`, the first
      #           character of the seal's state part is replaced by another before it is sent).
      #           Every request carries `host: gateway`. `{step: restart}` stops the gateway and
      #           composes it again from the same program: a new translator, and so a new seal
      #           key, over the same target source and pods; it is unready until the next
      #           `mark_ready`, and its result is `ok`.
      - {name: program_json, type: String}
    outcomes:
      - name: observed
        emits: [llm-gateway.gateway.Relayed]
        payload:
          llm-gateway.gateway.Relayed:
            valid_program: {generated: true}
        summary: Observe the real gateway relaying requests to loopback fixture pods.
events:
  # Test-adapter notification only; there is no production notification transport.
  - name: llm-gateway.gateway.Exchanged
    fields:
      - {name: valid_program, type: Boolean}
  # Test-adapter notification only; there is no production notification transport.
  - name: llm-gateway.gateway.Relayed
    fields:
      - {name: valid_program, type: Boolean}
views:
  - name: llm-gateway.gateway.LastExchange
    source: llm-gateway.gateway.ExchangeObservation
    consistency: read_your_writes
    fields: *exchange_facts
  - name: llm-gateway.gateway.LastRelay
    source: llm-gateway.gateway.RelayObservation
    consistency: read_your_writes
    fields: *relay_facts

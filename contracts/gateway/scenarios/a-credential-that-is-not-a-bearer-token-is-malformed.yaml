type: ess-scenario/1
domain: llm-gateway.gateway
scenario: a-credential-that-is-not-a-bearer-token-is-malformed
summary: another scheme, a bare scheme word and a repeated credential are each refused as credential-malformed
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","steps":[{"step":"mark_ready"},{"step":"send","raw":"GET /v1/routes HTTP/1.1\r\nauthorization: Basic b3duZXI6dG9rZW4=\r\n\r\n"},{"step":"send","raw":"GET /v1/routes HTTP/1.1\r\nauthorization: Bearer\r\n\r\n"},{"step":"send","raw":"GET /v1/routes HTTP/1.1\r\nauthorization: Bearer owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\r\nAuthorization: Bearer owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\r\n\r\n"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    results:
    - ok
    - 401 credential-malformed
    - 401 credential-malformed
    - 401 credential-malformed

: {\"response\":{\"created_at\":1800000000,\"id\":\"resp_1800000000_1\",\"model\":\"served\",\"object\":\"response\",\"output\":[{\"content\":[{\"annotations\":[],\"text\":\"Hello\",\"type\":\"output_text\"}],\"id\":\"msg_resp_1800000000_1_0\",\"role\":\"assistant\",\"status\":\"completed\",\"type\":\"message\"}],\"status\":\"completed\",\"usage\":{\"input_tokens\":12,\"input_tokens_details\":{\"cache_creation_input_tokens\":0,\"cached_tokens\":0},\"output_tokens\":2,\"total_tokens\":14}},\"sequence_number\":8,\"type\":\"response.completed\"}\n\n"

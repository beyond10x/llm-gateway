type: ess-scenario/1
domain: llm-gateway.gateway
scenario: r1-r5-another-method-takes-the-credential-and-then-is-not-allowed
summary: another method on a public route is credential-absent, with the owner method-not-allowed; the route inventory and neighbouring paths still take the credential
timeline:
- at: '2026-10-08T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["chat"],"tool_calling":"parsed","max_model_len":32768,"context_window":65536}],"pods":[],"steps":[{"step":"mark_ready"},{"step":"request","method":"POST","path":"/v1/models","body":"","credential":false},{"step":"request","method":"POST","path":"/","body":"","credential":false},{"step":"request","method":"POST","path":"/v1/models","body":""},{"step":"request","method":"DELETE","path":"/","body":""},{"step":"request","method":"GET","path":"/v1/routes","body":"","credential":false},{"step":"request","method":"GET","path":"/v1/models/code","body":"","credential":false}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    results:
    - ok
    - 401 credential-absent
    - 401 credential-absent
    - 405 method-not-allowed
    - 405 method-not-allowed
    - 401 credential-absent
    - 401 credential-absent
    headers:
    - content-type=application/json cache-control=no-store allow=absent
    - content-type=application/json cache-control=no-store allow=absent
    - content-type=application/json cache-control=no-store allow=GET, HEAD
    - content-type=application/json cache-control=no-store allow=GET, HEAD
    - content-type=application/json cache-control=no-store allow=absent
    - content-type=application/json cache-control=no-store allow=absent
    upstream: []
    records: []
    acquired: 0

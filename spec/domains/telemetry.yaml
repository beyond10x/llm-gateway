domain: llm-gateway.telemetry

# The gateway's counters and its per-call record (docs/llmgw-capability-matrix.md rows R4, O1, O2,
# O3; story:gateway-observability). The `Relay` command of llm-gateway.gateway observes both: its
# `records` fact holds one UsageRecord per call, and its `scrapes` fact holds what `GET /metrics`
# served. PLANNED: the token counters and `reported_model` of UsageRecord, and their series, which
# story:usage-records adds; no code fills them yet and every record carries them absent.
#
# Series. llmgw serves 13 Prometheus counters at `GET /metrics`, all prefixed `llmgw_`
# (llmgw src/lib.rs:144-180 at 048ebd8; llmgw README.md "Metrics"): eight process-wide and five
# per model and wire, labelled `model` and `wire`. The per-route series are registered from the
# configured registry before the first request, so an uncalled route reports zero instead of
# being absent. llm-gateway relays the same three wires (llm-gateway.gateway.Wire).
# DECIDED 2026-10-08 (story:gateway-observability): llm-gateway exports llmgw's 13 names
# verbatim, prefix `llmgw_` included, so a scrape configured for llmgw keeps working when llmgw
# retires (beyond10x/llm story:llmgw-retirement). Labels are `model` (the alias) and `wire`
# (`chat`, `responses`, `messages`), as llmgw, and every (model, wire) pair a relayed model
# declares is registered at zero when the gateway is composed. Each is a `counter`. The text is
# rendered inside the gateway crate, which takes no dependency for it. Where each is counted:
#   fed by the record (one record per relayed call, below):
#     llmgw_inference_requests_total                  every record
#     llmgw_upstream_failures_total                   every record no target answered: the
#                                                     target could not be reached or closed
#                                                     without an answer (`UpstreamFailed`, no
#                                                     `target_status`)
#     llmgw_route_requests_total{model,wire}          every record naming a relayed model
#     llmgw_route_refusals_total{model,wire}          the same, `Refused` or no target answered
#     llmgw_route_upstream_status_failures_total{..}  the same, its `target_status` outside 2xx,
#                                                     relayed (a 4xx, a 500) or answered
#                                                     `upstream-failed` (a 502, 503, 504)
#     llmgw_route_response_bytes_total{model,wire}    the same, its `response_bytes`
#   DECIDED 2026-10-08 (from llmgw src/lib.rs:598-629 at 048ebd8): llmgw counts
#   `upstream_failures` and a route refusal when the request got no answer (:598-604), and
#   `route_upstream_status_failures` for every answer whose status is not a success
#   (:622-629, `!status.is_success()`), whether it relays it or not. llm-gateway counts the same.
#   counted by the gateway where the event happens:
#     llmgw_endpoint_invalidations_total              each target it reports failed (row W7)
#     llmgw_route_cold_start_holds_total{model,wire}  each request its target source held for a
#                                                     starting target: the target says it held
#                                                     it, or the source answered `model-cold-start`
#     llmgw_cold_start_wait_seconds_total             the time those requests spent in `acquire`
#     llmgw_instruction_views_total                   each `GET /` or `HEAD /` it answered 200
#                                                     (row R1)
#   counted by the binary from the pool's results (crates/llm-gateway-cli/src/relaying.rs):
#     llmgw_pod_starts_total                          each pod create the pool submitted, seen as
#                                                     a request's hold binding to a new deployment
#     llmgw_pod_start_failures_total                  each `no-capacity`, `crash-loop`,
#                                                     `credential-refused` or `startup-deadline`
#                                                     answer a request received
#     llmgw_pod_reaps_total                           each deployment or pod a cleanup pass
#                                                     stopped (idle, retired, replaced, orphan)
#     llmgw_pod_start_spend_refusals_total            each `spend-ceiling` answer a request
#                                                     received: a pod start the spend check
#                                                     refused (story:spend-caps)
# DECIDED 2026-10-16 (story:spend-caps): beside llmgw's 13 the gateway serves one series of its
# own, `llmgw_pod_start_spend_refusals_total`, process-wide, after llmgw's eight; its prefix
# keeps one scrape configuration for every series. llmgw had no spend ceiling to count.
# DECIDED 2026-10-17 (story:prometheus-metrics): after llmgw's 13 and the spend-refusal series
# the gateway serves two series per model, labelled `model` (the alias) only, registered at zero
# for every relayed or hosted model when the relay is composed:
#   llmgw_requests_total{model,outcome}      a counter: every record naming a relayed model,
#                                            by its `outcome` (Outcome below); all four outcome
#                                            values of every model are registered at zero
#   llmgw_request_duration_seconds{model}    a histogram: every record naming a relayed model,
#                                            observing its `duration_ms` in seconds. Its
#                                            buckets are fixed, `le` = 0.05, 0.1, 0.25, 0.5, 1,
#                                            2.5, 5, 10, 30, 60, 120, 300 and +Inf seconds; a
#                                            record falls in every bucket whose bound in
#                                            milliseconds is at least its `duration_ms`
#                                            (`_bucket` cumulative, then `_sum` in seconds and
#                                            `_count`), as the Prometheus text format writes one
# Order. The text lists the series in the order above, and each series' samples in alias order,
# then by wire in llm-gateway.gateway.Wire's order (`chat`, `responses`, `messages`, not
# alphabetical), then by outcome in Outcome's order, a histogram's buckets in ascending `le`.
# A label is a model alias from the document or a fixed word; no label or value carries a
# credential, a prompt, a completion or a document's content. The token series are not these
# (story:token-and-cache-metrics).
# DECIDED 2026-10-17 (story:prometheus-metrics): the same text is served, without the owner
# credential, by an optional second listener, the deployment's `metrics_listen`
# (llm-gateway.deployment.DeploymentConfiguration). It answers `GET` and `HEAD` on exactly
# `/metrics` and nothing else: any other method or path is `404 path-unknown`, so no model
# route, probe or inspection path is reachable on it. With `metrics_bearer_file` it takes that
# token as `authorization: Bearer` (absent `credential-absent`, not one bearer token
# `credential-malformed`, another token `credential-rejected`, each 401); without it it is
# open. It serves before `mark_ready` and while draining, and stops with the gateway. The
# owner-guarded `/metrics` of the serving listener is unchanged.
# DECIDED 2026-10-08: `GET /metrics` (and `HEAD`) requires the owner credential, like every path
# outside the closed two-path probe set and the two public routes, and is served once the
# gateway is ready, like inspection (llm-gateway.gateway, docs/gateway.md "The HTTP surface").
#
# Usage. A usage record is what the gateway learned about one model call it was asked to relay.
# The token counters are llm's (beyond10x/llm spec/domains/chat.yaml at ee2ae428, its usage
# scenarios): a counter the upstream did not report stays absent, and a reported zero is a
# report. The record never fills an absent counter from an estimate, and never puts the alias
# where the upstream's own model name belongs.
# DECIDED 2026-10-06 (operator, option A of decision-blocker:usage-from-responses): the gateway
# reads usage out of a copy of every answer, event streams included, on each of the three wires.
# The client still receives the target's status, content type and body unchanged (llm-gateway.
# gateway RelayObservation, step 9). The parse uses llm's protocol crates, taken by tag (AGENTS.md
# "Dependencies on llm"), behind a port the binary implements, so the gateway crate's dependency
# closure stays empty (crates/llm-gateway/tests/dependency_boundary.rs). The token counters and
# `reported_model` are story:usage-records'; `disposition`, `refusal`, `status`,
# `response_bytes` and `duration_ms` need no parsing and are story:gateway-observability's.
# DECIDED 2026-10-08 (story:gateway-observability): a record is made for every request to a
# relayed wire path that passed owner authentication, whatever answered it, and goes two ways:
# into the counters above, and out of the gateway through a port the embedding implements
# (`UsageRecords`), as the target source does. The binary writes each as one structured
# `tracing` event at `info` (row O3: level from `RUST_LOG`, default `info`). There is no
# exporter. An unauthenticated or shed request makes no record. Tests read a record from the
# `Relay` command's `records` fact.
types:
  # `Process`: one series per gateway. `ModelWire`: one series per declared (model, wire) pair,
  # labelled `model` and `wire` (llmgw src/lib.rs:170-178).
  # `Model`: one series per relayed model, labelled `model` (and `outcome` for the outcome
  # counter).
  - name: llm-gateway.telemetry.SeriesScope
    kind: enum
    variants: [Process, ModelWire, Model]
  # llmgw declares each of its 13 series `# TYPE <name> counter` (llmgw src/lib.rs:147-179).
  - name: llm-gateway.telemetry.SeriesKind
    kind: enum
    variants: [Counter, Histogram]
  # How one call ended, from the gateway's side: relayed to the client with the target's answer
  # (a 4xx or 500 from the target included, row W7), refused by the gateway before any target
  # answered (`target-unavailable` and `model-cold-start` included: the source handed out none),
  # or ended `upstream-failed` (502). A translated request whose client went away before any
  # answer was written (a non-streamed client that closed while it waited) is `Relayed` with
  # `status` 0, no `target_status` and 0 `response_bytes`: no answer was written because the
  # client left (story:gateway-translation, correction round 2).
  - name: llm-gateway.telemetry.Disposition
    kind: enum
    variants: [Relayed, Refused, UpstreamFailed]
  # How one model call ended, as `llmgw_requests_total` labels it (story:prometheus-metrics):
  #   `ok`              Relayed: an answer reached the client, whatever its status
  #   `upstream_error`  the target failed, refused the call or closed without an answer:
  #                     `upstream-failed` (not timed out), `upstream-refused`,
  #                     `translation-unrepresentable`, `translation-too-large`
  #   `timeout`         the target's read timeout passed before its answer head
  #                     (`upstream-failed`), or a start deadline passed (`model-cold-start`)
  #   `refused`         the gateway refused the call before reaching a target: every other
  #                     refusal code (`spend-ceiling`, `target-unavailable`, `context-exceeded`,
  #                     a body or model refusal, …)
  # The table of every refusal code is published in docs/gateway.md, and
  # crates/llm-gateway/src/metrics.rs checks it against `RefusalCode::ALL`. A translated
  # request's transport timeout is reported by the translator as an upstream failure and is
  # counted `upstream_error`.
  - name: llm-gateway.telemetry.Outcome
    kind: enum
    variants: [Ok, UpstreamError, Timeout, Refused]
entities:
  - name: llm-gateway.telemetry.MetricSeries
    identity: {name: name, type: String}
    fields:
      - {name: help, type: String}
      - {name: kind, type: llm-gateway.telemetry.SeriesKind}
      - {name: scope, type: llm-gateway.telemetry.SeriesScope}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  - name: llm-gateway.telemetry.UsageRecord
    identity: {name: record_id, type: String}
    fields:
      # The relayed model's alias, as the client named it in the body's top-level `model`.
      # Absent when the body named no relayed model: a refusal before the body was read, and
      # `body-incomplete`, `body-not-json`, `model-absent` and `model-unknown`. A name no model
      # carries never reaches a record, a label or a log line.
      - {name: model, type: 'Optional<String>'}
      - {name: wire, type: llm-gateway.gateway.Wire}
      - {name: disposition, type: llm-gateway.telemetry.Disposition}
      # How the call ended for `llmgw_requests_total` (Outcome).
      - {name: outcome, type: llm-gateway.telemetry.Outcome}
      # Present exactly when `disposition` is `Refused` or `UpstreamFailed`.
      - {name: refusal, type: 'Optional<llm-gateway.gateway.Refusal>'}
      # The status line the client received; 0 when none was written because the client left
      # before a translated answer (Disposition).
      - {name: status, type: Integer}
      # The status the target answered with: the relayed one, or the 502, 503 or 504 the
      # gateway answered `upstream-failed` instead. Absent when no target answered: a refusal
      # before any target was asked, or a target that could not be reached or closed without
      # an answer.
      - {name: target_status, type: 'Optional<Integer>'}
      # The model name the target reported in its answer. Absent when it reported none; it is
      # never the alias and never the upstream name the gateway rewrote the request to (row W2).
      - {name: reported_model, type: 'Optional<String>'}
      # DECIDED 2026-10-16 (story:model-profile-fallback): the profile
      # (llm-gateway.runpod.ModelProfile `name`) of the pod that served the call, `default` for
      # a model declaring none. Absent when no pod served it: a hosted endpoint, and a refusal
      # before a pod was handed out. The binary's record carries it; the `Relay` command's
      # `records` fact does not, because the gateway scenarios relay to no pod
      # (`a_relayed_call_names_the_profile_of_the_pod_that_served` in
      # crates/llm-gateway-cli/tests/relaying.rs).
      - {name: profile, type: 'Optional<String>'}
      - {name: input_tokens, type: 'Optional<Integer>'}
      - {name: output_tokens, type: 'Optional<Integer>'}
      - {name: cached_input_tokens, type: 'Optional<Integer>'}
      - {name: cache_creation_input_tokens, type: 'Optional<Integer>'}
      - {name: reasoning_output_tokens, type: 'Optional<Integer>'}
      # Decoded body bytes of the target's answer relayed to the client (llmgw
      # `route_response_bytes_total`); 0 for a refusal, whose body is the gateway's own.
      - {name: response_bytes, type: Integer}
      # From the end of the request head to the last byte relayed or the refusal written.
      - {name: duration_ms, type: Integer}
    lifecycle: {initial: Recorded, states: [Recorded], terminal: [Recorded]}

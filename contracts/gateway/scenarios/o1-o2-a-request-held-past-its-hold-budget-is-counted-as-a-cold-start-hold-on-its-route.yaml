type: ess-scenario/1
domain: llm-gateway.gateway
scenario: o1-o2-a-request-held-past-its-hold-budget-is-counted-as-a-cold-start-hold-on-its-route
summary: a model-cold-start refusal is one Refused record and one cold-start hold on its model and wire
timeline:
- at: '2026-10-08T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["chat"]}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"warm\"}"]}]],"cold_starts":1,"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"code\"}"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"code\"}"},{"step":"scrape"}]}'
  outcome: observed

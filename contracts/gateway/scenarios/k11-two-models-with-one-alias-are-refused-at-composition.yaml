type: ess-scenario/1
domain: llm-gateway.gateway
scenario: k11-two-models-with-one-alias-are-refused-at-composition
summary: an alias names one model, so a second model under the same alias composes no gateway
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["chat"]},{"alias":"code","upstream_model":"other-code","wires":["messages"]}],"pods":[],"steps":[{"step":"mark_ready"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: relay:duplicate-model
    results: []

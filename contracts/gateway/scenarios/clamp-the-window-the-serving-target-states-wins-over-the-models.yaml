type: ess-scenario/1
domain: llm-gateway.gateway
scenario: clamp-the-window-the-serving-target-states-wins-over-the-models
summary: a target that states a max_model_len shorter than the model's declared one, as a pod started on a fallback profile does, is the window the output clamp keeps a messages request within
timeline:
- at: '2026-10-17T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["chat","messages"],"bearer":"vllm-key-code-0123456789abcdef","max_model_len":2048,"target_max_model_len":1024,"context_window":65536}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"input_tokens\":1000}"]},{"status":200,"content_type":"application/json","chunks":["{}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/messages","body":"{\"model\":\"code\",\"max_tokens\":32000,\"messages\":[]}"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: null
    results:
    - 'ok'
    - '200 relayed'
    upstream:
    - 'pod-1 POST /v1/messages/count_tokens {"model":"served-code","max_tokens":32000,"messages":[]}'
    - 'pod-1 POST /v1/messages {"model":"served-code","max_tokens":24,"messages":[]}'
    secret_upstream: false
    acquired: 1
    released: 1
    invalidated: []

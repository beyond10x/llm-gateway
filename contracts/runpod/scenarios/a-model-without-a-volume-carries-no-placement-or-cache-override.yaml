    - ready
    last_request: name=b10x-llm-qwen image=vllm/vllm-openai:v0.27.1 gpu=NVIDIA L40S count=1 cloud=SECURE disk=80 ports=8000/http interruptible=false volume=none mount=none dcs=
    last_env:
    - B10X_LLM_EPOCH=1
    - B10X_LLM_OWNER=controller-a
    - B10X_LLM_REQUEST=recorded
    - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    - VLLM_API_KEY={{ RUNPOD_SECRET_qwen_vllm_key }}

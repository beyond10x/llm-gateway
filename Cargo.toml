[workspace]
resolver = "3"
members = [
    "crates/llm-provision",
    "crates/llm-runpod",
    "crates/llm-modal",
    "crates/llm-gateway",
    "crates/llm-gateway-cli",
    "checks/conformance",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/llm-gateway"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[package]
name = "b10x-llm-gateway-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The b10x-llm-gateway binary: one closed TOML deployment document and the llm.routes/1 document it may name, one gateway that translates between wires with llm's clients, a clean stop."

[lib]
name = "llm_gateway_cli"

[[bin]]
name = "b10x-llm-gateway"
path = "src/main.rs"

[lints]
workspace = true

# Test-only. It builds the `gateway-tls-seam` test program below and enables nothing else: no
# dependency, no code of the library. The package's own tests turn it on through the
# dev-dependency on this package; `cargo build --release -p b10x-llm-gateway-cli`, the documented
# build, does not, so it writes no program that trusts a root its environment names.
[features]
test-seam = []

[dependencies]
# The reasoning seal (src/seal.rs): its state and tag in unpadded base64url.
base64 = "0.23.1"
clap = { version = "4.6", features = ["derive"] }
http = "1.5"
llm-bedrock = { git = "https://github.com/beyond10x/llm", tag = "0.18.0" }
llm-blocking = { git = "https://github.com/beyond10x/llm", tag = "0.18.0" }
llm-chat = { git = "https://github.com/beyond10x/llm", tag = "0.18.0" }
llm-core = { git = "https://github.com/beyond10x/llm", tag = "0.18.0" }
llm-credentials = { git = "https://github.com/beyond10x/llm", tag = "0.18.0" }
llm-gateway = { package = "b10x-llm-gateway", path = "../llm-gateway" }
llm-http = { git = "https://github.com/beyond10x/llm", tag = "0.18.0" }
llm-messages = { git = "https://github.com/beyond10x/llm", tag = "0.18.0" }
llm-models = { git = "https://github.com/beyond10x/llm", tag = "0.18.0", default-features = false }
llm-providers = { git = "https://github.com/beyond10x/llm", tag = "0.18.0" }
llm-responses = { git = "https://github.com/beyond10x/llm", tag = "0.18.0" }
llm-runpod = { package = "b10x-llm-runpod", path = "../llm-runpod" }
# The reasoning seal's HMAC-SHA256 key and tag (src/seal.rs), on the ring the TLS client
# already links.
ring = "0.17.14"
rustix = { version = "1.1", features = ["fs", "process", "termios"] }
# The pod connection's TLS client (spec/domains/deployment.yaml, the pod endpoint rule): rustls
# on its ring provider, never aws-lc-rs, trusting the roots webpki-roots compiles in.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
sha2.workspace = true
signal-hook = "0.4"
tokio = { version = "1.54", features = ["rt-multi-thread"] }
toml = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
url = "2.5.8"
webpki-roots = "1.0.11"

[dev-dependencies]
# Test certificates for the loopback https fixture pods, on ring like the client.
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
rustix = { version = "1.1", features = ["process"] }
sha2.workspace = true
# This package with `test-seam`, so that `cargo test` builds `gateway-tls-seam` for the process
# tests that run it (tests/pod_tls.rs, tests/adversary_w07_pod_tls.rs) with no feature flag.
b10x-llm-gateway-cli = { path = ".", features = ["test-seam"] }

# A fixture of the `connectors` CLI, built from b10x-llm-runpod's own fixture source so that the
# process tests can point the binary's document at it. Cargo builds a dependency's binaries for
# no test of another package, so this package builds its own copy. It is a test helper: the
# Dockerfile installs only `b10x-llm-gateway`.
[[bin]]
name = "gateway-connectors-fixture"
path = "../llm-runpod/tests/fixture/connectors.rs"
test = false
doc = false

# The shipped `main` with the TLS test seam (spec/domains/deployment.yaml): other trust roots and
# every pod host mapped to one loopback address, both read from its environment. A test helper
# for the process tests in tests/pod_tls.rs, built only with the test-only `test-seam` feature;
# the Dockerfile installs only `b10x-llm-gateway`, which reads neither.
[[bin]]
name = "gateway-tls-seam"
path = "tests/fixture/tls_seam.rs"
required-features = ["test-seam"]
test = false
doc = false

type: ess-scenario/1
domain: llm-gateway.gateway
scenario: a-credential-that-is-not-the-owners-is-rejected
summary: a well-formed bearer that is not the owner's is refused as credential-rejected
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","steps":[{"step":"mark_ready"},{"step":"send","raw":"GET /v1/routes HTTP/1.1\r\nauthorization: Bearer other-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\r\n\r\n"},{"step":"send","raw":"GET /v1/routes HTTP/1.1\r\nauthorization: Bearer owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\r\n\r\n"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    results:
    - ok
    - 401 credential-rejected
    - 401 credential-rejected
    bodies:
    - '{"error":{"code":"credential-rejected","message":"the presented owner credential was rejected"}}'
    - '{"error":{"code":"credential-rejected","message":"the presented owner credential was rejected"}}'
    headers:
    - www-authenticate=Bearer allow=absent
    - www-authenticate=Bearer allow=absent
    secret_on_wire: false

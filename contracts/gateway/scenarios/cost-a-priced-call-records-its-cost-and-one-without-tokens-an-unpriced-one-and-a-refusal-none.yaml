type: ess-scenario/1
domain: llm-gateway.gateway
scenario: cost-a-priced-call-records-its-cost-and-one-without-tokens-an-unpriced-one-and-a-refusal-none
summary: a priced model's call records what its reported tokens cost; its call without reported tokens, the same call of an unpriced model and a refused call record none
timeline:
- at: '2026-11-26T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"priced","upstream_model":"served-priced","wires":["chat"],"token_price":{"input":"3","output":"15","cache_read":"0.3"}},{"alias":"plain","upstream_model":"served-plain","wires":["chat"]}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"c-1\",\"usage\":{\"prompt_tokens\":1200,\"completion_tokens\":300,\"prompt_tokens_details\":{\"cached_tokens\":200}}}"]},{"status":200,"content_type":"application/json","chunks":["{\"id\":\"c-2\"}"]},{"status":200,"content_type":"application/json","chunks":["{\"id\":\"c-1\",\"usage\":{\"prompt_tokens\":1200,\"completion_tokens\":300,\"prompt_tokens_details\":{\"cached_tokens\":200}}}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"priced\",\"messages\":[]}"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"priced\",\"messages\":[]}"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"plain\",\"messages\":[]}"},{"step":"request","path":"/v1/messages","body":"{\"model\":\"priced\",\"messages\":[]}"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: null
    results:
    - ok
    - 200 relayed
    - 200 relayed
    - 200 relayed
    - 400 wire-not-served
    records:
    - model=priced wire=chat disposition=Relayed refusal=absent status=200 target_status=200 response_bytes=113 duration_ms=bounded tokens=reported cost_usd=0.00756
    - model=priced wire=chat disposition=Relayed refusal=absent status=200 target_status=200 response_bytes=12 duration_ms=bounded tokens=absent
    - model=plain wire=chat disposition=Relayed refusal=absent status=200 target_status=200 response_bytes=113 duration_ms=bounded tokens=reported
    - model=priced wire=messages disposition=Refused refusal=wire-not-served status=400 target_status=absent response_bytes=0 duration_ms=bounded tokens=absent

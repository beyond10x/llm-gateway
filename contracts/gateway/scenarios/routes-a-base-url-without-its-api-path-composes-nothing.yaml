type: ess-scenario/1
domain: llm-gateway.gateway
scenario: routes-a-base-url-without-its-api-path-composes-nothing
summary: a routes endpoint whose base_url names no path composes nothing, since llm and the gateway would reach different paths
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","translation":"on","models":[],"routes_document":"format: llm.routes/1\nendpoints:\n  lab: {base_url: \"http://pod-1\", protocol: messages, auth: {kind: anonymous}}\nroutes:\n  opus: lab/claude-opus-4-1\n","pods":[[{"status":200,"content_type":"application/json","chunks":["{}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/messages","body":"{\"model\":\"opus\",\"messages\":[]}"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: "config:value"
    results: []
    upstream: []
    connections: []
    acquired: 0

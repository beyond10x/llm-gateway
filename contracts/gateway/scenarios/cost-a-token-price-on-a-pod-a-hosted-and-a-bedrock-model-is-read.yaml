type: ess-scenario/1
domain: llm-gateway.gateway
scenario: cost-a-token-price-on-a-pod-a-hosted-and-a-bedrock-model-is-read
summary: the binary reads a document whose pod model, hosted endpoint and Bedrock model each declare a token_price table of quoted decimal strings, the cache keys optional, and composes it

type: ess-scenario/1
domain: llm-gateway.gateway
scenario: w1-a-body-of-exactly-32-mib-is-relayed
summary: a 33554432-byte body is read and relayed whole; the rewritten model makes it 7 bytes longer at the target
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["chat","responses","messages"]}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"big\"}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"code\"}","pad_to_bytes":33554432}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    results:
    - ok
    - 200 relayed
    bodies:
    - '{"id":"big"}'
    upstream:
    - pod-1 POST /v1/chat/completions 33554439 bytes
    acquired: 1

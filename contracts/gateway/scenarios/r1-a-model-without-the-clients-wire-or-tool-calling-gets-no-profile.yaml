type: ess-scenario/1
domain: llm-gateway.gateway
scenario: r1-a-model-without-the-clients-wire-or-tool-calling-gets-no-profile
summary: GET / offers a client its profile only for models declaring its wire and tool calling parsed; a chat-only model gets no Codex or Claude Code profile, a text-only model none
timeline:
- at: '2026-10-08T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"chatonly","upstream_model":"served-chat","wires":["chat"],"tool_calling":"parsed","context_window":32768},{"alias":"textonly","upstream_model":"served-text","wires":["chat","responses","messages"],"tool_calling":"absent","context_window":32768},{"alias":"agentic","upstream_model":"served-agentic","wires":["responses","messages"],"tool_calling":"parsed","context_window":16384}],"pods":[],"steps":[{"step":"mark_ready"},{"step":"request","method":"GET","path":"/","body":"","credential":false,"user_agent":"codex-cli/1.0"},{"step":"request","method":"GET","path":"/","body":"","credential":false,"user_agent":"claude-cli/2.0"},{"step":"request","method":"GET","path":"/","body":"","credential":false,"user_agent":"curl/8.0"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    results:
    - ok
    - 200 answered
    - 200 answered
    - 200 answered
    bodies:
    - |
      # Codex profiles for this llm-gateway, one per model it serves on the responses wire with
      # tool calling parsed. Save one as the file it names, export B10X_GATEWAY_TOKEN as the
      # gateway's owner token, and start Codex with `codex --profile <alias>`.

      # ~/.codex/agentic.config.toml
      model = "agentic"
      model_provider = "b10x-gateway"
      model_context_window = 16384

      [model_providers.b10x-gateway]
      name = "b10x llm-gateway"
      base_url = "http://gateway/v1"
      env_key = "B10X_GATEWAY_TOKEN"
      wire_api = "responses"
    - |
      # Claude Code settings for this llm-gateway, one block per model it serves on the messages
      # wire with tool calling parsed. Set ANTHROPIC_AUTH_TOKEN to the gateway's owner token, or
      # name an apiKeyHelper that prints it; ANTHROPIC_API_KEY is sent as x-api-key, which this
      # gateway does not read.

      # model agentic
      export ANTHROPIC_BASE_URL='http://gateway'
      export ANTHROPIC_MODEL='agentic'
      export ANTHROPIC_DEFAULT_OPUS_MODEL='agentic'
      export ANTHROPIC_DEFAULT_SONNET_MODEL='agentic'
      export ANTHROPIC_DEFAULT_HAIKU_MODEL='agentic'
      export CLAUDE_CODE_SUBAGENT_MODEL='agentic'
      export CLAUDE_CODE_MAX_CONTEXT_TOKENS='16384'
    - |
      llm-gateway

      GET /v1/models lists the models this gateway serves. GET / with a User-Agent naming codex
      answers Codex profiles, and one naming claude answers Claude Code settings. Every model call
      carries the gateway's owner token as Authorization: Bearer.

      # Loom, through an llm catalog (format = "llm.catalog/1"), one serving model per model this
      # gateway serves on the chat wire with tool calling parsed. Give each table its ids, and the
      # account a secret_reference_id that resolves to the owner token.

      # model chatonly
      [[accounts]]
      auth_kind = "bearer"

      [[endpoints]]
      base_url = "http://gateway/v1"

      [[models]]
      upstream_name = "chatonly"

      [[serving_models]]
      protocol = "chat-completions"
      [serving_models.capabilities]
      tools = true
      context_window = 32768
    acquired: 0

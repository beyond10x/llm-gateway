name: Gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  serving-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # action revision; toolchain is pinned below
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Install ess
        env:
          ESS_VERSION: "0.99.4"
          ESS_SHA256: 3902d0f8a6dffe5255bd0a9c8f56608fabf52faf14b97d90b6e7f7ed3da7032d
        run: |
          set -euo pipefail
          asset="ess-$ESS_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/beyond10x/ess/releases/download/$ESS_VERSION"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$asset" "$release/$asset"
          curl --fail --silent --show-error --location --output SHA256SUMS "$release/SHA256SUMS"
          grep -Fx "$ESS_SHA256  $asset" SHA256SUMS
          grep -F "  $asset" SHA256SUMS | sha256sum --check --strict
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/ess-$ESS_VERSION-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Rust crates
        run: |
          cargo test --workspace --locked
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Documentation pages
        run: cargo run --locked -p llm-gateway-docs -- generate --check
      - name: Specification and conformance
        run: |
          ess specify validate --path spec
          cargo run --locked -p b10x-llm-gateway-conformance -- check
      - name: Specification diff against the pull request's base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo run --locked -p b10x-llm-gateway-conformance -- diff --base "origin/$BASE_REF"
      - name: Specification diff against the previous head of main
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: cargo run --locked -p b10x-llm-gateway-conformance -- diff --base "$BEFORE"
      - name: Conformance reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serving-conformance
          path: target/conformance
          if-no-files-found: error
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the change reaches the dashboard
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed-paths"
            run="$(sh ci/changed.sh < "$RUNNER_TEMP/changed-paths")"
          else
            run=yes
          fi
          echo "dashboard checks: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.changes.outputs.run == 'yes'
        with:
          node-version: "22"
      - name: Install dependencies
        if: steps.changes.outputs.run == 'yes'
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Type check
        if: steps.changes.outputs.run == 'yes'
        run: pnpm typecheck
      - name: Unit tests
        if: steps.changes.outputs.run == 'yes'
        run: pnpm test
      - name: Build the page and compare it with the committed one
        if: steps.changes.outputs.run == 'yes'
        run: |
          pnpm build
          git diff --exit-code ../crates/llm-gateway/src/dashboard.html
      - name: Install Chromium for Playwright
        if: steps.changes.outputs.run == 'yes'
        run: pnpm exec playwright install --with-deps chromium
      - name: Layout contract, hard gates and ratchet
        if: steps.changes.outputs.run == 'yes'
        run: timeout 120 pnpm e2e --workers=2
      - name: Playwright report
        if: failure() && steps.changes.outputs.run == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-playwright
          path: |
            dashboard/playwright-report
            dashboard/test-results
            dashboard/ux/.metrics
          include-hidden-files: true
          if-no-files-found: ignore

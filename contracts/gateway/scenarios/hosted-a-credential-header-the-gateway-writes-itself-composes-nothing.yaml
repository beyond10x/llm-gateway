type: ess-scenario/1
domain: llm-gateway.gateway
scenario: hosted-a-credential-header-the-gateway-writes-itself-composes-nothing
summary: an api-key endpoint whose credential header is one the gateway writes itself is refused credential-header:reserved and nothing is composed
timeline:
- at: '2026-10-14T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"remote","upstream_model":"vendor-remote","wires":["chat"],"endpoint":{"pod":"pod-1","scheme":"http","auth_kind":"api-key","credential":"endpoint-api-key-0123456789abcdef","credential_header":"Content-Length"}}],"pods":[[]],"steps":[{"step":"mark_ready"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: 'credential-header:reserved'
    results: []
    upstream: []
    connections: []
    acquired: 0

type: ess-scenario/1
domain: llm-gateway.gateway
scenario: tools-a-tool-request-to-a-model-with-tool-calling-parsed-is-relayed-unchanged
summary: a body with a non-empty top-level tools array, for a model declaring tool calling parsed, reaches the fixture pod with only its model rewritten
timeline:
- at: '2026-10-08T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["chat"],"tool_calling":"parsed"}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"tool\"}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"code\",\"messages\":[],\"tools\":[{\"type\":\"function\",\"function\":{\"name\":\"shell\"}}]}"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    results:
    - ok
    - 200 relayed
    bodies:
    - '{"id":"tool"}'
    upstream:
    - 'pod-1 POST /v1/chat/completions {"model":"served-code","messages":[],"tools":[{"type":"function","function":{"name":"shell"}}]}'
    acquired: 1
    invalidated: []

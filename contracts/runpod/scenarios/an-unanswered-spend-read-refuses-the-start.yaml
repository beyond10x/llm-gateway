type: ess-scenario/1
domain: llm-gateway.runpod
scenario: an-unanswered-spend-read-refuses-the-start
summary: with a ceiling declared a spend read that answers nothing refuses the start and assumes no ceiling met
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm-gateway.runpod.Exercise
  input:
    program_json: '{"models":{"qwen":{"price_per_hour_usd":2,"startup_deadline_ms":1800000}},"spend":{"daily_cap_usd":10,"total_cap_usd":100},"steps":[{"step":"ensure","alias":"qwen"}]}'
  outcome: observed
assert:
- view: llm-gateway.runpod.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.runpod.LastExecution
  contains:
    results:
    - err:spend-ceiling:unknown
    create_calls: 0
    spend_reads: 1
    requested_gpus: []
    pods: []
    phases:
    - qwen-1:cancelled
    stop_required: []

type: ess-scenario/1
domain: llm-gateway.gateway
scenario: k11-a-wire-the-model-does-not-declare-is-refused-without-waking-a-target
summary: a model declared for chat only refuses the responses and messages wires as wire-not-served, asks for no target for them, and still serves chat
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"chat-only","upstream_model":"served-chat","wires":["chat"]},{"alias":"code","upstream_model":"served-code","wires":["messages","responses"]}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"chat\"}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/messages","body":"{\"model\":\"chat-only\"}"},{"step":"request","path":"/v1/responses","body":"{\"model\":\"chat-only\"}"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"code\"}"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"chat-only\"}"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    results:
    - ok
    - 400 wire-not-served
    - 400 wire-not-served
    - 400 wire-not-served
    - 200 relayed
    upstream:
    - 'pod-1 POST /v1/chat/completions {"model":"served-chat"}'
    acquired: 1

type: ess-scenario/1
domain: llm-gateway.gateway
scenario: a-head-that-never-completes-is-refused-when-the-read-times-out
summary: a peer that stops before the end of its head is answered request-malformed once the read timeout passes
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","read_timeout_ms":200,"steps":[{"step":"mark_ready"},{"step":"send_partial","raw":"GET /v1/routes HTTP/1.1\r\nauthorization: Bearer owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa\r\n"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    results:
    - ok
    - 400 request-malformed

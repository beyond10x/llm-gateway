domain: llm-gateway.runpod

# The Runpod adapter (crates/llm-runpod) over the llm-gateway.hosting contract. Every pod lifecycle
# decision is llm-gateway.hosting's Controller; this domain declares what the adapter adds on top of
# it: ordered GPU fallback, single-flight startup, readiness and crash recovery, ownership-safe
# adoption by exact identity, and idle and orphan cleanup (crates/llm-runpod/src/lib.rs:6-28).
# The entities are verification-adapter observations of the real `RunpodPool` driving the real
# `RunpodProvider` over the crate's in-process `EmulatedRunpod`; no socket, credential or cloud
# resource is involved (crates/llm-runpod/src/emulated.rs:1-7).
# ESS-LIMIT: the crate links `b10x-llm-credentials` and `tokio` through `b10x-llm-providers` and
# uses neither; the one thing it takes from `b10x-llm-providers` is the Runpod description
# (`descriptions::runpod`, `inference_base_url`). What a crate links is no ESS construct;
# `the_crate_uses_nothing_of_llm_providers_but_the_runpod_description` in
# crates/llm-runpod/tests/runpod.rs holds it.
#
# DECIDED 2026-10-08 (D1 = A, docs/design/runpod-clients.md § 4): the production transport,
# `ConnectorsRunpod` (crates/llm-runpod/src/transport/connectors.rs), reaches Runpod's control
# plane only through the `connectors` CLI of beyond10x/connectors v0.37.0 and its Runpod catalog
# bundle (connectors docs/catalog-runpod.md). This crate holds no HTTP client and no credential
# for the control plane; the Runpod API key stays in the connectors keyring. The invocations it
# makes, its inputs and the answers it maps are the `Connectors*`, `PodCreateBody`, `CreateAnswer`,
# `TerminateAnswer` and `ProbeAnswer` types below. No scenario observes them: the crate's
# tests/transport.rs drives the transport against a fixture of the CLI, never the real one.
# Live control-plane behaviour is still unverified (docs/hosting.md "Unchecked assumptions").
# DEFERRED: orphan and inherited terminations bypass the controller, so no stop obligation or
# receipt reaches the budget ledger (docs/hosting.md:316-324, docs/verification/runpod.md "J2").
# Closing it needs llm-provision to record and discharge an obligation for a resource with no
# deployment; owned by story:orphan-termination-obligations. It is
# not declared as intent.
types:
  # Refusals `RunpodPool` hands a caller (crates/llm-runpod/src/pool.rs:62-106). `hosting`
  # wraps an llm-gateway.hosting refusal; `invalid-model` wraps one of ConfigError.
  # `starting` is answered at once; the pool holds no caller. The pod's `startup_deadline_ms`
  # bounds the pod, not a caller: how long a request waits on `starting` is the embedding's own
  # hold budget (llm-gateway.deployment `request_hold_seconds`, row K28).
  # DECIDED: a caller that asks again and again through `ensure_held` carries a `Hold`, bound to
  # the deployment its first `starting` answer was about. While the slot is stopping a previous
  # deployment the hold stays unbound. Once its bound deployment is retired, is marked
  # stop-required, reaches a terminal phase, or is no longer the slot's current one, the hold is
  # lost. An `uncertain` record (a lost create that may have allocated a pod) keeps the hold
  # waiting, bound, because that pod may still serve. On a lost hold the call answers the retire
  # reason if that step retired it, `stopping` otherwise, submits nothing, and every later call
  # through that hold does the same. Every caller held on a pod that failed learns it failed, not
  # only the one whose step retired it.
  # Each variant carries the code `PoolError::code` answers;
  # `every_pool_and_config_refusal_is_declared_with_its_code` (crates/llm-runpod/tests/runpod.rs)
  # holds them to the crate.
  # DECIDED 2026-10-14: the five retire codes `crash-loop`, `credential-refused`,
  # `startup-deadline`, `pod-exited` and `stopped-serving` are refusals a caller receives. A
  # pool step that retires the slot's current deployment answers its reason to the one call of
  # `ensure`, `ensure_running` or `ensure_held` that made the step. A caller held on that
  # deployment whose own step did not retire it is answered `stopping` (the `Hold` rule above),
  # and a later caller as the slot then stands: `stopping` while the stop is unconfirmed, a new
  # start after it (crates/llm-runpod/src/pool.rs `hand_out`). A retirement made by a cleanup
  # pass (`reap`) is reported in its `replaced` list and refuses nobody. The gateway's relay
  # answers every one of them `target-unavailable` (crates/llm-gateway-cli/src/relaying.rs).
  # Observed by
  # `an-exited-pod-is-terminated-and-replaced` (`err:pod-exited`) and
  # `a-pod-that-stops-serving-after-it-served-is-retired-past-its-startup-deadline`
  # (`err:stopped-serving`).
  - name: llm-gateway.runpod.PoolRefusal
    kind: enum
    attributes:
      - {name: code, type: String}
    variants:
      # No model is declared under the alias; Runpod is not contacted
      # (`an-unknown-model-is-refused-without-contacting-runpod`).
      - {name: UnknownModel, attributes: {code: unknown-model}}
      # A declaration the pool was built from is refused; the code is `invalid-model:<ConfigRefusal>`.
      - {name: InvalidModel, attributes: {code: invalid-model}}
      - {name: Starting, attributes: {code: starting}}
      # The slot's deployment owes a stop that is not confirmed yet; nothing new is created
      # meanwhile (`an-unresolved-lost-create-blocks-a-second-pod-until-it-is-resolved`).
      - {name: Stopping, attributes: {code: stopping}}
      # The GPU types are tried one create at a time, in declared order; a refused create tries
      # the next one, and this is the answer when every one refused: nothing was created and the
      # deployment is withdrawn (`a-placement-refusal-falls-through-to-the-next-declared-gpu-in-order`,
      # `every-declared-gpu-refusing-withdraws-the-deployment-and-leaves-no-pod`). A lost create
      # answer ends the attempt instead: no further GPU is tried, because Runpod takes no
      # idempotency key and `honours_idempotency_key` is `false`; the record is uncertain and
      # is resolved by its request id (`a-lost-create-answer-is-never-retried-and-is-adopted-by-request-id`,
      # `runpod_does_not_promise_idempotent_creates`).
      - {name: NoCapacity, attributes: {code: no-capacity}}
      # A restart is the pod's `lastStartedAt` moving forward (see the note after `ProbeAnswer`).
      # DECIDED 2026-10-14: the crash-restart limit is configurable per model,
      # `RunpodModel.crash_restart_limit` (at least 1; 0 is `ZeroSetting`), not fixed at two:
      # a pod is a crash loop once the restarts observed inside its `crash_window_ms` (window
      # end inclusive) reach the limit, at any time in its life, and is terminated; the next
      # request starts a new deployment. llmgw's "two decreasing uptimes" is the limit 2, which
      # the shipped binary fixes, with a 600 000 ms window (llm-gateway.deployment).
      # (`the-crash-restart-limit-is-reached-at-exactly-its-count`,
      # `one-restart-below-the-crash-limit-is-not-a-crash-loop`,
      # `restarts-inside-the-crash-window-are-a-crash-loop`,
      # `restarts-spread-over-more-than-the-crash-window-are-not-a-crash-loop`,
      # `a-crash-looping-pod-is-terminated-and-the-next-request-starts-a-fresh-one`).
      - {name: CrashLoop, attributes: {code: crash-loop}}
      # The pod refused its vLLM key (`401`/`403` to the probe); it is terminated
      # (`a-pod-that-refuses-its-credential-is-terminated`).
      - {name: CredentialRefused, attributes: {code: credential-refused}}
      # The pod did not serve within `startup_deadline_ms` of its start; it is terminated, because
      # it is billed and serves nobody (`a-pod-that-misses-its-startup-deadline-is-terminated`).
      - {name: StartupDeadline, attributes: {code: startup-deadline}}
      # Only `TERMINATED` ends a resource. A pod Runpod reports `EXITED` still exists and is billed:
      # it is reported present-but-not-running (llm-gateway.hosting `ProviderState` `Pending`),
      # terminated and replaced. An endpoint is reported only for a `RUNNING` pod
      # (`an-exited-pod-is-terminated-and-replaced`, `a-pod-that-is-not-running-reports-no-endpoint`).
      - {name: PodExited, attributes: {code: pod-exited}}
      # A pod that served and then answers a definite "not ready" gets the startup deadline again,
      # counted from the last time it was seen ready; unknown readiness neither starts nor ends that
      # clock (`a-pod-that-stops-serving-after-it-served-is-retired-past-its-startup-deadline`,
      # `a_pod_whose_readiness_is_unknown_after_serving_is_not_retired_by_the_deadline` in
      # tests/round2.rs).
      - {name: StoppedServing, attributes: {code: stopped-serving}}
      # The hosting controller refused; the code is `hosting`.
      - {name: Hosting, attributes: {code: hosting}}
  # Why a model declaration is refused (crates/llm-runpod/src/config.rs `RunpodModel::validate`),
  # the first that applies, in this order. The message never quotes the refused value
  # (`a_model_declaration_without_a_usable_setting_is_refused`,
  # `every_refused_setting_is_refused_on_its_own` in tests/adversary.rs).
  - name: llm-gateway.runpod.ConfigRefusal
    kind: enum
    attributes:
      - {name: code, type: String}
    variants:
      # No GPU type is declared (`a-model-without-a-gpu-type-is-refused`).
      - {name: NoGpu, attributes: {code: no-gpu}}
      # `gpu_memory_utilization` is not a finite value in (0, 1]
      # (`a-gpu-memory-utilization-of-exactly-one-is-admitted`,
      # `a-gpu-memory-utilization-above-one-is-refused`,
      # `runpod-a-gpu-memory-utilization-of-zero-is-refused`).
      - {name: GpuUtilization, attributes: {code: gpu-utilization}}
      # `max_model_len`, `max_num_seqs`, `container_disk_gb`, `startup_deadline_ms`,
      # `idle_timeout_ms`, `crash_restart_limit` or `crash_window_ms` is zero
      # (`a-zero-crash-window-is-refused`).
      - {name: ZeroSetting, attributes: {code: zero-setting}}
      # `api_key_secret` is empty or not `[A-Za-z0-9_]+`, so it cannot sit in a Runpod secret
      # template (`a-secret-name-unusable-in-a-runpod-template-is-refused`).
      - {name: SecretReference, attributes: {code: secret-reference}}
      # A value that reaches the pod's command line or environment is empty or not printable
      # ASCII: the checkpoint, data-center ids and the cache volume as single tokens, the GPU
      # types, extra vLLM arguments and sampling as printable text; a reasoning effort is
      # alphanumeric (`a-model-value-that-is-not-printable-is-refused`).
      - {name: UnsafeText, attributes: {code: unsafe-text}}
  # What the production transport is built from. `executable` is the `connectors` binary,
  # `adapter` the alias its configuration binds the Runpod catalog provider to (connectors
  # docs/catalog-runpod.md "Authentication", e.g. `gpu`), `connection` the saved connection id.
  # `work_directory` is an existing private directory: each write's input document and its
  # approval proof are new files there (`approvals issue --proof-output` must name "a new
  # absolute output path inside an existing private directory", connectors
  # docs/local-approvals.md). DECIDED: a relative `work_directory` is resolved against the
  # current directory once, when the transport is built, so every path it passes is absolute.
  # `timeout_ms` bounds one CLI call, its output included: the CLI runs in its own process
  # group, and when the bound passes, before it exited or before its output closed (a process
  # it started may hold it), the whole group is killed and the answer is lost.
  - name: llm-gateway.runpod.ConnectorsBinding
    kind: struct
    fields:
      - {name: executable, type: String}
      - {name: adapter, type: String}
      - {name: connection, type: String}
      - {name: work_directory, type: String}
      - {name: timeout_ms, type: Integer}
  # The three operations of connectors' shipped Runpod selection set, `pod.create` (Runpod
  # `CreatePod`), `pods.list` (`ListPods`) and `pod.terminate` (`DeletePod`). connectors
  # v0.37.0 selects no `GetPod`: a get is `pods.list` with the `id` filter. Every invocation is
  # `connectors --output json operations invoke --adapter <adapter> --connection <connection>
  # --operation <id> --schema <schema> --revision <revision> --input-file <document>`, where
  # `schema` and `revision` are read per operation from `connectors --output json operations
  # describe --adapter <adapter> --operation <id>` and kept until a refusal below drops them.
  # DECIDED: the answers are read in connectors' published framing (connectors v0.37.0
  # contracts/cli/v1alpha1/semantics.md:178-181). A success is exit 0 with one
  # `{"ok":true,"result":…}` envelope on stdout; every value the transport reads (`schema`,
  # `revision`, `preparation.subject_sha256`, `connection.summary.revision`, the invoke's
  # `result.status`, `result.body` and `mutation.classification`) is inside that `result`. A
  # failure is a non-zero exit with stdout empty and one `{"ok":false,"error":{"code","data"}}`
  # envelope on stderr; `error.data` is connectors' `Failure` (`code`, `stage`, `next_action`)
  # and carries `mutation` when connectors observed one. Both streams are read under the same
  # deadline and size bound. Anything else, top-level fields outside an envelope included, is
  # unreadable: `Lost` for a write, an incomplete listing for a read.
  # ESS-LIMIT: the size bound is 8 MiB per stream, 8 388 608 bytes read and one more unreadable,
  # and no part of either stream reaches the transport's `Debug`. No scenario observes the
  # transport; `a_stream_is_read_up_to_eight_mebibytes_and_not_one_byte_more`
  # (src/transport/connectors.rs) and `a_failure_on_stderr_reaches_no_debug_output`
  # (tests/transport.rs) hold them.
  # DECIDED: each write (`pod.create`, `pod.terminate`) is first `approvals prepare`d and
  # `approvals issue`d for its exact input document, then invoked with `--approval-file
  # <proof> --idempotency-key <key>`. The transport never sends a write twice.
  # DECIDED: an invoke refused before anything was dispatched (no classification, or
  # `not_attempted`) is repeated once, after one recovery step, when its `error.data` is one of:
  # - `code: not_granted`, `stage: admission`: the connection's evidence expired
  #   (`evidence_lifetime_ms`, 60 s when omitted, at most 300 000 ms; connectors v0.37.0
  #   docs/local-catalog-provider.md:479-486, "The invoke does not revalidate on its own";
  #   semantics.md:748-753). Recovery: read the connection's revision (`connections describe`)
  #   and run `connections revalidate --adapter <adapter> --connection <connection>
  #   --expected-revision <revision>` once.
  # - `code: stale_description`: "schema/descriptor changed", answered "before provider
  #   dispatch" (semantics.md:579-581, :606). Recovery: drop that operation's cached `schema`
  #   and `revision` and run `operations describe` once.
  # - `code: lifecycle_conflict`, `stage: admission`: "stale revision" (semantics.md:601),
  #   e.g. a connection saved under an older configuration revision after a connectors
  #   configuration upgrade (docs/local-catalog-provider.md:396-399, semantics.md:759-764).
  #   Recovery: drop the cached `schema` and `revision`, run `operations describe` once, and,
  #   when `next_action` is `revalidate_connection`, revalidate the connection as above.
  # A recovery step that fails ends there. The repeat of a write is a new attempt, with a fresh
  # proof and its own idempotency key. A second refusal, or any other answer, is mapped as
  # usual: `Lost` for a write, an incomplete listing for a read. A write refused any other way,
  # or classified otherwise, is never repeated.
  - name: llm-gateway.runpod.ConnectorsOperation
    kind: enum
    variants: [PodCreate, PodsList, PodTerminate]
  # connectors' `mutation.classification` of a write (connectors ess/domains/mutations.yaml
  # `EffectKnowledge`).
  - name: llm-gateway.runpod.WriteClassification
    kind: enum
    variants: [not_attempted, refused, applied, unknown]
  # A create's answer to the provider.
  # DECIDED: `Created` only for `applied` with a pod whose `id` and `name` parse from
  # `result.body`. `Refused` only for `refused`: Runpod made nothing, so the provider may try the
  # next GPU. `unknown` is resolved by one `pods.list` on the pod's `name`. That name is per
  # model alias, not per create (`pod_name(resource_name)`), and Runpod's `Pod.name` "does not
  # need to be unique", so the answer is `Created` only if that whole answer holds exactly one
  # pod of that name whose env `B10X_LLM_REQUEST` equals this create's request tag, and `Lost`
  # otherwise, including for a create with no request tag. `not_attempted`, a
  # timeout, a non-zero exit with no classification, and unparseable output are `Lost`. A `Lost`
  # create is never retried, here or by the provider.
  - name: llm-gateway.runpod.CreateAnswer
    kind: enum
    variants: [Created, Refused, Lost]
  # A terminate's answer. DECIDED: `Terminated` only for `applied`; `refused` (including
  # Runpod's `404` / `not_found`, which does not prove the pod is gone) is `Refused`; anything
  # else is `Lost`.
  - name: llm-gateway.runpod.TerminateAnswer
    kind: enum
    variants: [Terminated, Refused, Lost]
  # The `pod.create` `body`, one field per key the transport may send, named as Runpod's pinned
  # `PodCreateInput` names it (connectors adapters/runpod/upstream/runpod-rest-v1.json, SHA-256
  # 9500a8989878d53d8731f27bf8dbbd57801b328c760bdb32c38ba36d5cb580db). The fields are exactly
  # connectors v0.37.0's fifteen `pod.create` `body_keys`
  # (adapters/catalog/providers/runpod/operations.json); connectors refuses any other key as
  # `invalid_input` before any request (docs/catalog-runpod.md:88-89).
  # DECIDED: the body follows llmgw's (llmgw src/runpod.rs:781-799 at 048ebd8): `dockerEntrypoint`
  # carries the vLLM argv (`vllm serve …`), `dockerStartCmd` is always `[]`, `volumeInGb` is `0`
  # when there is no network volume, and `networkVolumeId` carries the model cache volume.
  # `dockerStartCmd: []` is llmgw parity; the pinned PodCreateInput says of it "If [], uses the
  # start CMD defined in the image", and connectors v0.37.0 docs/catalog-runpod.md:84 says `[]`
  # "keeps the image's", so it does not clear the image's CMD. `volumeInGb: 0` asks for no pod
  # volume, where Runpod's default is 20 (docs/catalog-runpod.md:77); `networkVolumeId` "replaces
  # the pod volume" (:86). Any other optional key is left out, never sent empty.
  - name: llm-gateway.runpod.PodCreateBody
    kind: struct
    fields:
      - {name: name, type: String}
      - {name: imageName, type: String}
      - {name: gpuTypeIds, type: 'List<String>'}
      - {name: gpuCount, type: Integer}
      - {name: containerDiskInGb, type: Integer}
      - {name: volumeInGb, type: 'Optional<Integer>'}
      - {name: volumeMountPath, type: 'Optional<String>'}
      - {name: ports, type: 'List<String>'}
      - {name: env, type: 'Map<String, String>'}
      - {name: cloudType, type: String}
      - {name: dataCenterIds, type: 'Optional<List<String>>'}
      - {name: interruptible, type: Boolean}
      - {name: dockerEntrypoint, type: 'Optional<List<String>>'}
      - {name: dockerStartCmd, type: 'List<String>'}
      - {name: networkVolumeId, type: 'Optional<String>'}
  # The readiness probe: `GET <endpoint>models` with `Authorization: Bearer <vLLM key>`, where
  # the endpoint is the one llm's Runpod description builds for the pod and the key is the
  # model's, handed to the transport by alias. The transport reads no file, and its `Debug`
  # prints no key. DECIDED: `200` is `Ready` with the `data[].id` names, `401`/`403`
  # `Refused`, any other answer `NotReady`, no answer `Unreachable`. DECIDED 2026-10-14
  # (story:pod-proxy-tls): an `http://` endpoint is probed over a plain socket; an `https://`
  # endpoint over the TLS connection the embedding hands the transport
  # (`ConnectorsRunpod::set_tls`, `PodTls`), opened with the certificate verified before the
  # request is written. Without one, or when the handshake fails, it is `Unreachable`, and the
  # key is not sent. This crate links no TLS crate; the binary's client is in
  # llm-gateway.deployment.
  - name: llm-gateway.runpod.ProbeAnswer
    kind: enum
    variants: [Ready, NotReady, Refused, Unreachable]
  # DECIDED: crash-loop detection reads the pod's `lastStartedAt` (`pods.list` with `id`) in
  # place of llmgw's GraphQL uptime query. A value later than the last one seen for that pod is
  # one restart; the first value, an equal one, an earlier one or none is not.
entities:
  # One pool: one `llm-gateway.hosting.Controller` scope, one slot per declared model alias.
  # Identity: a pod's resource key is (provider, account, pod name, pod id); the incarnation is
  # the Runpod pod id. Every create writes the owner (`B10X_LLM_OWNER`), the epoch
  # (`B10X_LLM_EPOCH`) and the request id (`B10X_LLM_REQUEST`) into the pod environment, and the
  # listing reads them back as the resource's owner, epoch and request id. A restarted pool adopts
  # only the durable record's exact key, or its request id; a pod labelled for another owner is
  # not adopted, and one taken over at a newer epoch is reported transferred
  # (`the-create-request-carries-the-declared-vllm-settings`,
  # `a-restarted-pool-adopts-its-own-pod-by-exact-identity-without-creating`,
  # `a-restarted-pool-does-not-adopt-a-pod-that-reused-its-name`,
  # `a-pod-retagged-by-a-newer-owner-is-handed-over-and-never-terminated`).
  # Namespace: pods are named `b10x-llm-<alias>`. A pod whose name starts with `llmgw-` is never
  # listed, adopted, swept or terminated (`the-orphan-sweep-never-selects-a-legacy-llmgw-pod`,
  # `an_llmgw_pod_does_not_keep_a_lost_create_unresolved` in tests/adversary.rs).
  # Inherited pods: after a takeover (the snapshot's lease holder gone and its claim expired) the
  # new owner finds its inherited pods still labelled for that holder, because Runpod cannot
  # relabel a pod; the controller parks such a record in `ownership-lost`, and the pool
  # terminates the pod itself, only while its label names exactly the holder the snapshot
  # records. A pod labelled for any other controller is never terminated
  # (`a_pod_inherited_through_a_lease_takeover_is_served_or_stopped_by_its_new_owner` in
  # tests/adversary2.rs, `a_takeover_never_terminates_a_pod_a_third_controller_has_retagged` in
  # tests/round2.rs).
  # Creates: a create whose image differs from the model's declared one, or that names an
  # undeclared model, is not sent (`a_create_whose_image_differs_or_names_an_undeclared_model_is_not_sent`
  # in tests/runpod.rs). The pod's `VLLM_API_KEY` is the Runpod secret reference
  # `{{ RUNPOD_SECRET_<api_key_secret> }}`; no key value passes through this crate
  # (`the-create-request-carries-the-declared-vllm-settings`).
  # ESS-LIMIT: the request id is a readable prefix of at most 64 bytes
  # (`request-<controller>-<alias>-<generation>-`, cut short when long) followed by a 128-bit
  # digest of a length-prefixed encoding of controller, alias, generation, instant and a
  # per-process nonce: at most 96 bytes, and two different tuples never share an encoding. Its
  # value carries the nonce, so the scenarios observe it only as `recorded` or `unrecorded`
  # (`last_env`); `request_ids_differ_across_controller_and_alias_splits` and
  # `a_request_id_always_fits_the_identifier_limit` (src/pool.rs) and
  # `every_create_carries_a_request_id_naming_this_controller_and_unique_to_it` hold it.
  # Idle reaper: a pod is stopped once idle past `idle_timeout_ms`, never below its measured
  # cold start and never with a request in flight. A `StreamLease` holds the pod until it is
  # dropped; in-flight accounting is per deployment, so a lease on a retired pod does not hold
  # its replacement; the idle clock starts no earlier than the step that first finds the pod
  # ready (`an-idle-pod-is-reaped-and-the-next-request-cold-starts-again`,
  # `an-open-stream-lease-keeps-the-pod-from-being-reaped`,
  # `the-idle-limit-is-never-below-the-measured-cold-start`,
  # `a-stream-on-a-retired-pod-does-not-keep-its-replacement-from-being-reaped`,
  # `l10_a_pod_is_idle_only_from_the_step_that_first_finds_it_ready`).
  # Orphan sweep: pods in `b10x-llm-` carrying this controller's owner tag that no live record
  # holds, by exact key, or by request id for a record that holds no key yet; a record whose
  # model left the registry is stopped through the controller
  # (`the-orphan-sweep-terminates-only-this-controllers-unrecorded-pods`,
  # `a-second-pod-carrying-a-recorded-request-id-under-another-key-is-an-orphan`,
  # `a-model-removed-from-the-registry-has-its-pod-stopped-after-restart`).
  # Leases: the pool keeps a live claim on every record that may hold a pod, and must be stepped
  # (`ensure`, `reap`) more often than the policy's `lease_ms`: an expired lease is a stop
  # obligation (llm-gateway.hosting `StopReason.LeaseExpired`), and the next step carries it out
  # under a reacquired claim (`an_expired_lease_is_a_stop_obligation_the_pool_carries_out` in
  # tests/runpod.rs).
  # The embedding's calls, declared where the binary composes the pool (llm-gateway.deployment):
  # `invalidate` stops the model's current pod only when its endpoint is the failed authority's,
  # and a report about a replaced pod stops nothing
  # (`w7_invalidating_the_current_endpoint_stops_its_pod_and_the_next_ensure_starts_a_replacement`,
  # `w7_a_report_about_an_endpoint_that_is_not_current_stops_nothing`); `ensure_running` hands out
  # only a pod that is ready now and starts none
  # (`d2_ensure_running_hands_out_a_ready_pod_and_never_starts_one`). Dropping a pool stops no
  # pod: pods outlive the process, and a pool started with no records sweeps every pod its
  # controller created as an orphan in its first cleanup pass (`the-orphan-sweep-terminates-only-this-controllers-unrecorded-pods`).
  - name: llm-gateway.runpod.Pool
    identity: {name: id, type: String}
    fields:
      - {name: controller_id, type: String}
      - {name: provider_id, type: String}
      - {name: account_id, type: String}
    relations:
      - {name: controller, kind: references, target: llm-gateway.hosting.Controller, cardinality: one, via: controller_id}
    lifecycle: {initial: Declared, states: [Declared], terminal: [Declared]}
  - name: llm-gateway.runpod.ExecutionObservation
    identity: {name: observation_id, type: String}
    fields: &execution_facts
      - {name: valid_program, type: Boolean}
      # Why the pool could not be constructed or restored, e.g. `invalid-model:no-gpu`.
      - {name: error_code, type: 'Optional<String>'}
      # One entry per step, in order: `ok`, `ready`, or `err:<pool refusal code>`.
      - {name: results, type: 'List<String>'}
      # Control-plane counters read from the emulator. Absent, never zero, when no emulator
      # was ever built.
      - {name: create_calls, type: 'Optional<Integer>'}
      - {name: lists, type: 'Optional<Integer>'}
      # The GPU type of every create request submitted, in order.
      - {name: requested_gpus, type: 'List<String>'}
      # Pod ids the emulator terminated, in order.
      - {name: terminations, type: 'List<String>'}
      # Pods that still exist, as `<id>:<name>:<status>`.
      - {name: pods, type: 'List<String>'}
      # Every ready lease handed out, as `<endpoint or none> <served model or unreported>`.
      # An endpoint is the pod's inference base URL as llm's Runpod provider description builds
      # it (b10x-llm-providers 0.5.0, `descriptions::runpod().inference_base_url(<pod id>)`):
      # `https://<pod id>-8000.proxy.runpod.net/v1/`, `/v1/` included. Only a running pod whose
      # id the description accepts (1-48 bytes of `[a-z0-9]`) has one; any other pod reports
      # none. A running pod with no endpoint is observed `ready=false` whatever its probe
      # answers, so no ready lease is handed out without an endpoint and its startup deadline
      # retires it. The emulator issues the ids `pod1`, `pod2`, … in creation order.
      - {name: leases, type: 'List<String>'}
      # Every cleanup pass, as `idle=[..] retired=[..] replaced=[..] orphans=[..]`.
      - {name: cleanups, type: 'List<String>'}
      # The controller's records after the last step, as `<deployment>:<phase>`.
      - {name: phases, type: 'List<String>'}
      # What each record last observed, as `<deployment> ready=<..> served=<..> endpoint=<..>`;
      # a fact the provider did not report is `unreported`, never the requested value. The
      # endpoint has the form `leases` declares.
      - {name: observed, type: 'List<String>'}
      # llm-gateway.hosting.Totals, read from the pool's view after the last step.
      - {name: stop_required, type: 'List<String>'}
      - {name: transferred, type: 'List<String>'}
      # The last create request: its placement fields, its vLLM entrypoint, and its environment
      # as `KEY=value`. The request tag is reported as `recorded` when it is exactly the request
      # id the controller's record holds, and `unrecorded` otherwise, because its value carries
      # a per-process nonce (pool.rs request_id).
      - {name: last_request, type: 'Optional<String>'}
      - {name: last_entrypoint, type: 'List<String>'}
      - {name: last_env, type: 'List<String>'}
    lifecycle: {initial: Observed, states: [Observed], terminal: [Observed]}
commands:
  - name: llm-gateway.runpod.Exercise
    input:
      # A bounded fixture program: model declarations, emulator arrangements and pool calls.
      - {name: program_json, type: String}
    outcomes:
      - name: observed
        emits: [llm-gateway.runpod.Exercised]
        payload:
          llm-gateway.runpod.Exercised:
            valid_program: {generated: true}
        summary: Observe the real pool's answers, pod calls, leases and cleanup over the emulator.
events:
  # Test-adapter notification only; there is no production notification transport.
  - name: llm-gateway.runpod.Exercised
    fields:
      - {name: valid_program, type: Boolean}
views:
  - name: llm-gateway.runpod.LastExecution
    source: llm-gateway.runpod.ExecutionObservation
    consistency: read_your_writes
    fields: *execution_facts

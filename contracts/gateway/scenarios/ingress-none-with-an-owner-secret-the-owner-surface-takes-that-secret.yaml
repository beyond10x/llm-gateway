type: ess-scenario/1
domain: llm-gateway.gateway
scenario: ingress-none-with-an-owner-secret-the-owner-surface-takes-that-secret
summary: with ingress_auth none and an owner secret, the counters are served to that secret and refused without it, and a repeated authorization is no refusal on a wire path
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","ingress_auth":"none","models":[{"alias":"open","upstream_model":"served-open","wires":["chat"]}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"chat-1\"}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"open\",\"messages\":[]}","credential":false,"headers":["authorization: Bearer one-0123456789abcdef0123456789abcdef","authorization: Bearer two-0123456789abcdef0123456789abcdef"]},{"step":"scrape"},{"step":"scrape","credential":false},{"step":"request","path":"/v1/routes","method":"GET","body":""},{"step":"request","path":"/v1/routes","method":"GET","body":"","credential":false,"headers":["authorization: Bearer a-guess-0123456789abcdef0123456789abcdef"]}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: null
    results:
    - 'ok'
    - '200 relayed'
    - '200 scraped'
    - '401 credential-absent'
    - '200 answered'
    - '401 credential-rejected'
    upstream:
    - 'pod-1 POST /v1/chat/completions {"model":"served-open","messages":[]}'
    authorizations:
    - 'absent'
    secret_upstream: false
    acquired: 1
    released: 1

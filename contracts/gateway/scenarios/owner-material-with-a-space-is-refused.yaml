type: ess-scenario/1
domain: llm-gateway.gateway
scenario: owner-material-with-a-space-is-refused
summary: owner material holding a byte that is not printable US-ASCII is refused as a token
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"owner token aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","steps":[]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    error_code: token:not-printable-ascii

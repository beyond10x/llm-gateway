type: ess-scenario/1
domain: llm-gateway.gateway
scenario: hosted-a-static-header-naming-the-endpoints-credential-header-composes-nothing
summary: an api-key endpoint whose static headers name its own credential header, in another case, is refused endpoint:headers, so the credential stays in its file and nothing is composed
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"keyed","upstream_model":"vendor-keyed","wires":["chat"],"endpoint":{"pod":"pod-1","scheme":"http","auth_kind":"api-key","credential":"endpoint-api-key-0123456789abcdef","credential_header":"x-api-key","headers":{"X-Api-Key":"inline-key-0123456789abcdef"}}}],"pods":[[]],"steps":[{"step":"mark_ready"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: 'endpoint:headers'
    results: []
    upstream: []
    connections: []
    acquired: 0

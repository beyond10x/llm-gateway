type: ess-scenario/1
domain: llm-gateway.gateway
scenario: sa-token-without-an-owner-secret-only-a-reviewed-token-is-admitted
summary: with ingress_auth service-account-token and no owner secret a reviewed token is relayed, any other bearer is credential-rejected, and the owner surface has no owner
timeline:
- at: '2026-11-21T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"","ingress_auth":"service-account-token","reviews":{"projected-token-of-the-coding-agent":"system:serviceaccount:agents:coding-agent"},"models":[{"alias":"code","upstream_model":"served-code","wires":["chat"]}],"pods":[[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"chat-1\"}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"code\",\"messages\":[]}","credential":false,"headers":["authorization: Bearer projected-token-of-the-coding-agent"]},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"code\",\"messages\":[]}","credential":false,"headers":["authorization: Bearer a-guess-0123456789abcdef0123456789abcdef"]},{"step":"request","path":"/v1/routes","method":"GET","body":"","credential":false,"headers":["authorization: Bearer projected-token-of-the-coding-agent"]}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: null
    results:
    - 'ok'
    - '200 relayed'
    - '401 credential-rejected'
    - '401 credential-rejected'
    records:
    - model=code wire=chat disposition=Relayed refusal=absent status=200 target_status=200 response_bytes=15 duration_ms=bounded tokens=absent principal=system:serviceaccount:agents:coding-agent
    upstream:
    - 'pod-1 POST /v1/chat/completions {"model":"served-code","messages":[]}'
    acquired: 1
    released: 1

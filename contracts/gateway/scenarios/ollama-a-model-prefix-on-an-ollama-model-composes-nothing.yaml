type: ess-scenario/1
domain: llm-gateway.gateway
scenario: ollama-a-model-prefix-on-an-ollama-model-composes-nothing
summary: the binary refuses model_prefix on a kind = "ollama" table as config:value, since its status is read for upstream_model alone, and nothing is composed
timeline:
- at: '2026-11-25T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","document":"listen = \"127.0.0.1:0\"\nowner_secret_file = \"/run/credentials/owner\"\n\n[hosted.local]\nkind = \"ollama\"\nbase_url = \"http://10.0.0.7:8000\"\nupstream_model = \"qwen2.5:1.5b\"\nmodel_prefix = \"llama3\"\n","withheld":["10.0.0.7"],"steps":[{"step":"mark_ready"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    valid_program: true
    error_code: 'config:value'
    results: []
    secret_on_wire: null
    withheld_on_wire: null

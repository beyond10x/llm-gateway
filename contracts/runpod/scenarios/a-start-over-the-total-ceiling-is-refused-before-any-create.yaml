type: ess-scenario/1
domain: llm-gateway.runpod
scenario: a-start-over-the-total-ceiling-is-refused-before-any-create
summary: a projected total spend past the total ceiling refuses the start with the excess and sends no create
timeline:
- at: '2026-10-16T12:00:00Z'
  command: llm-gateway.runpod.Exercise
  input:
    program_json: '{"models":{"qwen":{"price_per_hour_usd":2,"startup_deadline_ms":1800000}},"spend":{"total_cap_usd":100},"steps":[{"step":"account_spend","daily_usd":0,"total_usd":99.5},{"step":"ensure","alias":"qwen"}]}'
  outcome: observed
assert:
- view: llm-gateway.runpod.LastExecution
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.runpod.LastExecution
  contains:
    results:
    - ok
    - err:spend-ceiling:total:over_usd=0.500000
    create_calls: 0
    spend_reads: 1
    requested_gpus: []
    pods: []
    phases:
    - qwen-1:cancelled
    stop_required: []

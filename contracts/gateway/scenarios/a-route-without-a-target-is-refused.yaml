type: ess-scenario/1
domain: llm-gateway.gateway
scenario: a-route-without-a-target-is-refused
summary: a route no catalog could produce composes no gateway
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.gateway.Exchange
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","inventory":{"routes":[{"route_id":"r0","alias":"a0","fallback_enabled":false,"targets":[]}]},"steps":[]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastExchange
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastExchange
  contains:
    error_code: inventory:route-without-target

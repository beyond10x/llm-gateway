apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-gateway
  namespace: agent-credentials
data:
  gateway.toml: |
    listen = "0.0.0.0:8080"
    ingress_auth = "none"

    [hosted.claude]
    wires = ["messages"]
    base_url = "https://api.anthropic.com"
    auth_kind = "api-key"
    credential_file = "/run/llm-gateway/provider-key"
    credential_header = "x-api-key"
    upstream_model = "replace-with-the-provider-model-id"

    [hosted.claude.headers]
    anthropic-version = "2023-06-01"
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-gateway-secrets
  namespace: agent-credentials
type: Opaque
stringData:
  provider-key: "replace-with-the-provider-api-key"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: agent-credentials
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 330
      initContainers:
        - name: copy-secrets
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              set -e
              for file in provider-key; do
                rm -f "/run/llm-gateway/$file"
                cp "/in/$file" "/run/llm-gateway/$file"
                chmod 0400 "/run/llm-gateway/$file"
                chown 65532:65532 "/run/llm-gateway/$file"
              done
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: secrets-in
              mountPath: /in/provider-key
              subPath: provider-key
              readOnly: true
            - name: secrets
              mountPath: /run/llm-gateway
      containers:
        - name: gateway
          image: ghcr.io/beyond10x/llm-gateway:<version>
          args: ["--config", "/etc/llm-gateway/gateway.toml"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/llm-gateway/gateway.toml
              subPath: gateway.toml
              readOnly: true
            - name: secrets
              mountPath: /run/llm-gateway
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: llm-gateway
        - name: secrets-in
          secret:
            secretName: llm-gateway-secrets
            defaultMode: 0400
        - name: secrets
          emptyDir:
            medium: Memory
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
  namespace: agent-credentials
spec:
  type: ClusterIP
  selector:
    app: llm-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

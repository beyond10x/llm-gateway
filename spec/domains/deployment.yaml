  #                      alone and is `config:schema` here)
  #   credential_file    absent exactly when `auth_kind` is `anonymous`; read through the
  #                      trusted-file reader (`endpoint-credential:<rule>`). A credential goes
  #                      over `https`, or over `http` to a loopback host only (`base_url`)
  #   credential_header  present exactly when `auth_kind` is `api-key`: 1..=64 RFC 9110 token
  #                      characters, matched without regard to case, and none of the headers
  #                      the gateway writes or that frame a message (`host`, `authorization`,
  #                      `content-type`, `content-length`, `connection`, `transfer-encoding`,
  #                      `te`, `trailer`, `upgrade`, `expect`, `keep-alive`,
  #                      `proxy-authorization`, `proxy-connection`)
  #   headers            optional table of static, non-secret request headers, name to string
  #                      value, written into every request head sent to the endpoint
  #                      (llm-gateway.gateway `Relay`, step 7): at most 32 entries; a name is
  #                      1..=64 RFC 9110 token characters, matched without regard to case and
  #                      written lowercase, two names equal without regard to case are refused,
  #                      and a name is none of the headers `credential_header` may not be (below)
  #                      and not the endpoint's own `credential_header`: a credential stays in
  #                      `credential_file`; a value is 1..=1024 bytes of 0x20-0x7e with no
  #                      leading or trailing space, so no CR, LF or NUL. The refusal names
  #                      `hosted.<alias>.headers` and quotes no value.
  #                      DECIDED 2026-10-16 (story:hosted-static-headers): a vendor API needs
  #                      headers of its own (Anthropic's `anthropic-version`, OpenRouter's
  #                      `HTTP-Referer` and `X-Title`), and no client header is forwarded, so the
  #                      document declares them per endpoint. On an OpenCode Go base URL a static
  #                      `x-opencode-session` is only a fallback for a caller with no valid
  #                      session and no peer address (story:relayed-session-header)
  #   billing_kind       `metered`, `subscription` or `self-hosted`, default `metered`
  #   upstream_model     1..=256 printable ASCII, default the alias
  #   context_window     optional, 4096..=2000000: what the public routes publish
  #   tool_calling       as a model's, default `absent`
  #   reasoning_effort   optional, `low`, `medium` or `xhigh` (HostedReasoningEffort), absent
  #                      by default; any other string, `high` and `max` included, is
  #                      `config:value`. A messages-wire request that names no effort reaches
  #                      the endpoint with this one (llm-gateway.gateway `Relay`, step 6)
  #   kind               `endpoint` (default) or `bedrock` (llm-gateway.upstream.HostedKind);
  #                      any other string is `config:schema`. Every rule above is an
  #                      `endpoint`'s; each key below is a `bedrock` model's, and is
  #                      `config:value` naming `hosted.<alias>.<key>` on an endpoint
  # A `kind = "bedrock"` model (DECIDED 2026-10-23, story:bedrock-hosted-target): `wires`,
  # `base_url`, `auth_kind`, `credential_file`, `credential_header`, `upstream_model`,
  # `reasoning_effort` and `headers` are each `config:value` naming the key. Its rules, each a
  # `config:value` that names the key and never quotes the value:

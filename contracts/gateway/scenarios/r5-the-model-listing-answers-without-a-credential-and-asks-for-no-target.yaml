type: ess-scenario/1
domain: llm-gateway.gateway
scenario: r5-the-model-listing-answers-without-a-credential-and-asks-for-no-target
summary: GET and HEAD /v1/models answer without a credential in the OpenAI list shape, one entry per model with its max_model_len and wires, and ask the target source for nothing
timeline:
- at: '2026-10-08T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"small","upstream_model":"served-small","wires":["messages","chat"]},{"alias":"code","upstream_model":"served-code","wires":["chat","responses","messages"],"tool_calling":"parsed","max_model_len":32768,"context_window":65536}],"pods":[],"steps":[{"step":"mark_ready"},{"step":"request","method":"GET","path":"/v1/models","body":"","credential":false},{"step":"request","method":"HEAD","path":"/v1/models","body":"","credential":false}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    results:
    - ok
    - 200 answered
    - 200 answered
    bodies:
    - '{"object":"list","data":[{"id":"code","object":"model","owned_by":"llm-gateway","max_model_len":32768,"wires":["chat","responses","messages"]},{"id":"small","object":"model","owned_by":"llm-gateway","wires":["messages","chat"]}]}'
    - ''
    headers:
    - content-type=application/json cache-control=no-store allow=absent
    - content-type=application/json cache-control=no-store allow=absent
    upstream: []
    records: []
    acquired: 0

type: ess-scenario/1
domain: llm-gateway.runpod
scenario: a-model-without-a-volume-carries-no-placement-or-cache-override
summary: no declared volume means no volume, mount, data center or HF_HOME on the create
timeline:
- at: '2026-09-27T12:00:00Z'
  command: llm-gateway.runpod.Exercise
  input:
    program_json: '{"models":{"qwen":{}},"steps":[{"step":"until_ready","alias":"qwen"}]}'

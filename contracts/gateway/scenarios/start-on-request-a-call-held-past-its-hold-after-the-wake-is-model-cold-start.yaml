type: ess-scenario/1
domain: llm-gateway.gateway
scenario: start-on-request-a-call-held-past-its-hold-after-the-wake-is-model-cold-start
summary: with start_on_request absent, a call held on the pod the owner's wake started that still starts when its one-second hold passes is model-cold-start with retry-after 30, and no second pod is created
timeline:
- at: '2026-11-25T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"small","upstream_model":"small","wires":["chat"]}],"pods":[[]],"runpod":{"document":"listen = \"127.0.0.1:0\"\nowner_secret_file = \"/run/owner-secret\"\n\n[providers.runpod]\nkind = \"runpod-vllm\"\n\n[models.small]\nprovider = \"runpod\"\nwires = [\"chat\"]\ncontext_window = 65536\nhf_model = \"example/small-model\"\nimage = \"vllm/vllm-openai:v0.27.1\"\ngpu_types = [\"NVIDIA L40S\"]\nmax_model_len = 1024\nrequest_hold_seconds = 1\n","ready_after":64},"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/models/small/wake","body":""},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"small\"}"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    error_code: null
    results:
    - ok
    - 202 answered
    - 503 model-cold-start
    retry_after:
    - absent
    - '30'
    records:
    - model=small wire=chat disposition=Refused refusal=model-cold-start status=503 target_status=absent response_bytes=0 duration_ms=bounded tokens=absent
    acquired: 1
    upstream: []
    lifecycle_asks:
    - wake small
    pod_creates: 1

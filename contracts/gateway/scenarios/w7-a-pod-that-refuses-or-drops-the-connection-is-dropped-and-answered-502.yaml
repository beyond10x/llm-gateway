type: ess-scenario/1
domain: llm-gateway.gateway
scenario: w7-a-pod-that-refuses-or-drops-the-connection-is-dropped-and-answered-502
summary: a refused connection and a connection closed without an answer are transport failures, answered upstream-failed and reported against that pod
timeline:
- at: '2026-10-05T12:00:00Z'
  command: llm-gateway.gateway.Relay
  input:
    program_json: '{"secret":"owner-token-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","models":[{"alias":"code","upstream_model":"served-code","wires":["chat","responses","messages"]}],"pods":[[{"transport":"refused"}],[{"transport":"closed"}],[{"status":200,"content_type":"application/json","chunks":["{\"id\":\"replacement\"}"]}]],"steps":[{"step":"mark_ready"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"code\"}"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"code\"}"},{"step":"request","path":"/v1/chat/completions","body":"{\"model\":\"code\"}"}]}'
  outcome: observed
assert:
- view: llm-gateway.gateway.LastRelay
  counts:
    at_least: 1
    at_most: 1
- view: llm-gateway.gateway.LastRelay
  contains:
    valid_program: true
    results:
    - ok
    - 502 upstream-failed
    - 502 upstream-failed
    - 200 relayed
    bodies:
    - '{"error":{"code":"upstream-failed","message":"the model target could not be reached or failed; the next request asks for a replacement"}}'
    - '{"error":{"code":"upstream-failed","message":"the model target could not be reached or failed; the next request asks for a replacement"}}'
    - '{"id":"replacement"}'
    upstream:
    - 'pod-2 POST /v1/chat/completions {"model":"served-code"}'
    - 'pod-3 POST /v1/chat/completions {"model":"served-code"}'
    acquired: 3
    invalidated:
    - pod-1
    - pod-2
    released: 3
